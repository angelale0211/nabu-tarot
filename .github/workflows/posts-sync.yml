name: Mirror posts and availability from the app cloud

# Every hour, copy what Nabu saved in the dashboard (Firestore content/posts
# and content/schedule) into posts.json and schedule.json, so the repo shows
# the same posts the app shows and the offline fallback stays current.
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch from the app cloud
        run: python scripts/posts_sync.py
      - name: Commit if changed
        run: |
          git config user.name "nabu-sync"
          git config user.email "nabu-sync@users.noreply.github.com"
          git add posts.json schedule.json activities.json
          if git diff --cached --quiet; then
            echo "nothing changed, so nothing to save"
            exit 0
          fi
          git commit -m "Mirror posts and availability"
          # Somebody may have pushed while this job was working. Take what
          # landed, put this commit on top of it, and try again.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push refused; rebasing onto what landed meanwhile (attempt $attempt)"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || exit 1
          done
          echo "could not save after three attempts"
          exit 1
