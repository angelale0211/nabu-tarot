name: Mirror posts and availability from the app cloud

# Every hour, copy what Nabu saved in the dashboard (Firestore content/posts
# and content/schedule) into posts.json and schedule.json, so the repo shows
# the same posts the app shows and the offline fallback stays current.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch from the app cloud
        run: python scripts/posts_sync.py
      - name: Commit if changed
        run: |
          git config user.name "nabu-sync"
          git config user.email "nabu-sync@users.noreply.github.com"
          git add posts.json schedule.json
          git diff --cached --quiet || (git commit -m "Mirror posts and availability" && git push)
