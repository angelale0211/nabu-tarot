name: Update weekly and monthly horoscopes

# Refreshes horoscope.json every day from Horoscope.com's general forecasts,
# translated to Vietnamese, so the home screen can show the visitor's sign.
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch forecasts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/horoscope_sync.py
      - name: Commit if changed
        run: |
          git config user.name "nabu-sync"
          git config user.email "nabu-sync@users.noreply.github.com"
          git add horoscope.json
          if git diff --cached --quiet; then
            echo "nothing changed, so nothing to save"
            exit 0
          fi
          git commit -m "Update horoscopes"
          # Somebody may have pushed while this job was working. Take what
          # landed, put this commit on top of it, and try again.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push refused; rebasing onto what landed meanwhile (attempt $attempt)"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || exit 1
          done
          echo "could not save after three attempts"
          exit 1
