name: Update weekly and monthly horoscopes

# Writes horoscope.json every day from Nabu's own text, composed from where the
# Sun and Moon actually are: the Sun's sign gives each sign its house for the
# month, the Moon's gives it for the week, and the Moon's phase gives the timing.
# Nothing is fetched and nothing is translated, so nothing here belongs to
# anybody else.
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write the forecasts
        run: python scripts/horoscope_write.py
      - name: Commit if changed
        run: |
          git config user.name "nabu-sync"
          git config user.email "nabu-sync@users.noreply.github.com"
          git add horoscope.json
          if git diff --cached --quiet; then
            echo "nothing changed, so nothing to save"
            exit 0
          fi
          git commit -m "Update horoscopes"
          # Somebody may have pushed while this job was working. Take what
          # landed, put this commit on top of it, and try again.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push refused; rebasing onto what landed meanwhile (attempt $attempt)"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || exit 1
          done
          echo "could not save after three attempts"
          exit 1
