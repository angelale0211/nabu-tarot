name: Update weekly and monthly horoscopes

# Refreshes horoscope.json every day from Horoscope.com's general forecasts,
# translated to Vietnamese, so the home screen can show the visitor's sign.
on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch forecasts
        run: python scripts/horoscope_sync.py
      - name: Commit if changed
        run: |
          git config user.name "nabu-sync"
          git config user.email "nabu-sync@users.noreply.github.com"
          git add horoscope.json
          git diff --cached --quiet || git commit -m "Update horoscopes" && git push
