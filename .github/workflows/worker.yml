# The worker holds the API keys and is the only part of Nabu Tarot with a bill
# attached, and until now it was deployed by hand from a laptop. That means the
# thing running in front of the money is whatever somebody last remembered to
# push. This checks it on every change and deploys it when main moves.
#
# Deploying needs one repository secret: CLOUDFLARE_API_TOKEN, made at
# Cloudflare dashboard > My Profile > API Tokens > Edit Cloudflare Workers.
# Without it the check still runs and the deploy step is skipped, so a fork or
# a pull request cannot deploy and does not fail for not being able to.
name: worker

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  pull_request:
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install

      # TypeScript is not run by wrangler when it deploys, so a mistake in the
      # types reaches production as a runtime error. This is the only place it
      # gets caught.
      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set, so the worker was NOT deployed."
            echo "The live worker is still whatever was last pushed by hand, and it is now"
            echo "older than this commit. Add the secret at Settings > Secrets and variables"
            echo "> Actions, then re-run this workflow."
            # This used to `exit 0`, so the run went green while deploying nothing.
            # That is exactly how the four subscription ids sat undeployed from
            # 2026-09-08 until 2026-09-09: every buyer got "unknown product" while
            # the badge said the worker was fine. A deploy that cannot deploy must
            # be loud. Forks are spared because they are not this repository.
            if [ "$GITHUB_REPOSITORY" = "angelale0211/nabu-tarot" ]; then exit 1; fi
            echo "Not the upstream repository, so this is not treated as a failure."
            exit 0
          fi
          # Said out loud before the deploy, because the log of a failed deploy
          # is the only place this can be read, and reading it needs admin
          # rights on the repository. `whoami` is the one that matters: if the
          # token can see more than one account, wrangler cannot choose between
          # them without an account_id in wrangler.toml and stops here.
          echo "::group::deploy diagnostics"
          echo "token length: ${#CLOUDFLARE_API_TOKEN} (value never printed)"
          echo "--- wrangler version ---"
          npx wrangler --version || echo "(could not read version)"
          echo "--- whoami: which account(s) this token can see ---"
          npx wrangler whoami || echo "(whoami failed - usually a token scope problem)"
          echo "::endgroup::"
          npx wrangler deploy
