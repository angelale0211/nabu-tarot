name = "nabu-ai"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# The answer of last resort. With no GEMINI_API_KEY and no ANTHROPIC_API_KEY
# set, this binding is the only thing standing between a reader and "Nabu AI is
# not switched on" - it answers with an open model on Workers AI, on the free
# tier, with no key to buy and nothing to configure. It cannot look anything up
# on the web; a key can. It was commented out, and with no key set either, every
# question the app has ever asked fell through to the app's own knowledge base
# with "the AI is busy" printed under it.
[ai]
binding = "AI"

# Every six hours: refunds taken back, subscriptions re-read. Minute 10 so it
# never lands on the hour with every other cron job everyone else schedules.
[triggers]
crons = ["10 */6 * * *"]

# Logs, declared here rather than switched on in the dashboard, because
# `wrangler deploy` applies this file as the whole truth: a setting that lives
# only in the dashboard is turned back off by the next deploy, quietly.
#
# They are worth having. This worker answers /billing, and when it refuses a
# purchase it says only "check failed" to the phone - the real reason goes to
# console.error, which went nowhere at all while logging was off. A buyer's
# money was on the other side of that silence for two days.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[vars]
ALLOWED_ORIGIN = "https://nabutarot.com"
# Whose sign-ins this worker accepts. While it is empty the worker answers
# anybody, exactly as it did before, so this can be deployed before the app is
# sending a token. Set it once the app is, and asking needs an account.
FIREBASE_PROJECT_ID = "nabutarot"
# The Android app, for checking Play purchases.
ANDROID_PACKAGE = "app.nabutarot.twa"
# Pub/Sub pushes Play's notifications here. The audience is this URL, given
# to the push subscription; the email is the service account it pushes as.
RTDN_AUDIENCE = "https://nabu-ai.0211nhatanh.workers.dev/rtdn"
RTDN_PUSH_EMAIL = "nabu-worker@nabutarot.iam.gserviceaccount.com"

# Where the per-person counts live. Without it the worker still answers and
# says so in its logs, but nothing is limited at all - which is how Nabu AI
# ran uncapped on the day it first worked.
#
# The namespace is titled NABU_LIMITS; the binding is KV, which is the name
# limit.ts reads. Those two do not have to match and here they do not: the
# title is for the dashboard, the binding is for the code.
#   npx wrangler kv namespace create NABU_LIMITS
[[kv_namespaces]]
binding = "KV"
id = "fe90fd7038bf476b8f167676dc19c730"

# Secrets (never in this file):
#   npx wrangler secret put GEMINI_API_KEY      (Gemini answers, key never in the browser)
#   npx wrangler secret put ANTHROPIC_API_KEY   (Claude answers; optional)
#   npx wrangler secret put RESEND_API_KEY      (booking invitations by email; resend.com free tier)
#   npx wrangler secret put PLAY_SERVICE_ACCOUNT (the whole service-account JSON; checks Play purchases,
#                                                reads the code book and writes access - /billing and /redeem
#                                                answer "not configured" until it and FIREBASE_PROJECT_ID are set)
