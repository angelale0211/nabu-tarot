<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Nabu Tarot tests</title></head>
<body>
<iframe id="f" src="../index.html#/home" style="width:430px;height:900px"></iframe>
<pre id="results">running</pre>
<script>
const out = [];
const ok = (cond, msg) => out.push((cond ? 'PASS ' : 'FAIL ') + msg);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.getElementById('f');
const W = () => f.contentWindow, D = () => f.contentDocument;
const VI = /[ăâđêôơưàảãáạằẳẵắặầẩẫấậèẻẽéẹềểễếệìỉĩíịòỏõóọồổỗốộờởỡớợùủũúụừửữứựỳỷỹýỵ]/i;
async function waitFor(fn, ms) { const t0 = Date.now(); while (Date.now() - t0 < (ms || 6000)) { try { if (fn()) return true; } catch (e) {} await sleep(60); } return false; }
async function go(hash, sel) { W().location.hash = hash; await sleep(30); return waitFor(() => D().querySelector(sel), 5000); }

(async () => {
  try {
    await waitFor(() => D() && D().querySelector('#nav a'), 8000);
    const w = W(), d = D(), N = w.NABU;
    // data
    ok(N.DECK.vi.length === 78 && N.DECK.en.length === 78, 'deck has 78 cards in both languages');
    ok(Object.keys(N.INSIGHT.en).length === 78 && Object.keys(N.INSIGHT.vi).length === 78, 'insights cover 78 cards in EN and VI');
    ok(N.DECK.vi.every((c) => { const i = N.insightOf(c.id, 'vi'), j = N.insightOf(c.id, 'en'); return i && j && i.pos.length >= 3 && i.neg.length >= 3 && j.pos.length >= 3 && [i.now, i.love, i.work, i.study, i.money, i.advice, j.now, j.love, j.work, j.study, j.money, j.advice].every((t) => t && t.length > 10); }), 'every insight has keywords and six texts in both languages');
    ok(Object.keys(N.KW.vi).length === 78 && Object.keys(N.ASK.vi).length === 78, 'Vietnamese lecture keywords and questions cover 78 cards');
    ok(N.TOPICS.length === 5 && N.TOPICS[1].q.vi[4] === 'Mình nên tiếp tục chờ đợi hay buông bỏ?', 'preset topics verbatim');

    ok(N.lifePath(1998, 11, 27) === 11 && N.lifePath(1990, 2, 11) === 5 && N.lifePath(1995, 3, 12) === 3, 'life path arithmetic');

    ok(/Chào bạn/.test(d.querySelector('h1').textContent) && d.querySelector('h1').nextElementSibling.nextElementSibling.classList.contains('pickcta') && d.querySelector('#today').compareDocumentPosition(d.querySelector('h1')) & 4, 'greeting sits below the date panel, right above the quick links');

    ok(l1.day === 1 && l1.month === 1 && l1.year === 2025 && l2.day === 1 && l2.month === 1 && l2.year === 2024 && l3.day === 23 && l3.month === 7 && l3.year === 2026, 'lunar algorithm matches lịch vạn niên: Tết 2025 = 29/1, Tết 2024 = 10/2, 4/9/2026 = 23/7 âm lịch');

    let mixed = 0;
    for (const c of N.DECK.en) for (const fo of ['general', 'love', 'work', 'study', 'money']) { const h = N.insightHTML(c.id, fo); if (VI.test(h.replace(/<[^>]+>/g, '')) || h.length < 200) mixed++; }

    await go('#/learn', '.tile');

    ok(d.querySelector('.lesson').compareDocumentPosition(d.querySelector('.paywall')) & 4 && /300\.000đ/.test(d.querySelector('.paywall').textContent) && d.querySelector('#ccode'), 'price and code entry sit below the demo');
    await go('#/learn/card/major-0', '.detail .hero');
    ok(/Gã Khờ/.test(d.querySelector('.name').textContent) && !d.querySelector('.paywall'), 'the demo card opens directly while locked');
    await go('#/learn/card/major-1', '.paywall');
    ok(!!d.querySelector('.paywall'), 'the second card is locked');
    await go('#/learn/tarot', '.paywall');
    d.querySelector('#ccode').value = 'NABU-T-270101-ZZZZ'; d.querySelector('#cunlock').click(); await sleep(50);
    ok(/Mã không đúng/.test(d.querySelector('#cstatus').textContent), 'a forged code is rejected');
    const codeT = N.makeCode('tarot', '2027-03-04');
    ok(/^NABU-T-270304-[A-Z0-9]{4}$/.test(codeT) && N.parseCode(codeT.toLowerCase()).until === '2027-03-04', 'code format and parsing');
    d.querySelector('#ccode').value = codeT; d.querySelector('#cunlock').click();
    await waitFor(() => d.querySelector('#ctabs'), 4000);
    ok(N.ACCESS.has('tarot') && d.querySelectorAll('#ctabs button').length === 4 && d.querySelectorAll('.lsn').length === 8, 'valid code unlocks the course: 8 sessions listed first');
    await go('#/learn/lesson/tarot/1', '.journey');
    ok(d.querySelectorAll('.journey .stage').length === 7 && d.querySelectorAll('.journey .vt').length === 78, 'session 1 draws the Fool journey (3 stages) and the 56 Minors in four element groups');
    ok(!!d.querySelector('.ai') && /Lá hoàng gia/.test(N.localAnswer('Lá hoàng gia là ai?', { type: 'lesson', course: 'tarot', n: 1 })), 'Nabu AI in the lesson finds course material');

    ok(d.querySelectorAll('.deckgrid button').length === 14, 'suit tab shows 14 cards');
    d.querySelector('#ctabs [data-t="spreads"]').click(); await sleep(50);
    ok(d.querySelectorAll('#cpanel .acc').length === 13, 'thirteen tarot spreads inside the course');
    d.querySelector('#ctabs [data-t="guides"]').click(); await sleep(50);
    ok(d.querySelectorAll('#cpanel .acc').length === 4, 'tarot guides inside the course');
    await go('#/learn/card/' + chosen, '.detail .hero');
    ok(/Nghĩa xuôi/.test(d.querySelector('#main').textContent) && /Các câu hỏi thường gặp/.test(d.querySelector('#main').textContent) && !/Tương ứng chiêm tinh/.test(d.querySelector('#main').textContent) && d.querySelectorAll('.qa').length >= 1, 'card page: meanings, FAQ heading, no astrology block');

    d.querySelector('#nname').value = 'Nguyễn Thị Lan'; d.querySelector('#nname').dispatchEvent(new w.Event('input'));
    const nn = N.numerologyOf('Nguyễn Thị Lan', '1998-08-05');
    ok(nn.expression === 6 && nn.soul === 9 && nn.personality === 6 && /Số vận mệnh/.test(d.querySelector('#nameout').textContent), 'name numbers computed with tone marks dropped');
    // booking with calendar
    await go('#/book?card=' + chosen, '.cal .days');
    await waitFor(() => d.querySelector('.cal .d.has'), 4000);
    ok(w.NABU.SERVICES.length === 7 && !w.NABU.SERVICES.some((x) => x.id === 'oracle') && w.NABU.SERVICES.some((x) => x.id === 'tea') && w.NABU.SERVICES.some((x) => x.id === 'talk'), 'seven services: no standalone oracle; tea, combos and just-talk present');
    ok(d.querySelectorAll('.svc').length === 7 && d.querySelectorAll('[data-pkg]').length === 26, 'price sheet renders every package');
    ok(/50\.000đ/.test(d.querySelector('.svc.blue').textContent) && /chỉ áp dụng với 5 chủ đề/.test(d.querySelector('.svc.blue').textContent) && /666\.000đ/.test(d.querySelectorAll('.svc')[5].textContent) && /60\.000đ/.test(d.querySelectorAll('.svc')[6].textContent), 'prices formatted in VND');
    ok(d.querySelectorAll('[data-topic]').length === 5 && /Chỉ áp dụng cho gói Xem chủ đề sẵn/.test(d.querySelector('#main').textContent), 'five preset topics only, with the note that they apply to the set-topic package');
    d.querySelector('[data-pkg="tarot/q3"]').click();
    ok(d.querySelector('[data-pkg="tarot/q3"]').classList.contains('on') && /Dịch vụ: Tarot – 3 câu chi tiết \(50\.000đ\)/.test(d.querySelector('#msgprev').textContent) && /không bắt buộc/.test(d.querySelector('#topicopt').textContent), 'package goes into the message; topic becomes optional');
    d.querySelector('[data-pkg="tuvi/year"]').click();
    ok(!d.querySelector('#birthwrap').hidden && d.querySelector('#bbirth').value === '1998-08-05', 'tử vi asks for birth date and time, prefilled from the profile');
    d.querySelector('[data-pkg="tarot/topic"]').click();
    ok(d.querySelector('#topicopt').textContent === '', 'set-topic package requires a topic');
    ok(d.querySelectorAll('.cal .d.has').length >= 5, 'calendar has days with free slots');
    d.querySelector('[data-topic="2"]').click();
    d.querySelector('.cal .d.has').click(); await sleep(50);
    ok(d.querySelectorAll('.slots button').length >= 1, 'day shows time slots');
    d.querySelector('.slots button').click(); await sleep(50);
    ok(!!d.querySelector('.picked') && /Giờ hẹn/.test(d.querySelector('#msgprev').textContent) && /giờ Việt Nam/.test(d.querySelector('#msgprev').textContent), 'chosen slot appears in the message');
    ok(/Chủ đề: #2 Người cũ/.test(d.querySelector('#msgprev').textContent) && /Tên: Lan/.test(d.querySelector('#msgprev').textContent), 'message has topic and name from profile');
    ok(/ig\.me\/m\/nabutarot/.test(d.querySelector('[data-send][href]').getAttribute('href')), 'instagram send link');
    // me: accounts off
    await go('#/prices', '.svc');
    ok(d.querySelectorAll('.svc').length === 9 && /300\.000đ/.test(d.querySelector('#main').textContent) && /Khóa Tarot/.test(d.querySelector('#main').textContent) && /chuyển khoản/.test(d.querySelector('.paynote').textContent), 'price sheet screen with the payment note');
    await go('#/me', '#pname');
    ok(/Hồ sơ đang lưu trên máy này/.test(d.body.textContent) && /Instagram/.test(d.body.textContent) && d.querySelectorAll('[data-auth]').length === 3 && /Nabu chưa bật đăng nhập/.test(d.body.textContent) && d.querySelectorAll('.course').length === 2 && /đang mở/.test(d.querySelector('.course').textContent), 'me tab: device-only profile, Instagram, my courses with status');
    // admin
    await go('#/admin', '#atabs');
    ok(d.querySelectorAll('#atabs button').length === 5 && d.querySelectorAll('#cgrid button').length === 78, 'admin has five tabs and the 78-card picker');
    d.querySelector('[data-t="codes"]').click(); await waitFor(() => d.querySelector('#cmake'), 4000);
    d.querySelector('#cstart').value = '2026-09-04'; d.querySelector('#cmake').click(); await sleep(50);
    ok(/^NABU-T-270304-[A-Z0-9]{4}$/.test(d.querySelector('#codeval').textContent) && N.parseCode(d.querySelector('#codeval').textContent).course === 'tarot', 'dashboard makes a six-month tarot code that the app accepts');
    d.querySelector('[data-t="schedule"]').click(); await waitFor(() => d.querySelector('.week .wd'), 4000);
    ok(d.querySelectorAll('.week .wd').length === 7 && d.querySelectorAll('.week .chip.on').length >= 15, 'availability editor shows the weekly hours');
    d.querySelector('[data-t="bookings"]').click(); await sleep(50);
    ok(/Firebase/.test(d.querySelector('#apanel').textContent), 'bookings tab explains that accounts are off');
    // theme
    // theme: headless Edge may report either system preference, so compare against the state before each click
    const bgOf = () => w.getComputedStyle(d.body).backgroundColor, DARK = 'rgb(36, 26, 69)', LIGHT = 'rgb(239, 233, 250)';
    const wasDark = bgOf() === DARK;
    d.querySelector('#theme').click();
    ok(d.documentElement.getAttribute('data-theme') === (wasDark ? 'light' : 'dark') && bgOf() === (wasDark ? LIGHT : DARK), 'header button flips the effective theme and the page repaints');
    d.querySelector('#theme').click();
    ok(bgOf() === (wasDark ? DARK : LIGHT), 'and flips back');
    await go('#/me', '[data-theme-pick]');
    ok(d.querySelectorAll('[data-theme-pick]').length === 3 && d.querySelector('[data-theme-pick].on'), 'Me tab offers auto / light / dark with the current one marked');
    d.querySelector('[data-theme-pick="dark"]').click();
    ok(d.documentElement.getAttribute('data-theme') === 'dark' && bgOf() === DARK, 'dark choice paints dark');
    d.querySelector('[data-theme-pick="light"]').click();
    ok(d.documentElement.getAttribute('data-theme') === 'light' && bgOf() === LIGHT, 'light choice paints light');
    d.querySelector('[data-theme-pick="auto"]').click();
    ok(!d.documentElement.getAttribute('data-theme') && JSON.parse(w.localStorage.getItem('nabu-theme')) === '' && bgOf() === (w.matchMedia('(prefers-color-scheme: dark)').matches ? DARK : LIGHT), 'auto follows the phone setting');
    d.querySelector('[data-theme-pick="light"]').click();
    ok(d.documentElement.scrollWidth <= 431, 'no horizontal overflow (' + d.documentElement.scrollWidth + ')');
  } catch (e) { out.push('FAIL exception: ' + (e && e.stack || e)); }
  document.getElementById('results').textContent = out.join('\n');
})();
</script>
</body></html>
