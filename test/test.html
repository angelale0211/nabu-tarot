<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Nabu Tarot tests</title></head>
<body>
<iframe id="f" src="../index.html#/home" style="width:430px;height:900px"></iframe>
<pre id="results">running</pre>
<script>
const out = [];
const ok = (cond, msg) => out.push((cond ? 'PASS ' : 'FAIL ') + msg);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.getElementById('f');
const W = () => f.contentWindow, D = () => f.contentDocument;
const VI = /[ăâđêôơưàảãáạằẳẵắặầẩẫấậèẻẽéẹềểễếệìỉĩíịòỏõóọồổỗốộờởỡớợùủũúụừửữứựỳỷỹýỵ]/i;
async function waitFor(fn, ms) { const t0 = Date.now(); while (Date.now() - t0 < (ms || 6000)) { try { if (fn()) return true; } catch (e) {} await sleep(60); } return false; }
async function go(hash, sel) { W().location.hash = hash; await sleep(30); return waitFor(() => D().querySelector(sel), 5000); }

(async () => {
  try {
    await waitFor(() => D() && D().querySelector('#nav a'), 8000);
    const w = W(), d = D(), N = w.NABU;
    // data
    ok(N.DECK.vi.length === 78 && N.DECK.en.length === 78, 'deck has 78 cards in both languages');
    ok(Object.keys(N.INSIGHT.en).length === 78 && Object.keys(N.INSIGHT.vi).length === 78, 'insights cover 78 cards in EN and VI');
    ok(N.DECK.vi.every((c) => { const i = N.insightOf(c.id, 'vi'), j = N.insightOf(c.id, 'en'); return i && j && i.pos.length >= 3 && i.neg.length >= 3 && j.pos.length >= 3 && [i.now, i.love, i.work, i.study, i.money, i.advice, j.now, j.love, j.work, j.study, j.money, j.advice].every((t) => t && t.length > 10); }), 'every insight has keywords and six texts in both languages');
    ok(Object.keys(N.KW.vi).length === 78 && Object.keys(N.ASK.vi).length === 78, 'Vietnamese lecture keywords and questions cover 78 cards');
    ok(N.TOPICS.length === 5 && N.TOPICS[1].q.vi[4] === 'Mình nên tiếp tục chờ đợi hay buông bỏ?', 'preset topics verbatim');
    ok(N.GUIDES.length >= 20 && N.GUIDES.every((g) => g.sections.length >= 2 && g.title.vi && g.title.en), 'guides present in both languages (' + N.GUIDES.length + ')');
    ok(!JSON.stringify(N.GUIDES).match(/Thu Anh/) && !d.querySelector('#main').textContent.match(/Thu Anh/), 'no source names in guides or on screen');
    ok(N.sunSignIndex(8, 5) === 4 && N.sunSignIndex(1, 10) === 9 && N.sunSignIndex(3, 21) === 0 && N.sunSignIndex(12, 25) === 9, 'sun sign boundaries');
    ok(N.lifePath(1998, 11, 27) === 11 && N.lifePath(1990, 2, 11) === 5 && N.lifePath(1995, 3, 12) === 3, 'life path arithmetic');
    // home
    ok(/Chào bạn/.test(d.querySelector('h1').textContent) && d.querySelector('h1').nextElementSibling.nextElementSibling.classList.contains('pickcta') && d.querySelector('#today').compareDocumentPosition(d.querySelector('h1')) & 4, 'greeting sits below the date panel, right above the quick links');
    ok(d.querySelector('#today') && /Âm lịch/.test(d.querySelector('#today').textContent) && /Ngày \d+ tháng \d+ năm \S+ \S+ \(\d{4}\)/.test(d.querySelector('#today').textContent) && /Can chi/.test(d.querySelector('#today').textContent) && /Trăng/.test(d.querySelector('#today').textContent), 'today panel: full lunar date with year name, can chi and the moon');
    const lt = N.lunarToday(new Date(2026, 8, 5));
    ok(lt.yearAn === 'Horse' && lt.monthAn === 'Monkey' && lt.dayAn === 'Horse' && /Bính Ngọ/.test(lt.yearCC), 'English lunar names use the animal: 5/9/2026 is a Horse day in the Monkey month of the Horse year');
    const l1 = N.solarToLunar(29, 1, 2025), l2 = N.solarToLunar(10, 2, 2024), l3 = N.solarToLunar(4, 9, 2026);
    ok(l1.day === 1 && l1.month === 1 && l1.year === 2025 && l2.day === 1 && l2.month === 1 && l2.year === 2024 && l3.day === 23 && l3.month === 7 && l3.year === 2026, 'lunar algorithm matches lịch vạn niên: Tết 2025 = 29/1, Tết 2024 = 10/2, 4/9/2026 = 23/7 âm lịch');
    ok(typeof w.chatBarHTML === 'function' && (/data-chat-img/.test(w.chatBarHTML('a', 'b', 'x')) === !!(N.CONFIG.attachments || N.CONFIG.chatImages)) && /data-chat-emoji/.test(w.chatBarHTML('a', 'b', 'x')) && typeof w.notifyBooking === 'function' && N.CONFIG.firebase && N.CONFIG.firebase.projectId === 'nabutarot' && N.CONFIG.adminEmails.indexOf('nabutarot@outlook.com') === 0, 'Firebase project wired with admin emails; chat attachments follow CONFIG.attachments; bookings notify the calendar endpoint');
    ok(/Nabu Tarot/.test(d.querySelector('#brand .lockup').textContent) && /^data:image\/png/.test(d.querySelector('#brand .lockup img').getAttribute('src')) && d.querySelector('#foot .lockup img'), 'header and footer show the real round avatar with the wordmark');
    ok(d.querySelector('#foot') && /Instagram/.test(d.querySelector('#foot').textContent) && /Facebook/.test(d.querySelector('#foot').textContent) && /©/.test(d.querySelector('#foot').textContent) && /Báo lỗi/.test(d.querySelector('#foot').textContent), 'footer with Instagram, Facebook, copyright and the bug-report link');
    ok(!!d.querySelector('#tour'), 'tour shows on first visit');
    ok(d.querySelectorAll('.tile').length === 6 && /Bảng giá/.test(d.querySelector('.tiles').textContent), 'six quick links incl. prices');
    ok(d.querySelectorAll('.tiles .pickico').length >= 2 && /#FBF3F5/.test(d.querySelector('.tiles a[href="#/pick"]').innerHTML) && /#3D2A6E/.test(d.querySelector('.tiles a[href="#/learn/tarot"]').innerHTML) && !/🃏/.test(d.querySelector('#main').innerHTML), 'draw tile has the lifted cream card, Tarot tile the purple logo card');
    ok(d.querySelector('.pickcta') && /Rút một lá bài hôm nay/.test(d.querySelector('.pickcta').textContent) && d.querySelector('.pickcta').getAttribute('href') === '#/pick' && d.querySelectorAll('.pickcta svg').length === 3 && /#AFC8F0/.test(d.querySelector('.pickcta').innerHTML) && /#F6BBCB/.test(d.querySelector('.pickcta').innerHTML), 'big pick-a-card block shows the three logo cards and leads to the draw');
    ok(/rotate\(-10/.test(d.querySelector('#nav a[href="#/pick"] svg').innerHTML), 'pick tab uses the two-card line icon');
    ok(!d.querySelector('[data-tour="prev"]'), 'step one of the tour has no back arrow');
    d.querySelector('[data-tour="next"]').click(); await sleep(30); d.querySelector('[data-tour="next"]').click(); await sleep(30);
    ok(/3 \/ 5/.test(d.querySelector('#tour').textContent) && d.querySelector('[data-tour="prev"]'), 'later steps show a back arrow');
    d.querySelector('[data-tour="prev"]').click(); await sleep(30);
    ok(/2 \/ 5/.test(d.querySelector('#tour').textContent), 'the back arrow steps back');
    for (let i = 0; i < 6 && d.querySelector('[data-tour="next"]'); i++) { d.querySelector('[data-tour="next"]').click(); await sleep(30); }
    ok(d.querySelector('#tour.tourmini') && N.PROFILE().tourDone === true, 'tour completes, is remembered, and shrinks to a one-line bar');
    d.querySelector('[data-tour="open"]').click(); await sleep(30);
    ok(d.querySelector('#tour.card') && /1 \/ 5/.test(d.querySelector('#tour').textContent), 'the bar reopens the tour from step one');
    d.querySelector('[data-tour="skip"]').click(); await sleep(30);
    ok(d.querySelector('#tour.tourmini'), 'closing shrinks it again');
    await waitFor(() => d.querySelector('.welcome'), 6000);
    ok(/Chào mừng bạn đến với Nabu Tarot/.test(d.querySelector('.welcome h2').textContent) && d.querySelector('.welcome .sig img') && !d.querySelector('.welcome .date') && !/Dự đoán mới/.test(d.querySelector('#feed').textContent), 'welcome post heads the feed with the logo as signature, no date line, no "Dự đoán mới"');
    { const np = d.querySelectorAll('#feed .post').length; ok(np <= 3 && (np === 0 || d.querySelector('#feed a[href="#/news"]')) && d.querySelector('.tiles a[href="#/news"]'), 'home shows at most three posts with a link to all of them, and the tile leads to the posts screen'); }
    // profile -> personalisation
    await go('#/me', '#pname');
    d.querySelector('#pname').value = 'Lan'; d.querySelector('#pbday').value = '1998-08-05';
    d.querySelector('[data-int="love"]').click(); d.querySelector('[data-int="astro"]').click();
    d.querySelector('#psave').click(); await sleep(100);
    ok(N.PROFILE().name === 'Lan' && N.PROFILE().birthday === '1998-08-05' && N.PROFILE().interests.length === 2, 'profile saved on device');
    await go('#/home', '.hello .sign');
    ok(/Chào Lan/.test(d.querySelector('h1').textContent), 'greeting uses the name');
    ok(/Sư Tử/.test(d.querySelector('.hello').textContent) && /Số đường đời 22/.test(d.querySelector('.hello').textContent) && /Dần/.test(d.querySelector('.hello').textContent), 'home shows sign (Leo), life path and animal');
    ok(/Sức Mạnh/.test(d.querySelector('.hello .cardline').textContent), 'home links the sign to its tarot card');
    await waitFor(() => d.querySelector('.horo'), 6000);
    ok(/Có thể bạn quan tâm/.test(d.body.textContent) && d.querySelectorAll('#foryou .acc').length === 0 && d.querySelectorAll('#foryou .horo').length === 2 && /Dự đoán tháng này/.test(d.querySelector('#foryou').textContent) && /Sư Tử/.test(d.querySelector('#foryou .horo').textContent) && /Horoscope\.com/.test(d.querySelector('#foryou').textContent), 'You may also like: one guide, then the monthly and weekly forecast for Leo with the source');
    ok(d.querySelectorAll('#foryou .horo .body p').length >= 6 && !/Premium|cao cấp|\bLeo\b/.test(d.querySelector('#foryou').textContent) && /nhà số \d+/.test(d.querySelector('#foryou').textContent) && /Ngày thuận lợi|Ngày cần cẩn thận/.test(d.querySelector('#foryou').textContent), 'forecast shows as short emoji paragraphs, no adverts, houses named plainly, day lists on their own lines');
    // pick a card, Vietnamese
    await go('#/pick', '#fan .slot');
    ok(d.querySelectorAll('#fan .slot').length === 78 && d.querySelectorAll('[data-focus]').length === 5, 'the whole deck of 78 cards, five focuses');
    d.querySelector('[data-focus="love"]').click(); d.querySelectorAll('#fan button')[2].click();
    await waitFor(() => d.querySelector('#reveal .hero'), 4000);
    const chosen = N.pick.chosen;
    ok(!!d.querySelector('#reveal .hero .name') && d.querySelectorAll('#reveal .ins').length === 4, 'card revealed with energy, shadow, focus and CTA blocks');
    ok(!/🃏/.test(d.querySelector('#main').innerHTML) && !/🃏/.test(d.querySelector('#nav').innerHTML), 'no joker emoji on the draw screen');

    ok(/Lúc này bạn đang mang năng lượng/.test(d.querySelector('#reveal').textContent) && /Nếu bạn đang nghĩ về tình cảm/.test(d.querySelector('#reveal').textContent), 'Vietnamese insight sections');
    ok(!/Thu Anh/.test(d.querySelector('#reveal').textContent), 'no source line under the insight');
    ok(!!d.querySelector('#reveal .ai') && d.querySelectorAll('#reveal .ai [data-ai-sug]').length === 3, 'Nabu AI panel under the drawn card');
    const gk = N.CONFIG.geminiKey; N.CONFIG.geminiKey = '';  // built-in engine for this check; the online one is tested separately
    d.querySelector('#reveal .ai [data-ai-q]').value = 'Lá này nói gì về chuyện tình cảm của mình?'; d.querySelector('#reveal .ai [data-ai-send]').click(); await sleep(150);
    ok(d.querySelectorAll('#reveal .ai-chat .msg').length === 2 && /Với câu hỏi về tình cảm/.test(d.querySelector('#reveal .ai-chat').textContent), 'built-in engine answers a love question from the card');
    N.CONFIG.geminiKey = gk;
    const yn = N.localAnswer('Mình có nên tiếp tục không?', { type: 'card', id: 'major-19' }), tm = N.localAnswer('Khi nào chuyện này xảy ra?', { type: 'card', id: 'wands-8' });
    ok(/thiên về CÓ/.test(yn) && /Gậy đi nhanh/.test(tm), 'yes/no lean and timing hints');
    ok(/Gã Khờ/.test(N.localAnswer('Gã Khờ nghĩa là gì?', { type: 'general' })) && /Sư Tử và Bảo Bình là hai cung đối diện/.test(N.localAnswer('Sư Tử hợp với Bảo Bình không?', { type: 'sign', key: 'leo' })), 'mentions of cards and signs are picked up; compatibility gets a straight verdict');
    ok(N.compatVerdict('leo', 'aqu') === 'opposite' && N.compatVerdict('leo', 'ari') === 'good' && N.compatVerdict('leo', 'sco') === 'work' && /câu trả lời ngắn là có/i.test(N.localAnswer('Bạch Dương và Sư Tử có hợp nhau không?', { type: 'general' })), 'compatibility verdicts: opposite, good, square');
    ok(/Kỵ Mã/.test(N.localAnswer('Lá Kỵ Mã trong Lenormand nghĩa là gì?', { type: 'general' })) && /Sao Thổ/.test(N.localAnswer('Sao Thổ có ý nghĩa gì?', { type: 'general' })) && /Đối tác/.test(N.localAnswer('Nhà 7 là gì?', { type: 'general' })) && /Rồng/.test(N.localAnswer('Tuổi Thìn tính cách thế nào?', { type: 'general' })), 'built-in engine knows Lenormand cards, planets, houses and animals');
    ok(/trăng|Hôm nay là/i.test(N.localAnswer('Hôm nay trăng gì?', { type: 'general' })) && /Đặt lịch/.test(N.localAnswer('Đặt lịch xem bài giá bao nhiêu?', { type: 'general' })) && /78 lá/.test(N.localAnswer('Học tarot bắt đầu từ đâu?', { type: 'general' })), 'built-in engine handles moon, booking and how-to-start questions');
    ok(d.querySelectorAll('[data-focus][disabled]').length === 4 && !d.querySelector('[data-focus="love"]').disabled, 'after the draw the other focus chips are switched off but still visible');
    d.querySelector('[data-focus="work"]').click(); await sleep(30);
    ok(N.pick.focus === 'love' && /Nếu bạn đang nghĩ về tình cảm/.test(d.querySelector('#reveal').textContent), 'a switched-off chip does nothing');
    d.querySelector('#redraw').click(); await sleep(60);
    ok(N.pick.chosen === null && d.querySelectorAll('[data-focus][disabled]').length === 0, 'redraw clears the choice and re-enables the chips');
    d.querySelector('[data-focus="love"]').click(); d.querySelectorAll('#fan button')[2].click(); await waitFor(() => d.querySelector('#reveal .hero'), 4000);
    // english mode: no Vietnamese in the insight
    d.querySelector('#lang').click(); await sleep(150);
    await waitFor(() => d.querySelector('#reveal .hero'), 4000);
    const enText = Array.from(d.querySelectorAll('#reveal .ins')).slice(0, 3).map((x) => x.textContent).join(' ');
    ok(/Right now you carry this energy/.test(enText) && !VI.test(enText), 'English insight is fully English');
    let mixed = 0;
    for (const c of N.DECK.en) for (const fo of ['general', 'love', 'work', 'study', 'money']) { const h = N.insightHTML(c.id, fo); if (VI.test(h.replace(/<[^>]+>/g, '')) || h.length < 200) mixed++; }
    ok(mixed === 0, 'all 78 x 5 English insights are English (' + mixed + ' mixed)');
    ok(!/If general is on your mind/.test(N.insightHTML('major-0', 'general')) && (N.insightHTML('major-0', 'general').match(/class="ins"/g) || []).length === 2 && /pack a bag first/.test(N.insightHTML('major-0', 'general')), 'general draw has no focus block; the advice sits in the energy block');
    d.querySelector('#lang').click(); await sleep(100);
    // learn: courses are locked until a code is entered
    await go('#/learn', '.tile');
    ok(d.querySelectorAll('.tile').length === 5 && d.querySelectorAll('.tile .lock').length === 2 && !/Trải bài/.test(d.querySelector('.tiles').textContent), 'learn shows two locked courses and three free areas; no separate spreads tile');
    await go('#/learn/tarot', '.paywall');
    ok(d.querySelectorAll('.lesson').length === 2 && /Gã Khờ/.test(d.querySelectorAll('.lesson')[1].textContent) && /22 lá Ẩn Chính/.test(d.querySelectorAll('.lesson')[0].textContent) && /56 lá Ẩn Phụ/.test(d.querySelectorAll('.lesson')[0].textContent) && /Hành trình của Gã Khờ/.test(d.querySelectorAll('.lesson')[0].textContent) && /Thế Giới \(21\)/.test(d.querySelectorAll('.lesson')[0].textContent), 'lesson 1 introduces 22 Majors, 56 Minors and the Fool\'s Journey; lesson 2 is The Fool');
    ok(d.querySelector('.lesson').compareDocumentPosition(d.querySelector('.paywall')) & 4 && /300\.000đ/.test(d.querySelector('.paywall').textContent) && d.querySelector('#ccode'), 'price and code entry sit below the demo');
    await go('#/learn/card/major-0', '.detail .hero');
    ok(/Gã Khờ/.test(d.querySelector('.name').textContent) && !d.querySelector('.paywall'), 'the demo card opens directly while locked');

    ok(/Mã không đúng/.test(d.querySelector('#cstatus').textContent), 'a forged code is rejected');
    const codeT = N.makeCode('tarot', '2027-03-04');
    ok(/^NABU-T-270304-[A-Z0-9]{4}$/.test(codeT) && N.parseCode(codeT.toLowerCase()).until === '2027-03-04', 'code format and parsing');
    d.querySelector('#ccode').value = codeT; d.querySelector('#cunlock').click();
    await waitFor(() => d.querySelector('#ctabs'), 4000);
    ok(N.ACCESS.has('tarot') && d.querySelectorAll('#ctabs button').length === 4 && d.querySelectorAll('.lsn').length === 8, 'valid code unlocks the course: 8 sessions listed first');
    await go('#/learn/lesson/tarot/1', '.journey');
    ok(d.querySelectorAll('.journey .stage').length === 7 && d.querySelectorAll('.journey .vt').length === 78, 'session 1 draws the Fool journey (3 stages) and the 56 Minors in four element groups');
    ok(!!d.querySelector('.ai') && /Lá hoàng gia/.test(N.localAnswer('Lá hoàng gia là ai?', { type: 'lesson', course: 'tarot', n: 1 })), 'Nabu AI in the lesson finds course material');

    { const ics = w.icsFor({ id: 'b1', slot: '2026-09-12T10:30', service: 'Tarot – 3 câu', name: 'Lan' }); ok((ics.match(/BEGIN:VALARM/g) || []).length === 4 && /DTSTART:20260912T033000Z/.test(ics) && /TRIGGER:-P1D/.test(ics) && /TRIGGER:-PT15M/.test(ics), 'a booking exports as a calendar event in Vietnam time with reminders at 24 h, 6 h, 1 h and 15 min'); }
    { const h = w.bookingRow({ id: 'x2', slot: '2099-01-05T09:00', newSlot: '2099-01-06T10:30', status: 'change_requested', items: [{ service: 'Tarot', pkg: '1 câu', price: 10000 }] }, true); ok(/data-bk="confirmed"/.test(h) && /data-bk="keep"/.test(h) && /Giờ mới/.test(h) && /data:text\/calendar/.test(h), 'an admin sees a change request with approve and keep-old-time buttons and the calendar file'); }
    { const h = w.bookingRow({ id: 'x3', slot: '2099-01-05T09:00', status: 'confirmed', items: [{ service: 'Tarot', pkg: '1 câu', price: 10000 }] }, false); ok(/#\/book\?change=x3/.test(h) && /data-cancel="x3"/.test(h) && /data:text\/calendar/.test(h), 'a client can ask to move or cancel a live booking and add it to the phone calendar'); }
    ok(/maximum-scale=1/.test(d.querySelector('meta[name="viewport"]').getAttribute('content')) && /user-scalable=no/.test(d.querySelector('meta[name="viewport"]').getAttribute('content')), 'the app cannot be pinch-zoomed');
    await go('#/pick', '.fan'); d.querySelector('[data-card]').click(); await sleep(300);
    ok(d.querySelector('#redrawTop') && d.querySelector('#redraw') && d.querySelector('#redrawTop').compareDocumentPosition(d.querySelector('.reveal .hero')) & 4, 'the reveal has a shuffle-and-draw-again button at the top as well as at the bottom');
    d.querySelector('#redrawTop').click(); await sleep(100);
    ok(!d.querySelector('#reveal .hero') && d.querySelectorAll('.fan [data-card]').length === 78 && d.querySelector('.fan.deck'), 'the top button reshuffles the whole 78-card deck');
    const savedAccess = JSON.stringify(N.ACCESS.get()); w.localStorage.removeItem('nabu-access');
    N.BE.user = { uid: 'x', email: 'angela_le_@outlook.com' };
    ok(N.ACCESS.has('tarot') && N.ACCESS.has('lenormand'), 'an admin email opens every course without a code');
    await go('#/learn/tarot', '.lessons');
    ok(!d.querySelector('.paywall') && d.querySelectorAll('.lessons .lsn').length === 8 && /Tài khoản quản trị/.test(d.querySelector('#main').textContent), 'admin sees all eight tarot lessons and no unlock button');
    await go('#/learn/card/major-1', '.detail .hero');
    ok(!d.querySelector('.paywall') && d.querySelector('.detail .name') && d.querySelector('.detail .name').textContent.trim().length > 2, 'admin opens a locked card directly');
    await go('#/learn/lesson/lenormand/5', '#main'); await waitFor(() => /Bài 5 \/ 6/.test(d.querySelector('#main').textContent), 4000);
    ok(!d.querySelector('.paywall') && /Bài 5 \/ 6/.test(d.querySelector('#main').textContent), 'admin opens lesson 5 of Lenormand');
    N.BE.user = null; w.localStorage.removeItem('nabu-admin');
    await go('#/learn/card/major-1', '.paywall');
    ok(!!d.querySelector('.paywall'), 'signed out again, the card is locked');
    // a paying client: code redeemed, everything opens, Me tab shows the expiry
    N.ACCESS.grant('tarot', '2027-03-04');
    await go('#/learn/tarot', '.lessons');
    ok(!d.querySelector('.paywall') && d.querySelectorAll('.lessons .lsn').length === 8 && /đến 4\/3\/2027|đến 04\/03\/2027|4 tháng 3, 2027|4 tháng 3 2027/.test(d.querySelector('#main').textContent), 'a redeemed code opens all lessons and shows the expiry date (' + d.querySelector('#main p.faint').textContent + ')');
    await go('#/learn/lesson/tarot/8', '#main'); await waitFor(() => /Bài 8 \/ 8/.test(d.querySelector('#main').textContent), 4000); ok(!d.querySelector('.paywall') && /Bài 8 \/ 8/.test(d.querySelector('#main').textContent), 'lesson 8 opens for a paying client');
    await go('#/learn/card/pentacles-8', '.detail .hero'); ok(!d.querySelector('.paywall'), 'a minor arcana card opens for a paying client');
    await go('#/me', '#pname');
    ok(/Khóa Tarot[^]*?đang mở, đến/.test(d.querySelector('#main').textContent) && /Khóa Lenormand[^]*?🔒/.test(d.querySelector('#main').textContent), 'Me tab lists the paid course with its expiry and the other one still locked');
    N.ACCESS.grant('tarot', '2020-01-01');
    await go('#/learn/card/pentacles-8', '.paywall'); ok(!!d.querySelector('.paywall'), 'an expired code locks the course again');
    w.localStorage.setItem('nabu-access', savedAccess);
    // me: accounts off
    await go('#/prices', '.svc');
    ok(d.querySelectorAll('.svc').length === 10 && /75\.000đ/.test(d.querySelector('#main').textContent) && /300\.000đ/.test(d.querySelector('#main').textContent) && /Khóa Tarot/.test(d.querySelector('#main').textContent) && /chuyển khoản/.test(d.querySelector('.paynote').textContent), 'price sheet screen with the payment note');
    await go('#/me', '#pname');
    ok(/Hồ sơ đang lưu trên máy này/.test(d.body.textContent) && /Instagram/.test(d.body.textContent) && d.querySelectorAll('[data-auth]').length === 3 && /Nabu chưa bật đăng nhập/.test(d.body.textContent) && !/Cài app lên điện thoại/.test(d.querySelector('#main').textContent) && d.querySelectorAll('.course').length === 3 && /đang mở/.test(d.querySelector('.course').textContent), 'me tab: device-only profile, Instagram, my courses with status');
    // admin
    await go('#/admin', '#atabs');
    ok(d.querySelectorAll('#atabs button').length === 5 && d.querySelectorAll('#cgrid button').length === 78, 'admin has five tabs and the 78-card picker');
    d.querySelector('[data-t="codes"]').click(); await waitFor(() => d.querySelector('#cmake'), 4000);
    d.querySelector('#cstart').value = '2026-09-04'; d.querySelector('#cmake').click(); await sleep(50);
    ok(/^NABU-T-270304-[A-Z0-9]{4}$/.test(d.querySelector('#codeval').textContent) && N.parseCode(d.querySelector('#codeval').textContent).course === 'tarot', 'dashboard makes a six-month tarot code that the app accepts');
    d.querySelector('[data-t="schedule"]').click(); await waitFor(() => d.querySelector('.week .wd'), 12000);
    ok(d.querySelectorAll('.week .wd').length === 7 && d.querySelectorAll('.week .chip.on').length >= 15 && d.querySelectorAll('.week .wd')[0].querySelectorAll('.chip').length === 34 && d.querySelector('.week .wd [data-h="07:30"]'), 'availability editor shows the weekly hours in half-hour steps');
    d.querySelector('[data-t="codes"]').click(); await sleep(50);
    ok(d.querySelector('#gkey') && d.querySelector('#gsave'), 'the codes tab carries the Nabu AI key setting');
    d.querySelector('[data-t="bookings"]').click(); await sleep(50);
    ok(/email quản trị/.test(d.querySelector('#apanel').textContent) && d.querySelector('#apanel a[href="#/me"]'), 'bookings tab asks for an admin sign-in now that accounts are on');
    // theme
    // theme: headless Edge may report either system preference, so compare against the state before each click
    const bgOf = () => w.getComputedStyle(d.body).backgroundColor, DARK = 'rgb(36, 26, 69)', LIGHT = 'rgb(239, 233, 250)';
    const wasDark = bgOf() === DARK;
    const PINK = 'rgb(251, 238, 242)', seen = [];
    for (let i = 0; i < 3; i++) { d.querySelector('#theme').click(); seen.push(bgOf()); }
    ok(seen.indexOf(DARK) > -1 && seen.indexOf(LIGHT) > -1 && seen.indexOf(PINK) > -1 && d.documentElement.getAttribute('data-theme') === (wasDark ? 'dark' : 'light'), 'the header button cycles light, dark and pastel pink and comes back to where it started');
    ok(bgOf() === (wasDark ? DARK : LIGHT), 'and flips back');
    await go('#/me', '[data-theme-pick]');
    ok(d.querySelectorAll('[data-theme-pick]').length === 4 && d.querySelector('[data-theme-pick].on'), 'Me tab offers auto / light / dark / pastel pink with the current one marked');
    d.querySelector('[data-theme-pick="pink"]').click();
    ok(d.documentElement.getAttribute('data-theme') === 'pink' && bgOf() === PINK && w.getComputedStyle(d.querySelector('.btn.primary') || d.body).backgroundColor !== '', 'pastel pink choice paints the blush palette');
    d.querySelector('[data-theme-pick="dark"]').click();
    ok(d.documentElement.getAttribute('data-theme') === 'dark' && bgOf() === DARK, 'dark choice paints dark');
    d.querySelector('[data-theme-pick="light"]').click();
    ok(d.documentElement.getAttribute('data-theme') === 'light' && bgOf() === LIGHT, 'light choice paints light');
    d.querySelector('[data-theme-pick="auto"]').click();
    ok(!d.documentElement.getAttribute('data-theme') && JSON.parse(w.localStorage.getItem('nabu-theme')) === '' && bgOf() === (w.matchMedia('(prefers-color-scheme: dark)').matches ? DARK : LIGHT), 'auto follows the phone setting');
    d.querySelector('[data-theme-pick="light"]').click();
    ok(d.documentElement.scrollWidth <= 431, 'no horizontal overflow (' + d.documentElement.scrollWidth + ')');
  } catch (e) { out.push('FAIL exception: ' + (e && e.stack || e)); }
  document.getElementById('results').textContent = out.join('\n');
})();
