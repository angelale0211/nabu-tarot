<!DOCTYPE html>

<pre id="results">running</pre>
<script>
const out = [];
/* The runner used to guess how long the suite would take, by giving the browser
   a budget of pretend time and reading the page once it ran out. A page that
   talks to the network can hold that clock still, and then the run never ends
   and reports nothing - not one check, after several minutes of waiting.
   So the page says how it is getting on instead: every few checks, and once
   more when it is finished. A run that dies half way now says where it got to. */
let sent = 0;
const report = (done) => {
  /* Opened by hand rather than by the runner, there is nothing listening for
     these and every one of them fails. That must stay silent: the results are
     on the page either way, and a rejected promise per check would drown the
     console the suite is read in.

     Not keepalive: those share one 64KB allowance between every request still
     in flight, and by the end of a run each of these carries tens of kilobytes.

     The "finished" mark is sent on its own, carrying nothing, and only once the
     results it refers to have been taken. Riding along on the last big upload
     it kept going missing, and a suite that had run every check then reported
     that it had stopped one short of the end. */
  try {
    const sending = fetch('/__results', { method: 'POST', body: out.join('\n') }).catch(() => {});
    if (done) sending.then(() => fetch('/__results?done=1', { method: 'POST', body: '' }).catch(() => {}));
  } catch (e) { /* the results are still on the page */ }
};
const ok = (cond, msg) => {
  out.push((cond ? 'PASS ' : 'FAIL ') + msg);
  if (out.length - sent >= 1) { sent = out.length; report(false); }
};
/* Something thrown outside the run itself would otherwise be silent. */
window.addEventListener('error', (e) => { out.push('FAIL page error: ' + (e.message || '')); report(true); });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.getElementById('f');
const W = () => f.contentWindow, D = () => f.contentDocument;
const VI = /[ăâđêôơưàảãáạằẳẵắặầẩẫấậèẻẽéẹềểễếệìỉĩíịòỏõóọồổỗốộờởỡớợùủũúụừửữứựỳỷỹýỵ]/i;
async function waitFor(fn, ms) { const t0 = Date.now(); while (Date.now() - t0 < (ms || 6000)) { try { if (fn()) return true; } catch (e) {} await sleep(60); } return false; }
async function go(hash, sel) { W().location.hash = hash; await sleep(30); return waitFor(() => D().querySelector(sel), 5000); }

(async () => {

      /* A sideways drag belongs to whatever is scrolling sideways. */
      w.NABU.REFRESHED_AT = 0;
      touch('touchstart', 100, 40); touch('touchmove', 240, 46); touch('touchend', 240, 46);
      await sleep(160);
      ok(w.NABU.REFRESHED_AT === 0 && !pull.classList.contains('ready'),
        'a sideways drag is left to whatever scrolls sideways');

      /* And a drag that stops short does nothing, which is what makes the
         gesture safe to start by accident. */
      touch('touchstart', 100, 40); touch('touchmove', 100, 66); touch('touchend', 100, 66);
      await sleep(160);
      ok(w.NABU.REFRESHED_AT === 0, 'a drag that stops short of the trip point refreshes nothing');
    }
    { /* No screen offers the same way back twice. The companion page used to
         show three links in a row, two of them identical. */
      const twice = [];
      /* Each of these is a real path, not a jump: the duplicate only appears
         when the router's way back and the screen's own point at the same
         place, which is what happens when you arrive the way people do. */
      const walks = [
        ['#/play', '#/play/pet'],
        ['#/play', '#/play/act/coin'],
        ['#/me', '#/looks'],
        ['#/me', '#/rewards'],
        ['#/learn', '#/learn/tarot'],
        ['#/me', '#/book'],
      ];
      for (const walk of walks) {
        const route = walk[walk.length - 1];
        await go('#/home', '#main');
        for (const step of walk) await go(step, '#main');
        await sleep(140);
        const seen = {};
        d.querySelectorAll('#main a.backlink, #homefoot a.backlink').forEach((a) => {
          const to = a.getAttribute('href') || '';
          if (seen[to]) twice.push(route + ' -> ' + to); else seen[to] = true;
        });
      }
      const uniq = twice.filter((x, i) => twice.indexOf(x) === i);
      ok(uniq.length === 0,
        'no screen offers the same way back more than once'
        + (uniq.length ? ' [' + uniq.join('; ') + ']' : ''));
    }
    { /* Nothing may sit jammed against the note that explains it. .hint has no
         bottom margin of its own, which is how a line of explanation came to be
         touching the button underneath it on the companion preview - and, since
         the rule is global, everywhere else the pattern appeared. */
      const tight = [];
      for (const route of ['#/play/pet', '#/love', '#/me', '#/book', '#/prices']) {
        await go('#/home', '#main'); await go(route, '#main'); await sleep(140);
        d.querySelectorAll('#main .hint').forEach((h) => {
          const nx = h.nextElementSibling;
          if (!nx) return;
          const a = h.getBoundingClientRect(), b = nx.getBoundingClientRect();
          if (!a.height || !b.height || b.top < a.top) return;
          if (b.top - a.bottom < 6) {
            tight.push(route + ' ' + String(nx.className || nx.tagName).split(/\s+/)[0]
              + ' (' + Math.round(b.top - a.bottom) + 'px)');
          }
        });
      }
      const uniq = tight.filter((x, i) => tight.indexOf(x) === i);
      ok(uniq.length === 0,
        'nothing is jammed against the note that explains it'
        + (uniq.length ? ' [' + uniq.slice(0, 4).join('; ') + ']' : ''));
    }
    { /* Every check above ran at 430, an iPhone Pro Max. Most phones are
         narrower, which is how three rows came to push their own contents off
         the edge on an iPhone 13 without anything noticing. */
      const frame = document.getElementById('f'), wasWide = frame.style.width;
      const bad = [];
      for (const px of [320, 360, 390]) {
        frame.style.width = px + 'px';
        for (const route of ['#/me', '#/play/pet', '#/love', '#/prices', '#/book', '#/hello', '#/signin']) {
          await go('#/home', '#main');
          await go(route, '#main');
          await sleep(140);
          const vw = d.documentElement.clientWidth;
          d.querySelectorAll('#main *').forEach((el) => {
            const r = el.getBoundingClientRect();
            if (!r.width || !r.height) return;
            const name = String(el.className || el.tagName).split(/\s+/)[0];
            /* off the screen entirely */
            if (r.right > vw + 1 || r.left < -1) { bad.push(px + ' ' + route + ' ' + name + ' off-screen'); return; }
            /* or still on the screen but wider than the box holding it, which is
               what a label does when it is forbidden to wrap: it leaves its own
               button rather than getting narrower. Anything built to scroll
               sideways on purpose is left alone. */
            const cs = w.getComputedStyle(el), ov2 = cs.overflowX;
            /* A strip built to scroll, and a label politely cutting itself
               short with an ellipsis, are both doing as they were told. */
            const clipped = ov2 === 'auto' || ov2 === 'scroll'
              || (ov2 === 'hidden' && cs.textOverflow === 'ellipsis');
            /* Decoration placed by hand - a glow, a drifting sparkle - is meant
               to sit outside the box. Only content that flows is judged. */
            let decor = false;
            for (const kid of el.children) {
              const kp = w.getComputedStyle(kid).position;
              if (kp === 'absolute' || kp === 'fixed') { decor = true; break; }
            }
            if (!clipped && !decor && el.scrollWidth > el.clientWidth + 1 && el.clientWidth > 0) {
              bad.push(px + ' ' + route + ' ' + name + ' overflows its box');
            }
          });
          if (d.documentElement.scrollWidth > px + 1) bad.push(px + ' ' + route + ' page scrolls sideways');
        }
      }
      frame.style.width = wasWide || '430px';
      await sleep(120);
      const uniq = bad.filter((x, i) => bad.indexOf(x) === i);
      ok(uniq.length === 0,
        'nothing leaves the screen at 320, 360 or 390 across the five busiest screens'
        + (uniq.length ? ' [' + uniq.slice(0, 4).join('; ') + ']' : ''));
    }

    /* ---- the reading column on a desk ----
       A card page written for a hand left the picture stranded top left on a
       wide window, with the reading running a hundred and ten characters to
       the line. These check the shape it takes instead, and that a phone is
       left exactly as it was. */
    {
      const frame = document.getElementById('f'), wasWide = frame.style.width;
      const lineChars = (el) => {
        const t = (el.textContent || '').trim();
        if (t.length < 60) return 0;
        const rng = d.createRange(); rng.selectNodeContents(el);
        const tops = {};
        Array.prototype.slice.call(rng.getClientRects())
          .filter((r) => r.height > 2 && r.width > 2)
          .forEach((r) => { tops[Math.round(r.top)] = 1; });
        const n = Object.keys(tops).length;
        return n ? t.length / n : 0;
      };
      /* Earlier checks lock and unlock the course; the shape of a card page is
         only on show to somebody who may read the deck. */
      N.ACCESS.grant('tarot', '2099-01-01');
      frame.style.width = '1280px';
      await sleep(260);
      await go('#/learn/card/major-0', '.detail');
      await sleep(240);
      const rail = d.querySelector('.detail > .rail');
      ok(!!rail && !!rail.querySelector('.hero') && !!rail.querySelector('.cardnav') && !!rail.querySelector('.ai'),
        'on a desk the card, its arrows and the Nabu AI box share one column');
      ok(!!rail && W().getComputedStyle(rail).position === 'sticky',
        'that column stays put while the reading scrolls');
      const ins = d.querySelector('.detail .ins');
      ok(!!ins && !!rail && ins.getBoundingClientRect().left > rail.getBoundingClientRect().right - 1,
        'the reading sits beside the card, not under it');
      ok(!!ins && ins.getBoundingClientRect().width <= 700,
        'the reading column is held to a width the eye can follow');
      {
        const longest = Array.prototype.slice.call(d.querySelectorAll('#main p, #main li'))
          .map(lineChars).reduce((a, b) => (b > a ? b : a), 0);
        ok(longest <= 85, 'no line of the reading runs past eighty-five characters on a desk (' + Math.round(longest) + ')');
      }
      ok(d.documentElement.scrollWidth <= 1281, 'a card page does not scroll sideways on a desk');
      {
        const one = d.querySelector('.cardnav.one');
        ok(!!one && W().getComputedStyle(one).gridTemplateColumns.split(' ').length === 1,
          'the first card has one arrow and it takes the whole row');
      }
      /* A paragraph that holds a button is not prose, and capping it left the
         button stopping two thirds of the way across, short of the grid it
         sits under. */
      await go('#/learn', '.tiles');
      await sleep(200);
      {
        const grid = d.querySelector('#main .tiles'), btn = d.querySelector('#main a.btn.block');
        const g = grid && grid.getBoundingClientRect(), bb = btn && btn.getBoundingClientRect();
        ok(!!g && !!bb && Math.abs(g.left - bb.left) < 2 && Math.abs(g.right - bb.right) < 2,
          'a full-width button reaches as far as the grid above it, not as far as a line of text');
      }
      await go('#/learn/guide/tarot-start', '.guide');
      await sleep(200);
      {
        const gEl = d.querySelector('.guide'), mEl = d.querySelector('#main');
        const g = gEl && gEl.getBoundingClientRect(), mb = mEl.getBoundingClientRect();
        ok(!!g && g.width <= 700 && Math.abs((g.left + g.right) / 2 - (mb.left + mb.right) / 2) < 40,
          'a guide reads as one column down the middle');
      }
      /* Back to a phone: the same nodes, in the order they were written.
         The move back is driven by a resize the browser reports when it is
         ready, so this waits for the result rather than guessing at it. */
      frame.style.width = wasWide || '430px';
      await waitFor(() => W().innerWidth < 900, 4000);
      await go('#/learn/card/major-0', '.detail');
      await waitFor(() => d.querySelector('.detail > .ai'), 4000);
      const rail2 = d.querySelector('.detail > .rail');
      ok(!!rail2 && W().getComputedStyle(rail2).display === 'contents',
        'on a phone that column has no box of its own');
      ok(!!rail2 && !rail2.querySelector('.ai') && !!d.querySelector('.detail > .ai'),
        'and the Nabu AI box goes back under the reading it asks about');
      {
        const kids = Array.prototype.slice.call(d.querySelectorAll('.detail .hero, .detail .ins, .detail .ai'));
        const hero = kids.indexOf(d.querySelector('.detail .hero'));
        ok(hero === 0 && kids.indexOf(d.querySelector('.detail .ai')) === kids.length - 1,
          'the card is still first on a phone and the ask box still last');
      }
    }

  } catch (e) { out.push('FAIL exception: ' + (e && e.stack || e)); }
  document.getElementById('results').textContent = out.join('\n');
  report(true);
})();
</script>
</body></html>
