<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Nabu Tarot tests</title></head>
<body>
<iframe id="f" src="../index.html#/home" style="width:430px;height:900px"></iframe>
<pre id="results">running</pre>
<script>
const out = [];
const ok = (cond, msg) => out.push((cond ? 'PASS ' : 'FAIL ') + msg);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.getElementById('f');
const W = () => f.contentWindow, D = () => f.contentDocument;
const VI = /[ăâđêôơưàảãáạằẳẵắặầẩẫấậèẻẽéẹềểễếệìỉĩíịòỏõóọồổỗốộờởỡớợùủũúụừửữứựỳỷỹýỵ]/i;
async function waitFor(fn, ms) { const t0 = Date.now(); while (Date.now() - t0 < (ms || 6000)) { try { if (fn()) return true; } catch (e) {} await sleep(60); } return false; }
async function go(hash, sel) { W().location.hash = hash; await sleep(30); return waitFor(() => D().querySelector(sel), 5000); }

(async () => {
  try {
    await waitFor(() => D() && D().querySelector('#nav a'), 8000);
    const w = W(), d = D(), N = w.NABU;
    // data
    ok(N.DECK.vi.length === 78 && N.DECK.en.length === 78, 'deck has 78 cards in both languages');
    ok(Object.keys(N.INSIGHT.en).length === 78 && Object.keys(N.INSIGHT.vi).length === 78, 'insights cover 78 cards in EN and VI');
    ok(N.DECK.vi.every((c) => { const i = N.insightOf(c.id, 'vi'), j = N.insightOf(c.id, 'en'); return i && j && i.pos.length >= 3 && i.neg.length >= 3 && j.pos.length >= 3 && [i.now, i.love, i.work, i.study, i.money, i.advice, j.now, j.love, j.work, j.study, j.money, j.advice].every((t) => t && t.length > 10); }), 'every insight has keywords and six texts in both languages');
    ok(Object.keys(N.KW.vi).length === 78 && Object.keys(N.ASK.vi).length === 78, 'Vietnamese lecture keywords and questions cover 78 cards');
    ok(N.TOPICS.length === 5 && N.TOPICS[1].q.vi[4] === 'Mình nên tiếp tục chờ đợi hay buông bỏ?', 'preset topics verbatim');
    ok(N.GUIDES.length >= 18 && N.GUIDES.every((g) => g.sections.length >= 2 && g.title.vi && g.title.en), 'guides present in both languages (' + N.GUIDES.length + ')');
    ok(!JSON.stringify(N.GUIDES).match(/Thu Anh/) && !d.querySelector('#main').textContent.match(/Thu Anh/), 'no source names in guides or on screen');
    ok(N.sunSignIndex(8, 5) === 4 && N.sunSignIndex(1, 10) === 9 && N.sunSignIndex(3, 21) === 0 && N.sunSignIndex(12, 25) === 9, 'sun sign boundaries');
    ok(N.lifePath(1998, 11, 27) === 11 && N.lifePath(1990, 2, 11) === 5 && N.lifePath(1995, 3, 12) === 3, 'life path arithmetic');
    // home
    ok(/Chào bạn/.test(d.querySelector('h1').textContent), 'greeting for a guest');
    ok(d.querySelector('#today') && /Âm lịch/.test(d.querySelector('#today').textContent) && /Trăng/.test(d.querySelector('#today').textContent), 'today panel lists the lunar date and the moon');
    ok(!!d.querySelector('#tour'), 'tour shows on first visit');
    ok(d.querySelectorAll('.tile').length === 6 && /Bảng giá/.test(d.querySelector('.tiles').textContent), 'six quick links incl. prices');
    for (let i = 0; i < 5; i++) { d.querySelector('[data-tour="next"]').click(); await sleep(30); }
    ok(!d.querySelector('#tour') && N.PROFILE().tourDone === true, 'tour completes and is remembered');
    await waitFor(() => d.querySelector('article.post'), 6000);
    ok(d.querySelectorAll('article.post').length >= 1, 'feed shows posts.json');
    // profile -> personalisation
    await go('#/me', '#pname');
    d.querySelector('#pname').value = 'Lan'; d.querySelector('#pbday').value = '1998-08-05';
    d.querySelector('[data-int="love"]').click(); d.querySelector('[data-int="astro"]').click();
    d.querySelector('#psave').click(); await sleep(100);
    ok(N.PROFILE().name === 'Lan' && N.PROFILE().birthday === '1998-08-05' && N.PROFILE().interests.length === 2, 'profile saved on device');
    await go('#/home', '.hello .sign');
    ok(/Chào Lan/.test(d.querySelector('h1').textContent), 'greeting uses the name');
    ok(/Sư Tử/.test(d.querySelector('.hello').textContent) && /Số đường đời 22/.test(d.querySelector('.hello').textContent) && /Dần/.test(d.querySelector('.hello').textContent), 'home shows sign (Leo), life path and animal');
    ok(/Sức Mạnh/.test(d.querySelector('.hello .cardline').textContent), 'home links the sign to its tarot card');
    ok(/Theo điều bạn quan tâm/.test(d.body.textContent), 'guides suggested by interest');
    // pick a card, Vietnamese
    await go('#/pick', '#fan .slot');
    ok(d.querySelectorAll('#fan .slot').length === 7 && d.querySelectorAll('[data-focus]').length === 5, 'seven cards, five focuses');
    d.querySelector('[data-focus="love"]').click(); d.querySelectorAll('#fan button')[2].click();
    await waitFor(() => d.querySelector('#reveal .hero'), 4000);
    const chosen = N.pick.chosen;
    ok(!!d.querySelector('#reveal .hero .name') && d.querySelectorAll('#reveal .ins').length === 4, 'card revealed with energy, shadow, focus and CTA blocks');
    ok(/Lúc này bạn đang mang năng lượng/.test(d.querySelector('#reveal').textContent) && /Nếu bạn đang nghĩ về tình cảm/.test(d.querySelector('#reveal').textContent), 'Vietnamese insight sections');
    ok(!/Thu Anh/.test(d.querySelector('#reveal').textContent), 'no source line under the insight');
    // english mode: no Vietnamese in the insight
    d.querySelector('#lang').click(); await sleep(150);
    await waitFor(() => d.querySelector('#reveal .hero'), 4000);
    const enText = Array.from(d.querySelectorAll('#reveal .ins')).slice(0, 3).map((x) => x.textContent).join(' ');
    ok(/Right now you carry this energy/.test(enText) && !VI.test(enText), 'English insight is fully English');
    let mixed = 0;
    for (const c of N.DECK.en) for (const fo of ['general', 'love', 'work', 'study', 'money']) { const h = N.insightHTML(c.id, fo); if (VI.test(h.replace(/<[^>]+>/g, '')) || h.length < 200) mixed++; }
    ok(mixed === 0, 'all 78 x 5 English insights are English (' + mixed + ' mixed)');
    d.querySelector('#lang').click(); await sleep(100);
    // learn
    await go('#/learn', '.tile');
    ok(d.querySelectorAll('.tile').length === 6 && d.querySelectorAll('.tile.rec').length >= 1, 'learn shows six areas, recommended ones marked');
    await go('#/learn/tarot', '.deckgrid button');
    ok(d.querySelectorAll('.deckgrid button').length === 22, 'tarot list starts with 22 majors');
    d.querySelector('[data-suit="cups"]').click(); await sleep(50);
    ok(d.querySelectorAll('.deckgrid button').length === 14, 'suit tab shows 14 cards');
    await go('#/learn/card/' + chosen, '.detail .hero');
    ok(/Nghĩa xuôi/.test(d.body.textContent) && /Hỏi gì, lá này trả lời sao/.test(d.body.textContent) && d.querySelectorAll('.qa').length >= 1, 'card page: meanings, focus texts and lecture questions (lang=' + d.documentElement.lang + ' qa=' + d.querySelectorAll('.qa').length + ' id=' + chosen + ' hash=' + w.location.hash + ')');
    await go('#/learn/lenormand', '.deckgrid button');
    ok(d.querySelectorAll('.deckgrid button').length === 36, '36 Lenormand cards');
    await go('#/learn/len/1', '.detail .hero');
    ok(/Kỵ Mã/.test(d.querySelector('.name').textContent) && /Cặp lá/.test(d.body.textContent), 'Lenormand card page');
    await go('#/learn/astro', '.signlist button');
    ok(d.querySelectorAll('.signlist button').length === 12 && d.querySelector('.signlist button.me') && /Sư Tử/.test(d.querySelector('.signlist button.me').textContent), 'twelve signs, mine marked');
    d.querySelector('[data-t="planets"]').click(); await sleep(50);
    ok(d.querySelectorAll('#apanel .acc').length === 10, 'ten planets');
    d.querySelector('[data-t="houses"]').click(); await sleep(50);
    ok(d.querySelectorAll('#apanel .acc').length === 12, 'twelve houses');
    await go('#/learn/sign/leo', '.detail');
    ok(/Sao chủ/.test(d.body.textContent) && d.querySelectorAll('.mini .m').length >= 4, 'sign page with ruler and its tarot cards');
    await go('#/learn/spreads', '.acc');
    ok(d.querySelectorAll('.acc').length === 20, 'twenty spreads');
    await go('#/learn/spread/nabu-2', '.spread-d svg');
    ok(d.querySelectorAll('.qa').length === 5 && /Người cũ/.test(d.body.textContent), 'preset spread page with five positions');
    await go('#/learn/manifest', '.acc');
    ok(d.querySelectorAll('.acc').length >= 5 && d.querySelectorAll('.badge-src').length >= 5, 'manifestation guides with badges');
    await go('#/learn/guide/fort-palm', '.guide h2');
    ok(d.querySelectorAll('.guide h2').length >= 3, 'guide renders its sections');
    await go('#/learn/numbers', '.ins');
    ok(/Số đường đời 22/.test(d.body.textContent) && /Dần/.test(d.body.textContent), 'numbers page for the saved birthday');
    // booking with calendar
    await go('#/book?card=' + chosen, '.cal .days');
    await waitFor(() => d.querySelector('.cal .d.has'), 4000);
    ok(w.NABU.SERVICES.length === 6 && !w.NABU.SERVICES.some((x) => x.id === 'oracle') && w.NABU.SERVICES.some((x) => x.id === 'tea') && w.NABU.SERVICES.some((x) => x.id === 'lenormand-oracle'), 'six services: no standalone oracle, tea and combos present');
    ok(d.querySelectorAll('.svc').length === 6 && d.querySelectorAll('[data-pkg]').length === 24, 'price sheet renders every package');
    ok(/45\.000đ/.test(d.querySelector('.svc.blue').textContent) && /250\.000đ/.test(d.querySelectorAll('.svc')[5].textContent), 'prices formatted in VND');
    ok(d.querySelectorAll('[data-topic]').length === 6, 'six topic choices');
    d.querySelector('[data-pkg="tarot/q3"]').click();
    ok(d.querySelector('[data-pkg="tarot/q3"]').classList.contains('on') && /Dịch vụ: Tarot – 3 câu chi tiết \(45\.000đ\)/.test(d.querySelector('#msgprev').textContent) && /không bắt buộc/.test(d.querySelector('#topicopt').textContent), 'package goes into the message; topic becomes optional');
    d.querySelector('[data-pkg="tuvi/year"]').click();
    ok(!d.querySelector('#birthwrap').hidden && d.querySelector('#bbirth').value === '1998-08-05', 'tử vi asks for birth date and time, prefilled from the profile');
    d.querySelector('[data-pkg="tarot/topic"]').click();
    ok(d.querySelector('#topicopt').textContent === '', 'set-topic package requires a topic');
    ok(d.querySelectorAll('.cal .d.has').length >= 5, 'calendar has days with free slots');
    d.querySelector('[data-topic="2"]').click();
    d.querySelector('.cal .d.has').click(); await sleep(50);
    ok(d.querySelectorAll('.slots button').length >= 1, 'day shows time slots');
    d.querySelector('.slots button').click(); await sleep(50);
    ok(!!d.querySelector('.picked') && /Giờ hẹn/.test(d.querySelector('#msgprev').textContent) && /giờ Việt Nam/.test(d.querySelector('#msgprev').textContent), 'chosen slot appears in the message');
    ok(/Chủ đề: #2 Người cũ/.test(d.querySelector('#msgprev').textContent) && /Tên: Lan/.test(d.querySelector('#msgprev').textContent), 'message has topic and name from profile');
    ok(/ig\.me\/m\/nabutarot/.test(d.querySelector('[data-send][href]').getAttribute('href')), 'instagram send link');
    // me: accounts off
    await go('#/prices', '.svc');
    ok(d.querySelectorAll('.svc').length === 6 && /chuyển khoản/.test(d.querySelector('.paynote').textContent), 'price sheet screen with the payment note');
    await go('#/me', '#pname');
    ok(/Hồ sơ đang lưu trên máy này/.test(d.body.textContent) && /Instagram/.test(d.body.textContent), 'me tab explains device-only profile and offers Instagram');
    // admin
    await go('#/admin', '#atabs');
    ok(d.querySelectorAll('#atabs button').length === 4 && d.querySelectorAll('#cgrid button').length === 78, 'admin has four tabs and the 78-card picker');
    d.querySelector('[data-t="schedule"]').click(); await waitFor(() => d.querySelector('.week .wd'), 4000);
    ok(d.querySelectorAll('.week .wd').length === 7 && d.querySelectorAll('.week .chip.on').length >= 15, 'availability editor shows the weekly hours');
    d.querySelector('[data-t="bookings"]').click(); await sleep(50);
    ok(/Firebase/.test(d.querySelector('#apanel').textContent), 'bookings tab explains that accounts are off');
    // theme
    // theme: headless Edge may report either system preference, so compare against the state before each click
    const bgOf = () => w.getComputedStyle(d.body).backgroundColor, DARK = 'rgb(36, 26, 69)', LIGHT = 'rgb(239, 233, 250)';
    const wasDark = bgOf() === DARK;
    d.querySelector('#theme').click();
    ok(d.documentElement.getAttribute('data-theme') === (wasDark ? 'light' : 'dark') && bgOf() === (wasDark ? LIGHT : DARK), 'header button flips the effective theme and the page repaints');
    d.querySelector('#theme').click();
    ok(bgOf() === (wasDark ? DARK : LIGHT), 'and flips back');
    await go('#/me', '[data-theme-pick]');
    ok(d.querySelectorAll('[data-theme-pick]').length === 3 && d.querySelector('[data-theme-pick].on'), 'Me tab offers auto / light / dark with the current one marked');
    d.querySelector('[data-theme-pick="dark"]').click();
    ok(d.documentElement.getAttribute('data-theme') === 'dark' && bgOf() === DARK, 'dark choice paints dark');
    d.querySelector('[data-theme-pick="light"]').click();
    ok(d.documentElement.getAttribute('data-theme') === 'light' && bgOf() === LIGHT, 'light choice paints light');
    d.querySelector('[data-theme-pick="auto"]').click();
    ok(!d.documentElement.getAttribute('data-theme') && JSON.parse(w.localStorage.getItem('nabu-theme')) === '' && bgOf() === (w.matchMedia('(prefers-color-scheme: dark)').matches ? DARK : LIGHT), 'auto follows the phone setting');
    d.querySelector('[data-theme-pick="light"]').click();
    ok(d.documentElement.scrollWidth <= 431, 'no horizontal overflow (' + d.documentElement.scrollWidth + ')');
  } catch (e) { out.push('FAIL exception: ' + (e && e.stack || e)); }
  document.getElementById('results').textContent = out.join('\n');
})();
</script>
</body></html>
