<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>body{margin:0}iframe{border:0;display:block}</style></head>
<body>
<iframe id="f" style="width:430px;height:1500px"></iframe>
<script>
const q = new URLSearchParams(location.search);
const f = document.getElementById('f');
f.src = '../index.html#/' + (q.get('r') || 'feed');
f.addEventListener('load', () => {
  const w = f.contentWindow, d = f.contentDocument;
  if (q.get('theme') === 'light') { try { localStorage.setItem('nabu-theme', '"light"'); } catch (e) {} w.localStorage.setItem('nabu-theme', '"light"'); }
  if (q.get('lang')) w.localStorage.setItem('nabu-lang', '"' + q.get('lang') + '"');
  if ((q.get('theme') || q.get('lang')) && !sessionStorage.getItem('reloaded')) { sessionStorage.setItem('reloaded', '1'); w.location.reload(); return; }
  setTimeout(() => {
    if (q.get('r') === 'pick' && q.get('tap')) {
      const b = d.querySelector('[data-focus="' + (q.get('focus') || 'love') + '"]'); if (b) b.click();
      const btn = d.querySelectorAll('#fan button')[3]; if (btn) btn.click();
    }
    if (q.get('r') === 'book') { const t = d.querySelector('[data-topic="1"]'); if (t) t.click(); }
  }, 600);
});
</script>
</body></html>
