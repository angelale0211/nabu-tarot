<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Nabu Tarot</title>
<meta name="description" content="Nabu Tarot: dự đoán mới, rút một lá bài xem năng lượng hiện tại, học tarot, Lenormand, chiêm tinh, và đặt lịch xem bài.">
<meta name="theme-color" content="#EFE9FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nabu Tarot">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-180.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* __FONTS__ */

/* Palette taken from the Nabu Tarot logo: lavender ground, cream disc, deep
   purple line, gold crescent, pink and blue side cards. */
:root{
  --bg:#EFE9FA; --surface:#FFF9FA; --surface-2:#F4EEFB; --surface-3:#E9E0F7;
  --fg:#3B2A5E; --fg-soft:#6B5C8A; --fg-faint:#9C90B6;
  --rule:#DCD2EE; --rule-soft:#E9E2F5;
  --lav:#B8A4E3; --lav-soft:#D9CDF3; --pink:#F6BBCB; --pink-ink:#8C3A5B; --blue:#AFC8F0; --blue-ink:#2F4E86;
  --gold:#E5BE5E; --gold-soft:#F6E5B3; --gold-ink:#3B2A5E;
  --primary:#3D2A6E; --primary-ink:#FFF7EE;
  --link:#3D2A6E; --picked-ink:#3B2A5E; --ok:#2E7D46; --err:#B4384E;
  --card-bg:#FBF6F1; --card-ink:#3B2A5E;
  --back-1:#3D2A6E; --back-2:#4B3684;
  --wands-ink:#B04A2E; --cups-ink:#2F5E9A; --swords-ink:#5C6680; --pentacles-ink:#3D6B3F; --major-ink:#5B3F9E;
  --shade:rgba(59,42,94,.18);
  --tag-pink-bg:#F6BBCB; --tag-pink-ink:#5B2340; --tag-blue-bg:#AFC8F0; --tag-blue-ink:#1F3A6B; --tag-gold-bg:#F6E5B3; --tag-gold-ink:#5C4312; --tag-green-bg:#CFEBD6; --tag-green-ink:#1F5A32; --tag-neu-bg:#E9E0F7; --tag-neu-ink:#4A3D6B;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  /* Vietnamese letters can carry a mark above and a dot below. Playfair is a
     Didone whose marks are tall and heavy, so accented letters look bigger
     than the plain ones. Lora keeps the book-serif feel with gentler contrast
     and marks drawn to sit inside the line. English keeps Playfair. */
  --body:"Be Vietnam Pro","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --nav-h:66px;
  color-scheme:light;
}
/* Dark: follows the phone unless the visitor picked a theme. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  --bg:#241A45; --surface:#312559; --surface-2:#3B2D6A; --surface-3:#463779;
  --fg:#F6F0FA; --fg-soft:#CBC0E4; --fg-faint:#9F92C2;
  --rule:#4D3F80; --rule-soft:#3F3271;
  --lav:#B8A4E3; --lav-soft:#5A4A92; --pink:#F6BBCB; --pink-ink:#F6BBCB; --blue:#AFC8F0; --blue-ink:#AFC8F0;
  --gold:#E5BE5E; --gold-soft:#5C4B2A; --gold-ink:#2A1E4A;
  --primary:#E5BE5E; --primary-ink:#2A1E4A;
  --link:#E5BE5E; --picked-ink:#F6F0FA; --ok:#8CD79A; --err:#F08A8A;
  --card-bg:#F4EEE6; --card-ink:#3B2A5E;
  --back-1:#3D2A6E; --back-2:#4B3684;
  --wands-ink:#F0937A; --cups-ink:#8FC2F0; --swords-ink:#BDC5D8; --pentacles-ink:#9BCB92; --major-ink:#C7B6F3;
  --shade:rgba(0,0,0,.5);
  --tag-pink-bg:#6E2F49; --tag-pink-ink:#FFD6E1; --tag-blue-bg:#2F4E86; --tag-blue-ink:#DCE8FF; --tag-gold-bg:#6B5320; --tag-gold-ink:#FFE9B0; --tag-green-bg:#245C36; --tag-green-ink:#D2F2DB; --tag-neu-bg:#463779; --tag-neu-ink:#EDE6FA;
  color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241A45; --surface:#312559; --surface-2:#3B2D6A; --surface-3:#463779;
  --fg:#F6F0FA; --fg-soft:#CBC0E4; --fg-faint:#9F92C2;
  --rule:#4D3F80; --rule-soft:#3F3271;
  --lav:#B8A4E3; --lav-soft:#5A4A92; --pink:#F6BBCB; --pink-ink:#F6BBCB; --blue:#AFC8F0; --blue-ink:#AFC8F0;
  --gold:#E5BE5E; --gold-soft:#5C4B2A; --gold-ink:#2A1E4A;
  --primary:#E5BE5E; --primary-ink:#2A1E4A;
  --link:#E5BE5E; --picked-ink:#F6F0FA; --ok:#8CD79A; --err:#F08A8A;
  --card-bg:#F4EEE6; --card-ink:#3B2A5E;
  --back-1:#3D2A6E; --back-2:#4B3684;
  --wands-ink:#F0937A; --cups-ink:#8FC2F0; --swords-ink:#BDC5D8; --pentacles-ink:#9BCB92; --major-ink:#C7B6F3;
  --shade:rgba(0,0,0,.5);
  --tag-pink-bg:#6E2F49; --tag-pink-ink:#FFD6E1; --tag-blue-bg:#2F4E86; --tag-blue-ink:#DCE8FF; --tag-gold-bg:#6B5320; --tag-gold-ink:#FFE9B0; --tag-green-bg:#245C36; --tag-green-ink:#D2F2DB; --tag-neu-bg:#463779; --tag-neu-ink:#EDE6FA;
  color-scheme:dark;
}
/* Pastel pink: blush ground, cream cards, plum-rose text, one rose accent.
   Every pair below keeps at least 4.5:1 contrast for body text. */
:root[data-theme="pink"]{
  --bg:#FBEEF2; --surface:#FFF9FB; --surface-2:#F9E6EC; --surface-3:#F2D8E1;
  --fg:#55293F; --fg-soft:#845266; --fg-faint:#AE8496;
  --rule:#EFD2DC; --rule-soft:#F6E3EA;
  --lav:#D8B9E4; --lav-soft:#F0DFF3; --pink:#F7C3D2; --pink-ink:#9E3C5C; --blue:#C3D8F1; --blue-ink:#3A5C8C;
  --gold:#E9C784; --gold-soft:#F9EBCC; --gold-ink:#55293F;
  --primary:#B8496D; --primary-ink:#FFF7F9;
  --link:#A93F63; --picked-ink:#55293F; --ok:#2E7D46; --err:#B4384E;
  --card-bg:#FFF6F2; --card-ink:#55293F;
  --back-1:#B8496D; --back-2:#CF6A8B;
  --wands-ink:#B04A2E; --cups-ink:#3A6BA8; --swords-ink:#6B6F86; --pentacles-ink:#3D7A48; --major-ink:#8A4B9E;
  --shade:rgba(85,41,63,.16);
  --tag-pink-bg:#F9D3DE; --tag-pink-ink:#6A2440; --tag-blue-bg:#D8E4F7; --tag-blue-ink:#2A4A78; --tag-gold-bg:#F9EBCC; --tag-gold-ink:#5C4312; --tag-green-bg:#D6EEDC; --tag-green-ink:#1F5A32; --tag-neu-bg:#F2D8E1; --tag-neu-ink:#55293F;
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0}
body{overflow-x:clip}
img,svg{max-width:100%}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
/* Type scale (one for the whole app):
   display face for titles, body face for everything else.
   h1 28/1.2 (-.01em)  screen title        h2 21/1.25  section      h3 17/1.3  card title
   body 16/1.55        paragraphs          .note/.tip 14.5/1.5  instructions  .hint/.faint 13.5/1.45  secondary
   .eyebrow 12/1.3 bold, +.06em uppercase (VI: normal case, +.02em)   nav 10.5 bold */
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
a{color:var(--link)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;width:100%;max-width:100%;-webkit-appearance:none;appearance:none;margin:0}
/* iOS renders date and time fields as small centred pills: give them the same box as every other field. */
input[type=date],input[type=time]{display:flex;align-items:center;min-height:50px;line-height:1.3;text-align:left}
input::-webkit-date-and-time-value{text-align:left;min-height:1.3em}
button{-webkit-appearance:none;appearance:none;max-width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--lav);outline-offset:1px;border-color:transparent}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--fg-soft);margin:14px 0 6px;font-weight:600}
.hint{font-size:13.5px;line-height:1.45;color:var(--fg-faint);margin:6px 0 0}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;line-height:1.2}
:root[lang="vi"]{--display:"Lora",Georgia,"Times New Roman",serif}
:root[lang="vi"] h1{line-height:1.3}
:root[lang="vi"] h2,:root[lang="vi"] h3{line-height:1.35}
h1{font-size:28px;letter-spacing:-.01em}
h2{font-size:21px;line-height:1.25}
h3{font-size:17px;line-height:1.3}
p{margin:0 0 12px}
/* Only headings balance. A body paragraph must never be balanced or
   prettified: both narrow the whole block and leave the right side of the card
   empty, which is far worse than a short last line. */
h1,h2,h3,.eyebrow{text-wrap:balance}
/* Paragraphs line up on both edges. Only a line that wraps is stretched and
   the last line of a block never is, so a one-line caption or a two-word note
   is untouched; nothing else has to be excluded by length. */
#main p,#main li,.note span,#foot .tagline{text-align:justify;text-justify:inter-word}
/* Blocks that are deliberately centred keep their own alignment. They are also
   the one place balancing belongs: a short centred block that wraps looks wrong
   when the second line holds a single word, and balancing evens the two out. */
#main .pick-head p,#main .paynote,#main #tour p,#main .treewrap p,#main .coinwrap p,#main .done p,#main .paywall p,#main .tap-hint{text-align:center}
#main .pick-head p,#main .tap-hint,#main #tour p,#main .paynote{text-wrap:balance}
/* And these read as labels rather than prose. */
#main .eyebrow,#main .date,#main .meta,#main .st,#main .kwl,#main .steps li{text-align:inherit;text-justify:auto}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}

/* ---- header ---- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule-soft);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-size:20px;letter-spacing:.02em;color:var(--fg);text-decoration:none}
.brand .lockup .word{font-size:20px}
.lockup{color:var(--fg);display:inline-flex;align-items:center;gap:10px;text-decoration:none}.lockup .avatar{width:42px;height:42px;border-radius:50%;box-shadow:0 1px 4px var(--shade);flex:none}.lockup .word{font-family:var(--display);font-size:21px;font-weight:500;letter-spacing:.02em;white-space:nowrap}
.tools{display:flex;gap:8px}
.pill{border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--fg-soft);background:var(--surface);min-width:40px;text-align:center}
.pill:active{background:var(--surface-2)}
.pill .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pink-ink);margin-left:4px;vertical-align:middle}

/* ---- bottom nav ---- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--rule-soft);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav-h);padding:0}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--fg-faint);font-size:10.5px;font-weight:600;white-space:nowrap;letter-spacing:.01em;position:relative}
.nav a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--link)}
.nav a .badge{position:absolute;top:8px;right:calc(50% - 20px);background:var(--pink-ink);color:#fff;font-size:10px;border-radius:999px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}

/* ---- common ---- */
main{padding:22px 0 30px}
#backbar{padding-top:12px}#backbar+main{padding-top:6px}#backbar .backlink{margin:0 0 0 -4px}
#homefoot{display:flex;gap:18px;flex-wrap:wrap;padding-bottom:26px;margin-top:-6px}#homefoot[hidden]{display:none}#homefoot .backlink{margin:0}
.sec{margin-bottom:26px}
.eyebrow{font-size:12px;line-height:1.3;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pink-ink);margin-bottom:8px}
:root[lang="vi"] .eyebrow{text-transform:none;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:600;font-size:15px;
  background:var(--surface-2);color:var(--fg);border:1px solid var(--rule);text-decoration:none;text-align:center;min-height:48px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.btn.pink{background:var(--tag-pink-bg);color:var(--tag-pink-ink);border-color:transparent}
.btn.block{display:flex;width:100%}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--fg-soft);background:var(--surface)}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.chip[disabled]{opacity:.4;pointer-events:none}
.chip.tag{background:var(--tag-neu-bg);color:var(--tag-neu-ink);font-weight:600;padding:4px 10px;font-size:12.5px;border-color:transparent}
.chip.pink{background:var(--tag-pink-bg);color:var(--tag-pink-ink);border-color:transparent}
.chip.blue{background:var(--tag-blue-bg);color:var(--tag-blue-ink);border-color:transparent}
.chip.lav{background:var(--lav-soft);color:var(--fg);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--rule-soft);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 0 var(--rule-soft)}
.muted{color:var(--fg-soft)}
.faint{color:var(--fg-faint);font-size:13.5px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:30;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 8px 24px var(--shade);opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.banner{background:var(--surface-2);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
.banner button{color:var(--primary);font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;white-space:nowrap;border:1px solid var(--rule);border-radius:999px;padding:0 14px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;line-height:1.2;font-size:13.5px;font-weight:600;color:var(--fg-soft);background:var(--surface)}
.tabs button.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.empty{text-align:center;color:var(--fg-faint);padding:24px 0}
.acc{border:1px solid var(--rule-soft);border-radius:14px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.acc>button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;text-align:left;font-weight:600}
.acc>button>span{flex:1;min-width:0;overflow-wrap:anywhere}
.acc>button:after{flex:none}
.acc>button:after{content:"+";color:var(--fg-faint);font-size:20px;line-height:1}
.acc.open>button:after{content:"–"}
.acc .in{display:none;padding:0 16px 14px;color:var(--fg-soft);font-size:15px}
.acc.open .in{display:block}
.acc .in p{margin-bottom:10px}

/* ---- card faces ---- */
.face{display:block;position:relative}
.face svg{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 2px 10px var(--shade)}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;margin:10px 0 4px;justify-items:center}
.mini .m{width:100%;max-width:84px;text-align:center;font-size:11px;color:var(--fg-soft);line-height:1.25;display:flex;flex-direction:column;align-items:center}
.mini .m .face{display:block;width:100%}.mini .m svg{width:100%;height:auto;display:block;margin-bottom:4px}
.mini button.m{display:flex}

/* ---- home / feed ---- */
.hello{background:linear-gradient(135deg,var(--lav-soft),var(--surface-2));border:1px solid var(--rule);border-radius:20px;padding:18px;margin-bottom:16px}
.hello h2{margin-bottom:6px}
.hello .sign{display:flex;gap:14px;align-items:center;margin:10px 0}
.hello .glyph{width:56px;height:56px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--primary);box-shadow:0 2px 8px var(--shade)}
.hello .sign b{font-size:18px;font-family:var(--display);font-weight:500}
.hello .sign .faint{margin-top:2px}
.hello .cardline{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;margin-top:12px;background:var(--surface);border-radius:14px;padding:10px 12px}
.hello .cardline .face svg{border-radius:4px}
.post{background:var(--surface);border:1px solid var(--rule-soft);border-radius:18px;padding:18px 18px 12px;margin-bottom:16px}
.post .date{font-size:12.5px;color:var(--fg-faint);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.post .date .pin{color:var(--pink-ink);font-weight:700}
.post h2{margin-bottom:10px}
.post .body p{margin:0 0 10px}
.post .body.clamp{max-height:7.6em;overflow:hidden;position:relative}
.post .body.clamp:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3em;background:linear-gradient(transparent,var(--surface))}
.post .more{color:var(--link);font-weight:700;font-size:14px;margin:2px 0 8px}
.post .markers{margin:8px 0 6px;font-size:14px;color:var(--fg-soft)}
.post .markers b{color:var(--fg)}
/* Rich post bodies: small headings, marks, title boxes, images and embedded video. */
.post .body h3{font-size:17px;margin:12px 0 6px;font-family:var(--display);font-weight:500}.post .body mark{background:var(--tag-gold-bg);color:var(--tag-gold-ink);padding:0 4px;border-radius:4px}.post .body u{text-decoration-thickness:2px;text-underline-offset:2px}
.post .body .callout{background:var(--surface-2);border-left:4px solid var(--lav);border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:600}
.post .body img.pimg{display:block;max-width:100%;border-radius:12px;margin:8px 0;min-height:40px;background:var(--surface-2)}
.post .body .video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;margin:8px 0;background:#000}.post .body .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vlink{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px 12px;text-decoration:none;color:inherit;font-weight:600;margin:8px 0}
/* Editor toolbar in the dashboard. */
.tb{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}.tb .tbl{width:auto;flex:none}.tb button,.tb .tbl{border:1px solid var(--rule);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;background:var(--surface);cursor:pointer;color:var(--fg);min-height:34px;display:inline-flex;align-items:center;gap:4px}.tb mark{background:var(--tag-gold-bg);color:var(--tag-gold-ink);padding:0 3px;border-radius:3px}
.emojis{display:flex;flex-wrap:wrap;gap:2px;margin:0 0 8px}.emojis button{font-size:22px;padding:4px 6px;border-radius:8px}.emojis button:active{background:var(--surface-2)}
.post .foryou{display:inline-block;background:var(--tag-pink-bg);color:var(--tag-pink-ink);font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;margin-bottom:8px}
.post .foot{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--rule-soft);margin-top:8px;padding-top:8px}
.post .foot button{color:var(--fg-soft);font-size:13.5px;font-weight:600;padding:6px 10px;border-radius:8px}

/* ---- pick a card ---- */
.pick-head{text-align:center;margin-bottom:18px}
.pick-head h1{margin-bottom:8px}
.pick-head p{color:var(--fg-soft)}
/* Five topics: a third of the row each, so they always fall three above and
   two below, both rows centred, instead of one chip left alone. */
.focus{justify-content:center;margin:14px 0 22px}
.focus .chip{flex:0 0 calc((100% - 16px)/3);padding-left:6px;padding-right:6px;text-align:center}
.fan{position:relative;height:250px;margin:0 auto 34px;max-width:420px;perspective:1000px}
.fan .slot{position:absolute;left:50%;bottom:0;width:104px;height:170px;margin-left:-52px;transform-origin:50% 130%;transition:transform .35s ease}
.fan .slot button{width:100%;height:100%;display:block}
.fan .slot svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 12px var(--shade))}
.fan .slot.dim{opacity:.35;transform:translateY(20px) scale(.9)!important}
.fan .slot.chosen{z-index:5;transform:translateY(-30px) scale(1.05)!important}
/* The whole deck: 78 backs in a grid, tap any one. */
/* The deck as a carousel: swipe, the middle card grows, tap to pick. */
.fan.deck{position:static;height:auto;max-width:none;perspective:none;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:16px calc(50% - 46px) 14px;margin:0 -18px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fan.deck::-webkit-scrollbar{display:none}
.fan.deck .slot{position:relative;flex:0 0 92px;width:92px;height:150px;margin:0;scroll-snap-align:center;transform:scale(.68);transform-origin:50% 50%;opacity:.45;transition:transform .12s linear,opacity .12s linear;border-radius:6px;left:auto;bottom:auto}
.fan.deck{cursor:grab}.fan.deck.grabbing{cursor:grabbing}.fan.deck .slot button{cursor:pointer}
@media (hover:hover){.fan.deck .slot:hover{transform:scale(1.12)!important;opacity:1!important;z-index:6}}
.fan.deck .slot svg{filter:drop-shadow(0 4px 8px var(--shade))}.fan.deck .slot.near{box-shadow:0 0 0 2px var(--lav)}
.fan.deck .slot.chosen{box-shadow:0 0 0 3px var(--primary);transform:scale(1.1)!important;opacity:1!important;z-index:5}.fan.deck .slot.dim{opacity:.25!important}
.deckbar{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 8px}.deckbar .btn{min-height:36px;padding:0 14px;font-size:18px;border-radius:999px}.deckbar span{min-width:64px;text-align:center;font-weight:600}
.teaser{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--tag-gold-bg);color:var(--tag-gold-ink);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:14px}.teaser span{flex:1 1 200px}.teaser .btn{flex:none}
.tap-hint{text-align:center;color:var(--fg-faint);font-size:13.5px;margin:0 0 12px;min-height:1.4em}
.reveal{margin-top:10px}
.hero{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center;margin-bottom:18px}
.hero .flip{perspective:900px}
.hero .flip .inner{position:relative;transform-style:preserve-3d;animation:flip .8s ease forwards}
.hero .flip .fr,.hero .flip .bk{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.hero .flip .bk{position:absolute;inset:0;transform:rotateY(180deg)}
@keyframes flip{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.hero .name{font-family:var(--display);font-size:26px;line-height:1.15;overflow-wrap:anywhere}
.hero>div:last-child{min-width:0}

.ins{background:var(--surface);border:1px solid var(--rule-soft);border-radius:18px;padding:18px;margin-bottom:12px}

.zring{width:min(300px,84vw);height:auto;display:block;margin:0 auto}
.ellegend{display:flex;justify-content:center;gap:12px;font-size:12px;color:var(--fg-soft);margin-top:6px}

.cmp{display:flex;justify-content:center;gap:18px;text-align:center}

.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.disc{background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;padding:12px 6px;text-align:center}
.disc .g{display:block;font-size:30px;color:var(--link)}.disc b{display:block;font-size:14px}.disc span:last-child{font-size:11px;color:var(--fg-faint)}
.elgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.elc{border:2px solid;border-radius:14px;padding:10px;background:var(--surface)}
.elc b{display:block;margin-bottom:4px}.elc a{display:block;font-size:13px;text-decoration:none;color:var(--fg);padding:2px 0}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ph{background:var(--surface);border:1px solid var(--rule-soft);border-radius:12px;padding:8px 4px;text-align:center;font-size:10.5px;color:var(--fg-faint)}

.script .paper{background:#FFFDF5;color:#3B2A5E;border:1px solid #E8DFC4;border-radius:6px;padding:16px 18px;font-family:Georgia,serif;box-shadow:0 4px 12px var(--shade);max-width:340px;margin:0 auto}

.t369{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.t3{background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;padding:12px 6px;text-align:center}
.t3 b{display:block}.t3 .cnt{display:block;font-size:20px;font-family:var(--display)}.t3 .dots{display:block;font-size:11px;letter-spacing:1px;color:var(--primary)}
.woop{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.wp{background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;padding:10px 4px;text-align:center;font-size:12px}.wp .ic{font-size:24px;display:block}.wp b{display:block;font-size:20px;font-family:var(--display);color:var(--link)}
.vboard{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.vb{background:var(--surface);border:1.5px dashed var(--rule);border-radius:14px;padding:12px 6px;text-align:center;font-size:12px;min-height:96px}.vb .ic{font-size:24px;display:block}.vb b{display:block;font-size:12.5px;margin:2px 0}.vb .ph{color:var(--fg-faint);font-size:11px}
.ritual{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}.rt{flex:1;min-width:130px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;padding:12px;text-align:center;font-size:12.5px}.rt .ic{font-size:30px;display:block}.rt b{display:block;margin:4px 0}.ritual .arr{color:var(--fg-faint);font-size:12px}
.ifthen{display:grid;gap:8px}.it{display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:13px}.it span{border-radius:12px;padding:10px 12px}.it .if{background:var(--tag-pink-bg);color:var(--tag-pink-fg)}.it .then{background:var(--tag-green-bg);color:var(--tag-green-fg)}
[hidden]{display:none!important}
.tournav{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;gap:8px;margin-top:10px}.tournav .btn{width:52px;padding:0;min-height:40px;font-size:18px}.tournav .btn[disabled]{opacity:.35;pointer-events:none}
.tourmini{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px dashed var(--lav);border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:14px;font-size:14px;font-weight:600}
.msg .flag{float:right;margin:0 0 4px 8px;font-size:12px;opacity:.55;padding:2px 6px;border-radius:8px;background:none;color:inherit}.msg .flag[disabled]{opacity:.9}.card.danger{border-color:var(--err)}
.linkbtn{color:var(--link);font-weight:700;text-decoration:underline;font-size:inherit}

.hshapes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.hs{background:var(--surface);border:1.5px solid;border-radius:14px;padding:10px;text-align:center;font-size:12px}.hshape{width:64px;height:auto;display:block;margin:0 auto 4px}.hs b{display:block;font-size:14px}.hs span{color:var(--fg-faint);display:block}.hs p{margin:4px 0 0;font-size:12.5px;text-align:left}
@media (max-width:380px){.woop{grid-template-columns:repeat(2,1fr)}.vboard{grid-template-columns:repeat(2,1fr)}}
/* Manifestation tools: editable, saved on the device. */
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.woop.edit .wp{padding:10px 8px}.woop.edit .wp textarea{margin-top:6px;min-height:76px;font-size:13px;padding:8px;text-align:left}
.vb{position:relative;min-height:0}.vb .vtap{cursor:pointer;display:block}.vb .ph{display:block;font-size:11px;line-height:1.25;margin-top:4px;padding:3px 6px;border-radius:8px;background:var(--surface-2);color:var(--fg-soft)}.vb img{width:100%;height:88px;object-fit:cover;border-radius:10px;display:block;margin-bottom:4px}.vb input{font-size:12px;padding:6px 8px;margin-top:4px;border-radius:8px}.vb .x{position:absolute;top:4px;right:4px;background:var(--surface);border-radius:50%;width:24px;height:24px;font-size:11px;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center}.vb.has{border-style:solid;border-color:var(--lav)}
.script textarea{border:0;background:transparent;font-family:Georgia,serif;font-size:15px;line-height:1.7;padding:0;min-height:240px;color:inherit;resize:vertical;width:100%}
.it.edit{grid-template-columns:1fr 1fr 30px;align-items:center}.it.edit input{font-size:13px;padding:8px 10px;border-radius:10px}.it .x{background:none;border:1px solid var(--rule);border-radius:50%;width:26px;height:26px;font-size:11px;color:var(--fg-soft)}
.moonio{display:grid;gap:10px;margin-top:12px}.mi{background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;padding:12px}.mi b{display:block;margin-bottom:6px}.mi input{margin-bottom:6px}.mi textarea{min-height:80px;margin-bottom:8px}
.letgo{background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;padding:12px;margin-top:12px}.letgo b{display:block;margin-bottom:6px}.letgo textarea{min-height:80px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.tc{background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;padding:10px 6px;text-align:center;font-size:12px;color:var(--fg-soft)}.tc .dot{display:block;width:34px;height:34px;border-radius:50%;margin:0 auto 6px;box-shadow:inset 0 -6px 10px rgba(0,0,0,.18),0 1px 2px var(--shade)}.tc .ic{font-size:26px;display:block}.tc b{display:block;font-size:12.5px;margin:2px 0;color:var(--fg)}
.mani-banner{background:linear-gradient(135deg,var(--lav-soft),var(--surface));border:1.5px solid var(--lav);border-radius:18px;padding:16px;margin:10px 0 14px}.mani-banner ul{margin:8px 0 12px;padding-left:20px;font-size:14px;color:var(--fg-soft)}
/* Flow charts: numbered steps joined by arrows, each with its text and its tool. */
.flow{display:flex;flex-direction:column;margin:14px 0 6px}.flow .fnode{display:flex;gap:12px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:16px;padding:14px}
.flow .fnode .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.flow .fnode>div{flex:1;min-width:0}.flow .fnode h2{font-size:17px;margin:2px 0 6px}.flow .fnode p{margin:0;font-size:15px;color:var(--fg-soft)}
.farrow{text-align:center;color:var(--fg-faint);font-size:22px;line-height:1;padding:3px 0}
.fnode textarea,.fnode>div>input{margin-top:10px}.fnode .ifthen,.fnode .letgo,.fnode .mi{margin-top:10px}.fnode .mi{padding:10px}
.grat{background:var(--surface);border:1px solid var(--rule-soft);border-radius:16px;padding:14px}
.grat b{display:block;margin-bottom:8px}.grat input{margin-bottom:8px}
.chk2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk2 .col{border-radius:14px;padding:10px;font-size:12.5px;background:var(--surface)}
.chk2 .bad{border:1.5px solid var(--tag-pink-bg)}.chk2 .good{border:1.5px solid var(--tag-green-bg)}
.chk2 b{display:block;margin-bottom:6px}.chk2 label{display:block;margin-bottom:4px}
@media (max-width:380px){.chk2{grid-template-columns:1fr}.cmp{gap:10px}}

/* ---- paywall ---- */
.paywall{background:var(--surface);border:1.5px solid var(--lav);border-radius:20px;padding:22px 18px;text-align:center}
.paywall .ic{font-size:40px}
.paywall h2{margin:6px 0}
.paywall .inc{text-align:left;margin:12px auto;padding-left:22px;color:var(--fg-soft);font-size:14.5px;max-width:340px}
.paywall .inc li{margin-bottom:4px}
.paywall .price{font-family:var(--display);font-size:28px;margin:10px 0 14px}
.paywall .price span{font-family:var(--body);font-size:14px;color:var(--fg-faint)}
.pickico{width:22px;height:38px;vertical-align:middle;display:inline-block;filter:drop-shadow(0 2px 4px var(--shade))}
.tile .ic .pickico{width:24px;height:41px}
.svc .t .ic .pickico{width:20px;height:34px}
.tile .lock{font-size:16px;vertical-align:middle}
/* Three columns, so the padlocks line up down the card however long the
   names are, and the prices stay flush right. */
.course{display:grid;grid-template-columns:1fr 20px auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--rule-soft);font-size:14.5px}
.course .nm{min-width:0;overflow-wrap:anywhere}.course .ic{text-align:center;font-size:13px}.course .pr{text-align:right;white-space:nowrap}
.codebox{font-family:Georgia,serif;font-size:22px;letter-spacing:.06em;background:var(--surface-2);border-radius:12px;padding:12px;text-align:center;margin:10px 0;user-select:all}

/* ---- booking ---- */
.tip{background:var(--tag-lav-bg,var(--surface-2));color:var(--fg);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.5;margin:10px 0 4px}
/* instruction rows: icon column + text, every row starts at the same edge */
.notes{margin:2px 0 8px}.note{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.5;color:var(--fg-soft);margin:0 0 8px}.note .ni{flex:none;width:22px;text-align:center;font-size:16px;line-height:1.35}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.row3 .btn{padding:11px 4px;font-size:13.5px;white-space:nowrap;text-align:center;min-width:0}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.themes .chip{padding:8px 2px;font-size:12.5px;white-space:nowrap;text-align:center;min-width:0}
.cart{background:var(--surface);border:1.5px solid var(--primary);border-radius:16px;padding:12px 14px;margin:4px 0 6px;font-size:14.5px;max-width:100%;overflow:hidden}.cart.empty{border-style:dashed;border-color:var(--rule);color:var(--fg-faint)}.cart>b{display:block;margin-bottom:8px}
.ci{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:7px 0;border-top:1px solid var(--rule-soft)}.ci>span{flex:1 1 140px}.ci b{margin-left:auto}.ci>span{flex:1;min-width:0}.ci b{white-space:nowrap}.ci .x{background:none;border:1px solid var(--rule);border-radius:50%;width:28px;height:28px;font-size:12px;color:var(--fg-soft)}.ci.total{border-top:2px solid var(--rule);font-weight:700}.ci small.warn,.tpick .warn{color:#B04A2E;font-size:12.5px;font-weight:600}.ci small.ok,.tpick .ok{color:#2E7D46;font-size:12.5px;font-weight:600}
.tpick{margin:14px 0 18px}.tpick h3{margin:0 0 8px;font-size:15.5px}
.topic{display:block;width:100%;max-width:100%;text-align:left;background:var(--surface);border:1px solid var(--rule-soft);border-radius:16px;padding:14px 16px;margin-bottom:10px;overflow:hidden}
.topic.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
.topic .t{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.topic .t>span:last-child{min-width:0;overflow-wrap:anywhere}
.topic .t .n{color:var(--fg-faint);font-weight:500;font-size:13px}
.topic .t .ic{font-size:20px}
.topic ol{margin:10px 0 0;padding-left:22px;color:var(--fg-soft);font-size:14.5px;display:none;text-align:left;list-style:decimal outside}
.topic.open ol{display:block}
.topic ol li{margin-bottom:4px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{position:relative;padding-left:36px;margin-bottom:10px;color:var(--fg-soft)}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--lav-soft);color:var(--fg);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.msgbox{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-width:100%;line-height:1.5;background:var(--surface-2);border:1px dashed var(--rule);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--fg-soft);margin:12px 0}
.cal{background:var(--surface);border:1px solid var(--rule-soft);border-radius:18px;padding:14px;margin-bottom:12px}
.cal .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal .head b{font-family:var(--display);font-weight:500;font-size:18px}
.cal .head button{width:36px;height:36px;border-radius:50%;background:var(--surface-2);font-size:18px}
.cal .dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--fg-faint);text-align:center;margin-bottom:4px;font-weight:600}
.cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .d{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;color:var(--fg-faint);position:relative}
.cal .d.has{color:var(--fg);font-weight:600;background:var(--surface-2)}
.cal .d.has:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--pink-ink);position:absolute;bottom:6px}
.cal .d.today{box-shadow:0 0 0 1px var(--lav) inset}
.cal .d.sel{background:var(--primary);color:var(--primary-ink)}
.cal .d.sel:after{background:var(--primary-ink)}
.cal .d.off{opacity:.35}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slots button{border:1px solid var(--rule);border-radius:12px;padding:10px 6px;font-weight:600;font-size:14px;background:var(--surface)}
.slots button.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.slots button.taken{opacity:.35;text-decoration:line-through;pointer-events:none}
.picked{display:flex;align-items:center;gap:10px;background:var(--tag-gold-bg);color:var(--tag-gold-ink);border-radius:12px;padding:10px 14px;font-weight:600;margin-top:10px}

/* ---- me / auth / chat ---- */
.avatar{width:56px;height:56px;border-radius:50%;background:var(--lav-soft);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px;color:var(--fg)}
.me-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.me-head b{font-size:18px;font-family:var(--display);font-weight:500;display:block}
.providers{display:flex;flex-direction:column;gap:8px}
.chat{display:flex;flex-direction:column;gap:8px;min-height:200px;max-height:60vh;overflow:auto;padding:6px 2px}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--primary);color:var(--primary-ink);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
