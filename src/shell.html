/* The four everyday activities, offered on the home page as well. */
.actquick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.actquick.three{grid-template-columns:repeat(3,1fr);margin-top:10px}
.actquick.next{margin-top:10px}
.actquick .aq{position:relative}
.actquick .aq .cnt{position:absolute;top:5px;right:6px;background:var(--tag-gold-bg);color:var(--tag-gold-ink);border-radius:999px;padding:0 6px;font-size:10.5px;font-weight:700}
.actquick .aq{display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;padding:10px 4px;text-decoration:none;color:inherit;min-width:0}
.actquick .aq .ic{font-size:21px;line-height:1}
.actquick .aq b{font-size:11px;font-weight:600;line-height:1.25;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* ---- the red thread ---- */
.lovecard{text-align:center}
.threadart{display:block;width:100%;max-width:250px;margin:0 auto 4px}
@keyframes knotbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.13)}}
.knot.beat{transform-origin:120px 109px;animation:knotbeat 2.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.knot.beat{animation:none}}
.lovecard .lead{margin:0 0 10px;color:var(--fg-soft)}
.lovecard .pair{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-family:var(--display);font-size:16px;font-weight:600}
.lovecard .pair i{font-style:normal;font-size:14px}
.lovecard .daysbig{display:flex;flex-direction:column;align-items:center;margin:12px 0 2px}
.lovecard .daysbig b{font-family:var(--display);font-size:44px;line-height:1;color:#C41F3A}
.lovecard .daysbig span{font-size:12.5px;color:var(--fg-soft);letter-spacing:.04em}
.lovecard .since{margin:2px 0 0;font-size:13.5px;color:var(--fg-soft)}
/* The number is drawn in the thread's own red, which is too deep to read on a
   dark ground, so the dark themes take a lighter one. */
:root[data-theme="dark"] .lovecard .daysbig b{color:#FF8FA3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .lovecard .daysbig b{color:#FF8FA3}}
.reqcard b{display:block;font-family:var(--display);font-size:15.5px}
.reqcard .note{margin:8px 0 0;font-size:14px;background:var(--surface-2);border-radius:12px;padding:9px 12px;text-align:left}
.reqcard.found{margin:12px 0 0;border-color:var(--lav)}
.athandle .at{flex:none;color:var(--fg-faint);font-weight:600;font-size:17px}
/* The tag on the profile: a fixed blush ground, so a fixed ink to go on it. */
.lovetag{display:inline-flex;align-items:center;gap:7px;background:#FCE4E9;color:#8A1F33;border:1px solid #F3B7C3;border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;text-decoration:none;margin:0 0 14px}
.lovetag .d{color:#A85267;font-weight:500}
.lovemark{width:26px;height:26px;flex:none;display:block}
.lovemark.big{width:64px;height:64px;margin:0 auto 6px}
.lovemark.inline{width:24px;height:24px;display:inline-block;vertical-align:-5px}
/* In a row of activities the mark takes the place an emoji held, so it needs
   the same footprint the emoji had. */
.actbtn .ic .lovemark{width:32px;height:32px;margin:0 auto}
.actquick .aq .ic .lovemark{width:24px;height:24px}
.btn .lovemark{width:20px;height:20px;display:inline-block;vertical-align:-4px;margin-right:2px}
#main h1 .lovemark{width:30px;height:30px;display:inline-block;vertical-align:-4px}
.lovetag.st-engaged{background:#FFF3DC;border-color:#EBCB8E;color:#6B4D0F}
.lovetag.st-engaged .d{color:#8A6A22}
.lovetag.st-married{background:#F6ECFF;border-color:#D6BEF0;color:#4B2A6E}
.lovetag.st-married .d{color:#6C4C94}
/* The stage, named under the pair. */
#main .lovecard .stagename{margin:4px 0 0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pink-ink)}
:root[lang="vi"] #main .lovecard .stagename{text-transform:none;letter-spacing:.02em}
/* The question, and its answer. */
/* The four stages in order, the one reached so far lit. */
.roadcard .eyebrow{text-align:left;margin-bottom:10px}
.road{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;align-items:start}
.road .rs{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;opacity:.38;filter:grayscale(.7)}
.road .rs.on{opacity:1;filter:none}
.road .rs .lovemark{width:34px;height:34px}
.road .rs b{font-size:11px;font-weight:600;text-align:center;line-height:1.2}
/* A hairline between one stage and the next, tucked behind the marks. */
.road .rs+.rs::before{content:'';position:absolute;left:-56%;top:16px;width:56%;height:1.5px;background:var(--rule);border-radius:2px}
.road .rs.on+.rs.on::before{background:var(--gold)}
.askcard{text-align:center}
.askcard h3{margin-bottom:4px}
.askcard>b{display:block;font-family:var(--display);font-size:16px;margin-bottom:2px}
.askcard .note{margin:8px 0;font-size:14px;background:var(--surface-2);border-radius:12px;padding:9px 12px}
.askcard.theirs{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.askcard.done{background:linear-gradient(180deg,var(--tag-gold-bg),var(--surface))}
.askcard .row2{margin-top:12px}
.rolepick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 4px}
.rolepick .rp{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:8px 4px;font-size:12.5px;font-weight:600}
.rolepick .rp i{font-style:normal;font-size:19px;line-height:1;color:var(--link)}
.rolepick .rp.on{border-color:var(--primary);background:var(--surface-2);box-shadow:0 0 0 1px var(--primary) inset}
/* What has been given. */
.giftart{width:34px;height:34px;display:block}
.giftart.big{width:58px;height:58px}
.giftcard .lastgift{display:flex;align-items:flex-start;gap:12px;background:var(--surface-2);border-radius:14px;padding:12px}
.giftcard .lastgift b{display:block;font-size:14.5px}
.giftcard .lastgift .note{margin:4px 0 2px;font-size:14px}
.giftcard .lastgift .faint{font-size:12px}
.giftrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.giftrow .gi{display:block;padding:4px;border-radius:10px;background:var(--surface-2)}
.giftrow .gi.mine{background:var(--surface-3)}
.giftpick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.giftpick .gp{display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:12px;padding:8px 3px}
.giftpick .gp b{font-size:10.5px;font-weight:600;line-height:1.2;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.giftpick .gp:disabled{opacity:.5}
/* Short, and hard to miss: who this little one belongs to. */
#main p.petfam{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin:12px 0 2px;font-size:13px}
#main p.petfam b{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-faint)}
:root[lang="vi"] #main p.petfam b{text-transform:none;letter-spacing:.02em}
#main p.petfam .pp{display:inline-flex;align-items:center;gap:5px;background:var(--tag-pink-bg);color:var(--tag-pink-ink);border-radius:999px;padding:3px 11px;font-weight:600}
#main p.petfam .pp i{font-style:normal;font-size:14px;opacity:.85}
/* An invitation someone opened before they had an account, waiting on the
   profile screen for them to come back to it. */
.lovetag.waiting{background:#FFF1DC;border-color:#EFCE9B;color:#7A4E14;display:flex}
.lovetag.waiting .d{color:#9A6B24}
/* The link itself: shown in full, because being able to read it before you
   send it is half of trusting it. */
.invitecard #lvurl{font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-top:2px;background:var(--surface-2)}
.invitecard .row2{margin-top:10px}
.reqcard.nothere{border-color:#EFCE9B;background:linear-gradient(180deg,rgba(255,241,220,.55),var(--surface))}
.reqcard.nothere .note{background:var(--surface)}
.actbtn.act-love{border-color:#F3B7C3}

/* ---- angel numbers ---- */
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.angelpad{text-align:center}
.angelshow{font-family:var(--display);font-size:38px;font-weight:600;letter-spacing:4px;color:var(--primary);margin:6px 0 12px;min-height:46px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:280px;margin:0 auto}
.keypad .key{background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:14px;padding:13px 0;font:inherit;font-size:19px;font-weight:600;color:var(--fg);cursor:pointer}
.keypad .key:active{background:var(--surface);transform:scale(.96)}
.keypad .key.go{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.sigil{display:block;height:auto}
/* The wash is the number's own pastel and never changes; the text follows
   the theme. So the pastel is laid on as a layer rather than painted as the
   background: in the light it reads as before, and in the dark it thins to a
   tint of the same colour over the dark surface, which the pale ink can sit
   on. */
.angelanswer{position:relative;border:1.5px solid var(--ink);background:var(--surface);overflow:hidden}
.angelanswer::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,var(--aura),transparent 82%);pointer-events:none}
.angelanswer>*{position:relative}
:root[data-theme="dark"] .angelanswer::before{opacity:.22}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .angelanswer::before{opacity:.22}}
.angelanswer .head{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.angelanswer .head b{display:block;font-family:var(--display);font-size:17px;font-weight:600}
.angelanswer .head span{font-size:13px;color:var(--fg-soft)}
#main .angelanswer p.why{font-size:12.5px;color:var(--fg-soft);margin-bottom:8px;text-align:left}
.angelrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:16px;padding:10px 14px;text-decoration:none;color:inherit}
.angelrow .b{flex:1;min-width:0}
.angelrow .b b{display:block;font-weight:600;font-size:14px}
.angelrow .b span{font-size:12.5px;color:var(--fg-soft)}
.angelrow .go{color:var(--fg-soft);font-size:18px}
.angelgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.angeltile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--rule-soft);text-decoration:none;color:inherit;min-width:0}
.angeltile b{font-size:11.5px;font-weight:600;text-align:center;line-height:1.25}
.angeltile span{font-size:10.5px;color:var(--fg-soft);text-align:center}
.angellog{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.angellog li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;padding:7px 12px;border-radius:10px;background:var(--surface-2)}
.angellog li b{font-family:var(--display);font-size:15px;letter-spacing:1px}
.angellog li span{color:var(--fg-soft);font-size:12px}
.angelhero{text-align:center;margin-bottom:14px}
.angelhero .sigil{margin:0 auto 8px}
.angelhero h1{margin-bottom:4px}
.angelone .seen{justify-content:center;margin-top:8px}
.angelone .seen .chip{font-family:var(--display);letter-spacing:1px}
.angelone .keys{margin-bottom:12px}
/* The way to the looks picker, offered under whatever it changes. */
.lookslink{text-align:center;margin:10px 0 0}
.lookslink a{color:var(--gold-deep);font-weight:600;font-size:13.5px;text-decoration:none;border-bottom:1px solid var(--gold-soft);padding-bottom:1px}
.coinbox{text-align:center}
.coinbox .n{display:block;font-family:var(--display);font-size:38px;font-weight:600;line-height:1.15;color:var(--gold-deep)}
.coinbox .u{display:block;font-size:13px;color:var(--fg-soft);margin-bottom:6px}
.vlist{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:6px}
.vlist li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;padding:8px 12px;border-radius:12px;background:var(--surface-2);color:var(--fg-soft)}
.vlist li.on{background:var(--tag-gold-bg);color:var(--tag-gold-ink)}
.vlist li b{white-space:nowrap;font-weight:700}
.holds{list-style:none;margin:0 0 8px;padding:0;display:grid;gap:8px}
.holds li{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--fg-soft)}
.holds li span{flex:1}
.holds li b{font-weight:700;color:var(--gold-deep);white-space:nowrap}
.btn.tiny{padding:5px 11px;font-size:12.5px;width:auto;flex:none}
.petstat{display:flex;justify-content:center;gap:14px;font-size:13.5px;color:var(--fg-soft);margin-bottom:10px}
/* What the companion answers with, once a day. */
/* Its own space at both ends, so neither the marker above nor the badge
   below it ever collides with the text. */
/* Everything the card says about the day - fed, still full, feed before you
   pray - is one voice and sits in the middle of the card. */
#main .petwrap p.hint{text-align:center}
#main .petwrap p.prayhint{margin:14px 0 4px}
.petwrap .lucktag{display:flex;width:max-content;max-width:100%;margin:16px auto 0}
.bless{position:relative;margin:22px 0 18px;padding:18px 16px 14px;border-radius:14px;background:var(--surface-2);border:1px solid var(--rule-soft)}
.bless .q{position:absolute;top:-13px;left:14px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:999px;padding:2px 8px;font-size:15px;line-height:1.2}
#main .bless p{margin:0 0 8px;font-size:14.5px;line-height:1.65;text-align:center;text-wrap:balance;hyphens:none}
.bless .who{display:block;text-align:center;font-size:12px;color:var(--fg-soft)}
.btn.off{opacity:.55}
/* Switching between the companions you keep. */
/* The title holds the name and the pencil that edits it in place. */
#main h1.pettitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pettitle input{flex:1 1 160px;min-width:0;max-width:260px;font-size:17px;padding:8px 12px}
.renamebtn{flex:none;width:34px;height:34px;border:1px solid var(--rule);border-radius:50%;background:var(--surface);font-size:15px;line-height:1;display:grid;place-content:center}
.petsetcard{margin-top:18px}
/* Six at most, so they fit on two rows and sit in the middle rather than
   sliding off to the left. */
.pettabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:12px;padding-bottom:2px}
.pettabs .pt{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;width:74px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;padding:6px 4px;font:inherit;color:inherit;cursor:pointer}
.pettabs .pt svg{width:42px;height:42px}
.pettabs .pt b{font-size:11px;font-weight:600;line-height:1.25;text-align:center}
.pettabs .pt.on{border-color:var(--primary);border-width:1.5px;background:var(--surface-2)}
/* The shelves: food, homes, charms. */
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shelf .sh{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;background:var(--surface-2);border:1px solid var(--rule-soft);border-radius:14px;padding:10px 6px;font:inherit;color:inherit;cursor:pointer}
.shelf .sh b{font-size:11.5px;font-weight:600;line-height:1.3;text-align:center}
.shelf .sh.on{border-color:var(--primary);border-width:1.5px;background:var(--surface)}
.shelf .sh.locked{border-style:dashed;opacity:.94}
.shelf .shart{display:flex;align-items:center;justify-content:center;height:46px;font-size:26px;line-height:1;width:100%}
.shelf .shart svg{position:static;max-width:100%;max-height:46px;width:auto;height:auto;border-radius:8px}
.shelf .plus{font-size:11px;font-weight:700;color:var(--gold-deep);background:var(--tag-gold-bg);border-radius:999px;padding:0 6px}
.shelf .sh-lock{position:absolute;top:6px;right:7px;font-size:13px}
.shelf .sh-on{position:absolute;top:6px;left:7px;color:var(--primary);font-weight:700;font-size:13px}
.coats{justify-content:center}
.coat{width:34px;height:34px;border-radius:50%;border:2px solid var(--rule);cursor:pointer;font-size:13px;line-height:1;padding:0}
.coat.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary) inset}
/* Choosing a companion: all four are always shown, with the luck each keeps. */
.petpick{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.petpick .pp{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:16px;padding:12px 8px;font:inherit;color:inherit;cursor:pointer}
.petpick .pp b{font-size:13.5px;font-weight:600}
.petpick .ppart{position:relative;display:block;width:88px}
.petpick .pl{display:inline-flex;align-items:center;gap:4px;background:var(--aura);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.petpick .pp.have{border-color:var(--primary);border-width:1.5px}
.petpick .pp.locked{border-style:dashed}
.petpick .pp.myth{background:linear-gradient(180deg,var(--tag-gold-bg),var(--surface));border-color:var(--gold-soft)}
.petpick .x2{position:absolute;top:8px;left:9px;background:var(--gold);color:var(--gold-ink);border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:700}
#main p.mythline{text-align:center;margin:0 0 10px;font-size:13px;font-weight:600;color:var(--gold-deep)}
/* The sparks on a spirit beast, and its steadier glow. */
.petart .sparks .twinkle{animation:twinkling 2.8s ease-in-out infinite}
/* A slow beat, from a group that carries no placement of its own. */
@keyframes wingbeat{0%,100%{transform:scaleX(1) translateY(0)}50%{transform:scaleX(.9) translateY(-1.5px)}}
.petart .wingpair{transform-box:view-box;transform-origin:60px 84px;animation:wingbeat 3.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.petart .wingpair{animation:none}}
.petpick .pp-lock{position:absolute;top:8px;right:9px;font-size:14px}
.petpick .pp-on{position:absolute;top:8px;left:9px;color:var(--primary);font-weight:700}
/* The companions stand at the foot of the tree rather than in the branches. */
.treewrap{position:relative}
/* The stage is exactly the tree picture, so the companions can be placed
   against the ground the tree stands on rather than against the card. */
.treestage{position:relative;width:100%;max-width:300px;margin:0 auto 6px}
.treestage .tree{margin:0}
/* Centred under the tree, on the ground the tree stands on. */
.treepets{position:absolute;left:0;right:0;bottom:7%;z-index:2;display:flex;justify-content:center;align-items:flex-end;pointer-events:none}
/* The companion by the tree stands still. Sliding it about looked like a
   shape being moved across a slide rather than an animal. */
.treepet{width:31%;max-width:96px;display:block;pointer-events:auto}
.treepet+.treepet{margin-left:-7%}
@media (max-width:360px){.treepet{width:34%}}
.unlist{display:grid;gap:10px}
.unl{background:var(--surface);border:1px solid var(--rule-soft);border-radius:16px;padding:14px}
.unl.best{border-color:var(--pink);border-width:1.5px}.unl.on{border-color:var(--gold)}
button.unl{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.unl.pick{border-color:var(--primary);border-width:1.5px;background:var(--surface-2)}
.unl.pick .unl-st{background:var(--primary);color:var(--primary-ink)}
#ucart .sum .r{justify-content:space-between;align-items:baseline}
#ucart .sum .r.tot{font-weight:700;border-top:1px solid var(--rule);border-bottom:0}
.unl-h{display:flex;align-items:baseline;gap:10px}
.unl-h b{font-family:var(--display);font-weight:500;font-size:17px;flex:1;min-width:0}
.unl-h .pr{font-weight:700;white-space:nowrap}
.unl .hint{margin:6px 0 0}
.unl-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
/* Its own class: the shared .st chip never wraps, and a long line of status
   text has to. Background and ink always come from one matched pair, so the
   contrast holds on light, dark and pastel pink alike. */
.unl-st{font-size:12.5px;line-height:1.35;font-weight:600;border-radius:9px;padding:4px 9px;background:var(--surface-3);color:var(--fg-soft)}
.unl.on .unl-st{background:var(--tag-gold-bg);color:var(--tag-gold-ink)}.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns .btn{width:100%}
/* Booking summary card and the done screen. */
.sum{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:4px 14px;font-size:14.5px;margin:10px 0;text-align:left}.sum .r{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--rule-soft)}.sum .r:first-child{border-top:0}
.sum .k{flex:none;width:86px;color:var(--fg-faint);font-size:12.5px;font-weight:600;padding-top:2px}.sum .v{flex:1;min-width:0;overflow-wrap:anywhere}.sum ul{margin:0;padding-left:16px}.sum li{margin:2px 0}.sum li small{font-size:12.5px}.sum .warn{color:#B04A2E;font-weight:600}.sum .ok{color:#2E7D46;font-weight:600}
.msgd{margin:6px 0 12px}.msgd summary{cursor:pointer;font-size:13.5px;color:var(--fg-soft);font-weight:600;padding:6px 0}

.fyg .in h2{font-size:17px;margin:12px 0 4px;font-family:var(--display);font-weight:500;color:var(--fg)}.fyg .in .lead{color:var(--fg);font-weight:500}

.ai{padding:14px}.ai .sugs{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;margin:8px -14px 8px;padding:0 14px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}.ai .sugs::-webkit-scrollbar{display:none}.ai .sugs .chip{white-space:nowrap;flex:none}
.ai-chat{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow:auto;padding:10px;border:1px solid var(--rule-soft)}.ai-chat .msg{max-width:94%}.ai-chat .msg p{margin:0 0 6px}.ai-chat .msg p:last-child{margin:0}
.ai .chatbar{align-items:flex-end}.ai .chatbar textarea{flex:1;min-height:46px;resize:none}.ai .chatbar .btn{min-height:46px;padding:0 16px}.ai .chatbar .btn[disabled]{opacity:.5}
.ok{color:var(--ok)}.err{color:var(--err)}

@media (max-width:380px){.hero{grid-template-columns:96px 1fr}.fan{height:230px}.fan .slot{width:92px;height:150px;margin-left:-46px}.nav a{font-size:9.5px}}
@media (min-width:640px){.fan{height:280px}.fan .slot{width:120px;height:196px;margin-left:-60px}.tiles{grid-template-columns:1fr 1fr 1fr}}
/* Activities: piles that flip, polls with bars, the wish jar. */
.piles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0;align-items:stretch}.piles.n2{grid-template-columns:repeat(2,minmax(0,1fr))}.piles.n4{grid-template-columns:repeat(4,minmax(0,1fr))}.piles.n5{grid-template-columns:repeat(5,minmax(0,1fr))}
.pmsg{background:var(--tag-gold-bg);color:var(--tag-gold-ink);border:1.5px solid var(--gold);border-radius:14px;padding:12px 14px;margin:4px 0 10px;font-size:14.5px}.pmsg .eyebrow{color:inherit;opacity:.8}.pmsg p{margin:0 0 8px}.pmsg h3{margin:4px 0 6px}
.actlist{display:grid;gap:10px}.actbtn{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:16px;padding:12px 14px;text-decoration:none;color:inherit}.actbtn.live{border-color:var(--lav)}.actbtn .ic{font-size:26px;flex:none;width:40px;text-align:center}.actbtn .body{flex:1;min-width:0}.actbtn b{display:block}
/* One size for every post and activity title. Two titles side by side at
   different sizes read as a mistake, so nothing is resized per title. */
.post h2,.actbtn b{font-family:var(--display);font-weight:600;font-size:15px;line-height:1.4}.actbtn .meta{display:block;font-size:12.5px;color:var(--fg-faint);margin-top:2px}.actbtn .chev{color:var(--fg-faint);font-size:22px;flex:none}
.pile{perspective:900px;cursor:pointer;position:relative;min-width:0;height:0;padding-top:146%}.pile-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.4,.2,.2,1)}.pile.open .pile-inner{transform:rotateY(180deg)}
.pile .pf,.pile .pb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;transition:visibility 0s .35s}.pile .pb{visibility:hidden}.pile.open .pb{visibility:visible}.pile.open .pf{visibility:hidden}
.pile .pf{background:var(--surface);border:1.5px solid var(--rule);overflow:hidden}.pile .pf .pileart{position:absolute;inset:0;width:100%;height:100%;display:block}.pile .pfl{position:absolute;left:0;right:0;bottom:0;padding:5px 4px;background:rgba(255,247,238,.9);color:#3B2A5E;text-align:center;display:flex;flex-direction:column;line-height:1.1}.pile .pfl b{font-size:14px}.pile .pfl span{font-size:10.5px;color:#6B5C8A;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pile.chosen .pf{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary) inset,0 6px 16px var(--shade);transform:translateY(-3px)}
.pile.chosen .pf{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary) inset}.pile.chosen .pf:after{content:'✓';position:absolute;top:6px;right:8px;font-weight:700;color:var(--primary)}
.pile .pb{transform:rotateY(180deg);background:var(--tag-gold-bg);color:var(--tag-gold-ink);border:1.5px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.pile .pb b{font-size:26px;font-family:var(--display)}.pile .pb span{font-size:18px}
.pollopts{display:grid;gap:8px;margin:10px 0 6px}.pollopt{position:relative;display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--rule);border-radius:12px;padding:11px 12px;font-weight:600;overflow:hidden}.pollopt .bar{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--lav-soft);transition:width .6s;z-index:0}.pollopt .lbl{position:relative;flex:1;min-width:0}.pollopt .pct{position:relative;color:var(--fg-soft);font-size:13px}.pollopt.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}.pollopt[disabled]{opacity:1;cursor:default}
.wishjar{text-align:center}.wishjar .jar{position:relative;font-size:64px;line-height:1;height:110px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:8px}.wishjar .note{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);background:#FFFDF5;color:#3B2A5E;border:1px solid #E8DFC4;border-radius:6px;padding:6px 10px;font-size:12px;font-family:Georgia,serif;max-width:220px;opacity:0}.wishjar .jar.fly .note{animation:wishfly 2.4s ease-out forwards}.wishjar .star{position:absolute;font-size:16px;color:var(--gold);opacity:0}.wishjar .s1{left:30%;bottom:70px}.wishjar .s2{right:28%;bottom:40px}.wishjar .s3{left:52%;bottom:96px}.wishjar .jar.fly .star{animation:twinkle 1.6s ease-in-out .3s 2}
.wishlist{text-align:left;margin:8px 0;padding-left:0;list-style:none;font-size:13.5px}.wishlist li{padding:6px 0;border-top:1px solid var(--rule-soft)}.wishlist .d{display:block;font-size:11.5px;color:var(--fg-faint)}
.actgroup{margin-top:14px}.actgroup .eyebrow{text-align:left;margin-bottom:8px}.actgroup .eyebrow .cnt,.actfilter .cnt{display:inline-block;background:var(--surface-3);color:var(--fg-soft);border-radius:999px;padding:0 7px;font-size:11px;margin-left:4px;vertical-align:1px}.actgroup .actbtn{margin-bottom:8px}.actgroup .more{margin-top:0}.actgroup .btn.block{margin-top:2px}.actfilter{margin-bottom:4px}
.actbtn b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pollstat{margin-top:2px}.diary .date{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--fg-soft)}.moods{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px}.mood{font-size:24px;padding:4px 8px;border-radius:12px;border:1px solid transparent}.mood.on{border-color:var(--primary);background:var(--surface-2)}.diary textarea{min-height:120px}.diary.past p{margin:6px 0 0;font-size:14.5px}
.wishjar textarea{min-height:70px;text-align:center}.wishjar .btn{margin-top:8px}
/* Folded slips settling in the bottom of the jar, one per wish. */
.wishjar .papers{position:absolute;left:50%;bottom:9px;width:36px;height:50px;transform:translateX(-50%);pointer-events:none}
.wishjar .papers i{position:absolute;width:13px;height:9px;background:#FFFDF5;border:1px solid #DFD3AE;border-radius:2px;box-shadow:0 1px 1px rgba(0,0,0,.10)}
.wishjar .papers i.fresh{animation:slipdrop .55s cubic-bezier(.3,.8,.4,1)}
@keyframes slipdrop{0%{opacity:0;transform:translateX(-50%) translateY(-46px) rotate(0deg)}100%{opacity:1}}
@keyframes wishfly{0%{opacity:0;transform:translate(-50%,10px) scale(.9)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-120px) scale(1.05)}}@keyframes twinkle{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
.act .foot{justify-content:flex-start}
/* ---- read in the dark ----
   Last in the sheet on purpose: these lift colours that are legible on a
   pale page and not on a dark one, and they have to win over the rules
   that set them. */
:root:not([data-theme="light"]) .warn,
:root:not([data-theme="light"]) .ci small.warn,
:root:not([data-theme="light"]) .tpick .warn,
:root:not([data-theme="light"]) .sum .warn{color:#FF9E86}
:root:not([data-theme="light"]) .ci small.ok,
:root:not([data-theme="light"]) .tpick .ok,
:root:not([data-theme="light"]) .sum .ok{color:#7BD9A0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn,:root:not([data-theme="light"]) .sum .warn{color:#FF9E86}}
</style>
