<meta name="mobile-web-app-capable" content="yes">

<style>
/* __FONTS__ */

/* Palette taken from the Nabu Tarot logo: lavender ground, cream disc, deep
   purple line, gold crescent, pink and blue side cards. */
:root{
  --bg:#EFE9FA; --surface:#FFF9FA; --surface-2:#F4EEFB; --surface-3:#E9E0F7;
  --fg:#3B2A5E; --fg-soft:#6B5C8A; --fg-faint:#9C90B6;
  --rule:#DCD2EE; --rule-soft:#E9E2F5;
  --lav:#B8A4E3; --lav-soft:#D9CDF3; --pink:#F6BBCB; --pink-ink:#8C3A5B; --blue:#AFC8F0; --blue-ink:#2F4E86;
  --gold:#E5BE5E; --gold-soft:#F6E5B3; --gold-ink:#3B2A5E;
  --primary:#3D2A6E; --primary-ink:#FFF7EE;
  --link:#3D2A6E; --picked-ink:#3B2A5E; --ok:#2E7D46; --err:#B4384E;
  --card-bg:#FBF6F1; --card-ink:#3B2A5E;
  --back-1:#3D2A6E; --back-2:#4B3684;
  --wands-ink:#B04A2E; --cups-ink:#2F5E9A; --swords-ink:#5C6680; --pentacles-ink:#3D6B3F; --major-ink:#5B3F9E;
  --shade:rgba(59,42,94,.18);
  --tag-pink-bg:#F6BBCB; --tag-pink-ink:#5B2340; --tag-blue-bg:#AFC8F0; --tag-blue-ink:#1F3A6B; --tag-gold-bg:#F6E5B3; --tag-gold-ink:#5C4312; --tag-green-bg:#CFEBD6; --tag-green-ink:#1F5A32; --tag-neu-bg:#E9E0F7; --tag-neu-ink:#4A3D6B;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  /* Vietnamese letters can carry a mark above and a dot below. Playfair is a
     Didone whose marks are tall and heavy, so accented letters look bigger
     than the plain ones. Lora keeps the book-serif feel with gentler contrast
     and marks drawn to sit inside the line. English keeps Playfair. */
  --body:"Be Vietnam Pro","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --nav-h:66px;
  color-scheme:light;
}
/* Dark: follows the phone unless the visitor picked a theme. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
  --bg:#241A45; --surface:#312559; --surface-2:#3B2D6A; --surface-3:#463779;
  --fg:#F6F0FA; --fg-soft:#CBC0E4; --fg-faint:#9F92C2;
  --rule:#4D3F80; --rule-soft:#3F3271;
  --lav:#B8A4E3; --lav-soft:#5A4A92; --pink:#F6BBCB; --pink-ink:#F6BBCB; --blue:#AFC8F0; --blue-ink:#AFC8F0;
  --gold:#E5BE5E; --gold-soft:#5C4B2A; --gold-ink:#2A1E4A;
  --primary:#E5BE5E; --primary-ink:#2A1E4A;
  --link:#E5BE5E; --picked-ink:#F6F0FA; --ok:#8CD79A; --err:#F08A8A;
  --card-bg:#F4EEE6; --card-ink:#3B2A5E;
  --back-1:#3D2A6E; --back-2:#4B3684;
  --wands-ink:#F0937A; --cups-ink:#8FC2F0; --swords-ink:#BDC5D8; --pentacles-ink:#9BCB92; --major-ink:#C7B6F3;
  --shade:rgba(0,0,0,.5);
  --tag-pink-bg:#6E2F49; --tag-pink-ink:#FFD6E1; --tag-blue-bg:#2F4E86; --tag-blue-ink:#DCE8FF; --tag-gold-bg:#6B5320; --tag-gold-ink:#FFE9B0; --tag-green-bg:#245C36; --tag-green-ink:#D2F2DB; --tag-neu-bg:#463779; --tag-neu-ink:#EDE6FA;
  color-scheme:dark;
  }
}
:root[data-theme="dark"]{

  --bg:#241A45; --surface:#312559; --surface-2:#3B2D6A; --surface-3:#463779;
  --fg:#F6F0FA; --fg-soft:#CBC0E4; --fg-faint:#9F92C2;
  --rule:#4D3F80; --rule-soft:#3F3271;
  --lav:#B8A4E3; --lav-soft:#5A4A92; --pink:#F6BBCB; --pink-ink:#F6BBCB; --blue:#AFC8F0; --blue-ink:#AFC8F0;
  --gold:#E5BE5E; --gold-soft:#5C4B2A; --gold-ink:#2A1E4A;
  --primary:#E5BE5E; --primary-ink:#2A1E4A;
  --link:#E5BE5E; --picked-ink:#F6F0FA; --ok:#8CD79A; --err:#F08A8A;
  --card-bg:#F4EEE6; --card-ink:#3B2A5E;
  --back-1:#3D2A6E; --back-2:#4B3684;
  --wands-ink:#F0937A; --cups-ink:#8FC2F0; --swords-ink:#BDC5D8; --pentacles-ink:#9BCB92; --major-ink:#C7B6F3;
  --shade:rgba(0,0,0,.5);
  --tag-pink-bg:#6E2F49; --tag-pink-ink:#FFD6E1; --tag-blue-bg:#2F4E86; --tag-blue-ink:#DCE8FF; --tag-gold-bg:#6B5320; --tag-gold-ink:#FFE9B0; --tag-green-bg:#245C36; --tag-green-ink:#D2F2DB; --tag-neu-bg:#463779; --tag-neu-ink:#EDE6FA;
  color-scheme:dark;
}
/* Pastel pink: blush ground, cream cards, plum-rose text, one rose accent.
   Every pair below keeps at least 4.5:1 contrast for body text. */
:root[data-theme="pink"]{
  --bg:#FBEEF2; --surface:#FFF9FB; --surface-2:#F9E6EC; --surface-3:#F2D8E1;
  --fg:#55293F; --fg-soft:#845266; --fg-faint:#AE8496;
  --rule:#EFD2DC; --rule-soft:#F6E3EA;
  --lav:#D8B9E4; --lav-soft:#F0DFF3; --pink:#F7C3D2; --pink-ink:#9E3C5C; --blue:#C3D8F1; --blue-ink:#3A5C8C;
  --gold:#E9C784; --gold-soft:#F9EBCC; --gold-ink:#55293F;
  --primary:#B8496D; --primary-ink:#FFF7F9;
  --link:#A93F63; --picked-ink:#55293F; --ok:#2E7D46; --err:#B4384E;
  --card-bg:#FFF6F2; --card-ink:#55293F;
  --back-1:#B8496D; --back-2:#CF6A8B;
  --wands-ink:#B04A2E; --cups-ink:#3A6BA8; --swords-ink:#6B6F86; --pentacles-ink:#3D7A48; --major-ink:#8A4B9E;
  --shade:rgba(85,41,63,.16);
  --tag-pink-bg:#F9D3DE; --tag-pink-ink:#6A2440; --tag-blue-bg:#D8E4F7; --tag-blue-ink:#2A4A78; --tag-gold-bg:#F9EBCC; --tag-gold-ink:#5C4312; --tag-green-bg:#D6EEDC; --tag-green-ink:#1F5A32; --tag-neu-bg:#F2D8E1; --tag-neu-ink:#55293F;
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0}
body{overflow-x:clip}
img,svg{max-width:100%}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
/* Type scale (one for the whole app):
   display face for titles, body face for everything else.
   h1 28/1.2 (-.01em)  screen title        h2 21/1.25  section      h3 17/1.3  card title
   body 16/1.55        paragraphs          .note/.tip 14.5/1.5  instructions  .hint/.faint 13.5/1.45  secondary
   .eyebrow 12/1.3 bold, +.06em uppercase (VI: normal case, +.02em)   nav 10.5 bold */
/* A column, so the footer can be pushed to the foot of the screen on a short
   page instead of floating up under the last card. The padding is the height
   of the navigation bar, and because every box here measures border to
   border, the footer's last line always ends the same distance above it. */
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
a{color:var(--link)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;width:100%;max-width:100%;-webkit-appearance:none;appearance:none;margin:0}
/* iOS renders date and time fields as small centred pills: give them the same box as every other field. */
/* Every field here has the native look stripped, which for a checkbox also
   takes the tick with it. So the box draws its own: a filled square in the
   theme's accent with the tick cut out of it, which stays legible in the
   light theme, the dark one and the pink one. */
input[type=checkbox]{width:22px;height:22px;flex:none;padding:0;border:1.6px solid var(--rule);border-radius:7px;background:var(--surface);display:inline-grid;place-content:center;cursor:pointer;transition:background .12s,border-color .12s}
input[type=checkbox]::before{content:'';width:12px;height:12px;transform:scale(0);transition:transform .12s ease-out;background:var(--primary-ink);clip-path:polygon(14% 46%,2% 60%,38% 96%,98% 20%,86% 8%,38% 70%)}
input[type=checkbox]:checked{background:var(--primary);border-color:var(--primary)}
input[type=checkbox]:checked::before{transform:scale(1)}
input[type=checkbox]:focus-visible{outline:2px solid var(--link);outline-offset:2px}
@media (prefers-reduced-motion:reduce){input[type=checkbox],input[type=checkbox]::before{transition:none}}
input[type=date],input[type=time]{display:flex;align-items:center;min-height:50px;line-height:1.3;text-align:left}
input::-webkit-date-and-time-value{text-align:left;min-height:1.3em}
button{-webkit-appearance:none;appearance:none;max-width:100%}
input:focus,textarea:focus,select:focus{outline:2px solid var(--lav);outline-offset:1px;border-color:transparent}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--fg-soft);margin:14px 0 6px;font-weight:600}
.hint{font-size:13.5px;line-height:1.45;color:var(--fg-faint);margin:6px 0 0}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;line-height:1.2}
:root[lang="vi"]{--display:"Lora",Georgia,"Times New Roman",serif}
:root[lang="vi"] h1{line-height:1.3}
:root[lang="vi"] h2,:root[lang="vi"] h3{line-height:1.35}
h1{font-size:28px;letter-spacing:-.01em}
h2{font-size:21px;line-height:1.25}
h3{font-size:17px;line-height:1.3}
p{margin:0 0 12px}
/* Only headings balance. A body paragraph must never be balanced or
   prettified: both narrow the whole block and leave the right side of the card
   empty, which is far worse than a short last line. */
h1,h2,h3,.eyebrow{text-wrap:balance}
/* Paragraphs line up on both edges. Only a line that wraps is stretched and
   the last line of a block never is, so a one-line caption or a two-word note
   is untouched; nothing else has to be excluded by length. */
#main p,#main li,.note span,#foot .tagline{text-align:justify;text-justify:inter-word}
/* Blocks that are deliberately centred keep their own alignment. They are also
   the one place balancing belongs: a short centred block that wraps looks wrong
   when the second line holds a single word, and balancing evens the two out. */
#main .pick-head p,#main .paynote,#main #tour p,#main .treewrap p,#main .coinwrap p,#main .done p,#main .paywall p,#main .tap-hint{text-align:center}
#main .pick-head p,#main .tap-hint,#main #tour p,#main .paynote{text-wrap:balance}
/* And these read as labels rather than prose. */
#main .eyebrow,#main .date,#main .meta,#main .st,#main .kwl,#main .steps li{text-align:inherit;text-justify:auto}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}

/* ---- header ---- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--rule-soft);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-size:20px;letter-spacing:.02em;color:var(--fg);text-decoration:none}
.brand .lockup .word{font-size:20px}
.lockup{color:var(--fg);display:inline-flex;align-items:center;gap:10px;text-decoration:none}.lockup .avatar{width:42px;height:42px;border-radius:50%;box-shadow:0 1px 4px var(--shade);flex:none}.lockup .word{font-family:var(--display);font-size:21px;font-weight:500;letter-spacing:.02em;white-space:nowrap}
.tools{display:flex;gap:8px}
.pill{border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--fg-soft);background:var(--surface);min-width:40px;text-align:center}
.pill:active{background:var(--surface-2)}
.pill .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--pink-ink);margin-left:4px;vertical-align:middle}

/* ---- bottom nav ---- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--rule-soft);padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:grid;grid-template-columns:repeat(6,1fr);height:var(--nav-h);padding:0}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--fg-faint);font-size:10.5px;font-weight:600;white-space:nowrap;letter-spacing:.01em;position:relative}
.nav a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--link)}
.nav a .badge{position:absolute;top:8px;right:calc(50% - 20px);background:var(--pink-ink);color:#fff;font-size:10px;border-radius:999px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}

/* ---- common ---- */
main{padding:22px 0 30px}
#backbar{padding-top:12px}#backbar+main{padding-top:6px}#backbar .backlink{margin:0 0 0 -4px}
#homefoot{display:flex;gap:18px;flex-wrap:wrap;padding-bottom:26px;margin-top:-6px}#homefoot[hidden]{display:none}#homefoot .backlink{margin:0}
.sec{margin-bottom:26px}
.eyebrow{font-size:12px;line-height:1.3;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pink-ink);margin-bottom:8px}
:root[lang="vi"] .eyebrow{text-transform:none;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:600;font-size:15px;
  background:var(--surface-2);color:var(--fg);border:1px solid var(--rule);text-decoration:none;text-align:center;min-height:48px}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.btn.pink{background:var(--tag-pink-bg);color:var(--tag-pink-ink);border-color:transparent}
.btn.block{display:flex;width:100%}
.btn.sm{padding:8px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn svg{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600;color:var(--fg-soft);background:var(--surface)}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.chip[disabled]{opacity:.4;pointer-events:none}
.chip.tag{background:var(--tag-neu-bg);color:var(--tag-neu-ink);font-weight:600;padding:4px 10px;font-size:12.5px;border-color:transparent}
.chip.pink{background:var(--tag-pink-bg);color:var(--tag-pink-ink);border-color:transparent}
.chip.blue{background:var(--tag-blue-bg);color:var(--tag-blue-ink);border-color:transparent}
.chip.lav{background:var(--lav-soft);color:var(--fg);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--rule-soft);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 1px 0 var(--rule-soft)}
.muted{color:var(--fg-soft)}
.faint{color:var(--fg-faint);font-size:13.5px;line-height:1.45}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:30;
  background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 8px 24px var(--shade);opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1}
.banner{background:var(--surface-2);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
.banner button{color:var(--primary);font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;white-space:nowrap;border:1px solid var(--rule);border-radius:999px;padding:0 14px;min-height:38px;display:inline-flex;align-items:center;justify-content:center;line-height:1.2;font-size:13.5px;font-weight:600;color:var(--fg-soft);background:var(--surface)}
.tabs button.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.empty{text-align:center;color:var(--fg-faint);padding:24px 0}
.acc{border:1px solid var(--rule-soft);border-radius:14px;background:var(--surface);margin-bottom:10px;overflow:hidden}
.acc>button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;text-align:left;font-weight:600}
.acc>button>span{flex:1;min-width:0;overflow-wrap:anywhere}
.acc>button:after{flex:none}
.acc>button:after{content:"+";color:var(--fg-faint);font-size:20px;line-height:1}
.acc.open>button:after{content:"–"}
.acc .in{display:none;padding:0 16px 14px;color:var(--fg-soft);font-size:15px}
.acc.open .in{display:block}
.acc .in p{margin-bottom:10px}

/* ---- card faces ---- */
.face{display:block;position:relative}
.face svg{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 2px 10px var(--shade)}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px;margin:10px 0 4px;justify-items:center}
.mini .m{width:100%;max-width:84px;text-align:center;font-size:11px;color:var(--fg-soft);line-height:1.25;display:flex;flex-direction:column;align-items:center}
.mini .m .face{display:block;width:100%}.mini .m svg{width:100%;height:auto;display:block;margin-bottom:4px}
.mini button.m{display:flex}

/* ---- home / feed ---- */
.hello{background:linear-gradient(135deg,var(--lav-soft),var(--surface-2));border:1px solid var(--rule);border-radius:20px;padding:18px;margin-bottom:16px}
.hello h2{margin-bottom:6px}
.hello .sign{display:flex;gap:14px;align-items:center;margin:10px 0}
.hello .glyph{width:56px;height:56px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--primary);box-shadow:0 2px 8px var(--shade)}
.hello .sign b{font-size:18px;font-family:var(--display);font-weight:500}
.hello .sign .faint{margin-top:2px}
.hello .cardline{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;margin-top:12px;background:var(--surface);border-radius:14px;padding:10px 12px}
.hello .cardline .face svg{border-radius:4px}
.post{background:var(--surface);border:1px solid var(--rule-soft);border-radius:18px;padding:16px 18px;margin-bottom:16px}
.post .date{font-size:12.5px;color:var(--fg-faint);display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.post .date .pin{color:var(--pink-ink);font-weight:700}
.post h2{margin-bottom:10px}
/* A title in a teaser or a list is capped at two lines: three lines of a
   21px heading swamps the card. The full post keeps its whole title.
   Clamping switches the box to -webkit-box, which turns balancing off, so the
   lines are justified instead: every line but the last fills the width, which
   is what stops a title breaking after three words with the rest of the line
   left empty. */
/* One size for every post and activity title, chosen so a title of the length
   Nabu usually writes sits on a single line. Titles are not resized one by
   one any more: two posts side by side at different sizes read as a mistake. */
.post h2{text-align:justify;text-justify:inter-word}
.nb{white-space:nowrap}
/* The gap under the share row matches the gap above the date. */
.post .foot{margin-bottom:0}.post>*:last-child{margin-bottom:0}
.post h2.tclamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post .body p{margin:0 0 10px}
.post .body.clamp{max-height:7.6em;overflow:hidden;position:relative}
.post .body.clamp:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3em;background:linear-gradient(transparent,var(--surface))}
.post .more{color:var(--link);font-weight:700;font-size:14px;margin:2px 0 8px}
.post .markers{margin:8px 0 6px;font-size:14px;color:var(--fg-soft)}
.post .markers b{color:var(--fg)}
/* Rich post bodies: small headings, marks, title boxes, images and embedded video. */
.post .body h3{font-size:17px;margin:12px 0 6px;font-family:var(--display);font-weight:500}.post .body mark{background:var(--tag-gold-bg);color:var(--tag-gold-ink);padding:0 4px;border-radius:4px}.post .body u{text-decoration-thickness:2px;text-underline-offset:2px}
.post .body .callout{background:var(--surface-2);border-left:4px solid var(--lav);border-radius:10px;padding:10px 12px;margin:10px 0;font-weight:600}
.post .body img.pimg{display:block;max-width:100%;border-radius:12px;margin:8px 0;min-height:40px;background:var(--surface-2)}
.post .body .video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;margin:8px 0;background:#000}.post .body .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vlink{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px 12px;text-decoration:none;color:inherit;font-weight:600;margin:8px 0}
/* Editor toolbar in the dashboard. */
.tb{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}.tb .tbl{width:auto;flex:none}.tb button,.tb .tbl{border:1px solid var(--rule);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;background:var(--surface);cursor:pointer;color:var(--fg);min-height:34px;display:inline-flex;align-items:center;gap:4px}.tb mark{background:var(--tag-gold-bg);color:var(--tag-gold-ink);padding:0 3px;border-radius:3px}
.emojis{display:flex;flex-wrap:wrap;gap:2px;margin:0 0 8px}.emojis button{font-size:22px;padding:4px 6px;border-radius:8px}.emojis button:active{background:var(--surface-2)}
.post .foryou{display:inline-block;background:var(--tag-pink-bg);color:var(--tag-pink-ink);font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;margin-bottom:8px}
.post .foot{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--rule-soft);margin-top:8px;padding-top:8px}
.post .foot button{color:var(--fg-soft);font-size:13.5px;font-weight:600;padding:6px 10px;border-radius:8px}
.cta{background:linear-gradient(135deg,var(--surface-2),var(--surface-3));border:1px solid var(--rule);border-radius:18px;padding:18px;margin:6px 0 20px}
.cta h3{margin-bottom:6px}
.cta p{color:var(--fg-soft);font-size:14.5px}

.welcome{background:var(--surface);border:1px solid var(--rule-soft);border-radius:18px;padding:0;margin-bottom:18px;overflow:hidden}
.welcome .wtoggle{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;text-align:left}.welcome .wtoggle h2{margin:0;font-size:20px;min-width:0}.welcome .chev{color:var(--fg-faint);font-size:22px;line-height:1;flex:none}
.welcome .in{display:none;padding:0 18px 14px}.welcome.open .in{display:block}
.welcome p{margin-bottom:10px}
.welcome .sig{display:flex;justify-content:center;padding-top:6px}
.welcome .sig .avatar{width:56px;height:56px}.welcome .sig .word{font-size:24px}

.pickcta{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center;background:linear-gradient(135deg,var(--lav-soft),var(--surface));border:1.5px solid var(--lav);border-radius:20px;padding:16px;margin-bottom:16px;text-decoration:none;color:inherit}
.pickcta .fan3{position:relative;height:118px}
.pickcta .fan3 span{position:absolute;left:50%;bottom:0;width:62px;margin-left:-31px;transform-origin:50% 120%;display:block}
.pickcta .fan3 span:nth-child(2){z-index:2}
.pickcta .fan3 svg{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 8px var(--shade))}
.pickcta b{font-family:var(--display);font-weight:500;font-size:20px;display:block;margin-bottom:4px}
.pickcta p{color:var(--fg-soft);font-size:14px;margin-bottom:10px}
@media (max-width:380px){.pickcta{grid-template-columns:100px 1fr}}

.horo{background:var(--surface);border:1px solid var(--rule-soft);border-radius:18px;padding:16px;margin-bottom:12px}
.horo .hh{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.horo .hg{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;flex:none}
.horo h3{font-size:17px}
.horo .body p{margin:0 0 10px;font-size:15px;line-height:1.55}.horo .body p:last-child{margin-bottom:0}
.horo .body.clamp{max-height:7.5em;overflow:hidden;position:relative}
.horo .body.clamp:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3em;background:linear-gradient(transparent,var(--surface))}
.horo .more{color:var(--link);font-weight:700;font-size:14px;margin-top:4px}

/* ---- pick a card ---- */
.pick-head{text-align:center;margin-bottom:18px}
.pick-head h1{margin-bottom:8px}
.pick-head p{color:var(--fg-soft)}
/* Five topics: a third of the row each, so they always fall three above and
   two below, both rows centred, instead of one chip left alone. */
.focus{justify-content:center;margin:14px 0 22px}
.focus .chip{flex:0 0 calc((100% - 16px)/3);padding-left:6px;padding-right:6px;text-align:center}
.fan{position:relative;height:250px;margin:0 auto 34px;max-width:420px;perspective:1000px}
.fan .slot{position:absolute;left:50%;bottom:0;width:104px;height:170px;margin-left:-52px;transform-origin:50% 130%;transition:transform .35s ease}
.fan .slot button{width:100%;height:100%;display:block}
.fan .slot svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 12px var(--shade))}
.fan .slot.dim{opacity:.35;transform:translateY(20px) scale(.9)!important}
.fan .slot.chosen{z-index:5;transform:translateY(-30px) scale(1.05)!important}
/* The whole deck: 78 backs in a grid, tap any one. */
/* The deck as a carousel: swipe, the middle card grows, tap to pick. */
.fan.deck{position:static;height:auto;max-width:none;perspective:none;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:16px calc(50% - 46px) 14px;margin:0 -18px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fan.deck::-webkit-scrollbar{display:none}
.fan.deck .slot{position:relative;flex:0 0 92px;width:92px;height:150px;margin:0;scroll-snap-align:center;transform:scale(.68);transform-origin:50% 50%;opacity:.45;transition:transform .12s linear,opacity .12s linear;border-radius:6px;left:auto;bottom:auto}
.fan.deck{cursor:grab}.fan.deck.grabbing{cursor:grabbing}.fan.deck .slot button{cursor:pointer}
@media (hover:hover){.fan.deck .slot:hover{transform:scale(1.12)!important;opacity:1!important;z-index:6}}
.fan.deck .slot svg{filter:drop-shadow(0 4px 8px var(--shade))}.fan.deck .slot.near{box-shadow:0 0 0 2px var(--lav)}
.fan.deck .slot.chosen{box-shadow:0 0 0 3px var(--primary);transform:scale(1.1)!important;opacity:1!important;z-index:5}.fan.deck .slot.dim{opacity:.25!important}
.deckbar{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 8px}.deckbar .btn{min-height:36px;padding:0 14px;font-size:18px;border-radius:999px}.deckbar span{min-width:64px;text-align:center;font-weight:600}
.teaser{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--tag-gold-bg);color:var(--tag-gold-ink);border-radius:14px;padding:12px 14px;margin:0 0 14px;font-size:14px}.teaser span{flex:1 1 200px}.teaser .btn{flex:none}
.tap-hint{text-align:center;color:var(--fg-faint);font-size:13.5px;margin:0 0 12px;min-height:1.4em}
.reveal{margin-top:10px}
.hero{display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center;margin-bottom:18px}
.hero .flip{perspective:900px}
.hero .flip .inner{position:relative;transform-style:preserve-3d;animation:flip .8s ease forwards}
.hero .flip .fr,.hero .flip .bk{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.hero .flip .bk{position:absolute;inset:0;transform:rotateY(180deg)}
@keyframes flip{from{transform:rotateY(180deg)}to{transform:rotateY(0)}}
.hero .name{font-family:var(--display);font-size:26px;line-height:1.15;overflow-wrap:anywhere}
.hero>div:last-child{min-width:0}
.hero .en{color:var(--fg-soft);font-size:14px;margin-top:4px}
.hero .meta{margin-top:8px;font-size:12.5px;color:var(--fg-faint)}
.hero .meta i{font-style:normal;font-weight:700}
.ins{background:var(--surface);border:1px solid var(--rule-soft);border-radius:18px;padding:18px;margin-bottom:12px}
.ins h3{color:var(--pink-ink);font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.02em;margin-bottom:8px}
.ins p{margin-bottom:10px}
.ins p:last-child{margin-bottom:0}
.ins .scene{font-style:italic;color:var(--fg-soft);font-size:14.5px}
.ins .qa{border-left:3px solid var(--gold);padding:2px 0 2px 12px;margin:0 0 12px}
.ins .qa .q{font-weight:700;margin-bottom:4px}
.ins .qa .a{color:var(--fg);margin:0}
.src{font-size:12.5px;color:var(--fg-faint);margin:6px 0 16px}
.m-wands{color:var(--wands-ink)}.m-cups{color:var(--cups-ink)}.m-swords{color:var(--swords-ink)}.m-pentacles{color:var(--pentacles-ink)}.m-major{color:var(--major-ink)}

/* ---- learn ---- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--rule-soft);border-radius:16px;padding:14px;text-align:left;display:block;text-decoration:none;color:inherit}
.tile .ic{font-size:26px;margin-bottom:6px}
.tile b{display:block;font-family:var(--display);font-weight:500;font-size:17px;overflow-wrap:anywhere}
.tile span{font-size:12.5px;color:var(--fg-faint)}
.tile.rec{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.deckgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.deckgrid button{display:block;text-align:center;font-size:11.5px;color:var(--fg-soft);line-height:1.2}
.deckgrid button svg{display:block;width:100%;height:auto;border-radius:5px;margin-bottom:4px;box-shadow:0 2px 8px var(--shade)}
.detail .hero{margin-top:6px}
.kwl{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.kwl span{background:var(--surface-2);border-radius:8px;padding:4px 9px;font-size:13.5px}
.kwl.neg span{background:transparent;border:1px solid var(--rule)}
/* Three planets to a row, so the rows do not break in a different place in
   each language the way a wrapping strip of chips did. */
.plgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.plgrid .chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:9px 4px;text-align:center;font-size:12.5px;line-height:1.2;min-width:0}
.plgrid .chip .g{font-size:21px;line-height:1;color:var(--link)}
.plgrid .chip b{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.plgrid .chip.on{border-color:var(--primary);background:var(--surface-2);color:var(--fg);box-shadow:0 0 0 1px var(--primary) inset}
/* Ten of them, so the last row holds one. It goes in the middle rather than
   hanging off the left. */
.plgrid > :last-child:nth-child(3n+1){grid-column:2}
/* Every section of the price list has the same head: a numbered disc, a
   title, one line of explanation. */
.pricesec{margin-bottom:30px}
#main .pricesec h2{display:flex;align-items:center;gap:9px;font-size:19px;margin:0 0 4px}
.pricesec h2 i{flex:none;width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--primary-ink);font-style:normal;font-size:13px;font-weight:700;display:grid;place-content:center;font-family:var(--body)}
#main .pricesec>.hint{margin:0 0 12px}
.pricesec .paynote{margin-bottom:12px}
/* The free half, all one shape. */
.freegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.freegrid .fg{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;padding:11px 5px;text-decoration:none;color:inherit;min-width:0}
.freegrid .fg .ic{height:26px;display:grid;place-content:center;font-size:21px;line-height:1}
.freegrid .fg .ic .pickico{width:16px;height:27px}
.freegrid .fg .ic .lovemark{width:24px;height:24px}
.freegrid .fg .ic .pileico{width:26px;height:21px}
.freegrid .fg b{font-size:11.5px;font-weight:600;line-height:1.25;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.freegrid .fg .s{font-size:10.5px;line-height:1.25;color:var(--fg-faint);text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.signlist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.signlist button{background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;padding:10px 6px;text-align:center}
.signlist button .g{font-size:26px;color:var(--link);display:block}
.signlist button b{font-size:13px;display:block;font-weight:600}
.signlist button span{font-size:11px;color:var(--fg-faint)}
.signlist button.me{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink) inset}
.spread-d{display:flex;justify-content:center;margin:8px 0 12px}
.spread-d svg{max-width:100%;height:auto}
.guide h2{margin:14px 0 6px}
.guide .lead{color:var(--fg-soft);font-size:15.5px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--rule-soft);vertical-align:top}
.tbl td:first-child{font-weight:600;white-space:nowrap}

/* ---- services / prices ---- */
.svc{background:var(--surface);border:1.5px solid var(--rule);border-radius:18px;padding:14px 14px 10px;margin-bottom:12px;max-width:100%;overflow:hidden}
.svc .t>div{min-width:0}
.svc.blue{border-color:var(--blue)}.svc.lav{border-color:var(--lav)}.svc.pink{border-color:var(--pink)}.svc.gold{border-color:var(--gold)}
.svc.on{box-shadow:0 0 0 2px var(--primary) inset}
.svc .t{display:flex;gap:10px;align-items:center;margin-bottom:8px}
/* One tile, one size, whatever goes in it - a drawing, an emoji, a glyph.
   Before this the icons were whatever size their own content happened to be,
   so nothing lined up with the title beside it. */
.svc .t .ic{flex:none;width:46px;height:46px;border-radius:14px;background:var(--surface-2);display:grid;place-content:center;font-size:23px;line-height:1}
.svc .t .ic svg{display:block}
.svc .t .ic .lovemark{width:28px;height:28px}
.svc .t .ic .pileico{width:28px;height:23px}
.svc .t b{font-family:var(--display);font-weight:600;font-size:16.5px;line-height:1.3;display:block}
/* One short line under the name, never a paragraph: the long description
   belongs on the page you buy, not in a list you are scanning. */
.svc .t .tag{font-size:12.5px;line-height:1.4;color:var(--fg-soft);margin-top:2px}
.svc .pk{display:flex;flex-direction:column;gap:6px}
.svc .pkg{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 10px;width:100%;max-width:100%;text-align:left;background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:9px 12px;font-size:14.5px;overflow:hidden}
.svc .pkg b{font-family:var(--body);font-weight:700;white-space:nowrap;margin-left:auto}
.svc .pkg>span{flex:1 1 150px}
.svc .pkg span{min-width:0;overflow-wrap:anywhere}
.svc button.pkg.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.paynote{background:var(--tag-gold-bg);color:var(--tag-gold-ink);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;text-align:center}

/* ---- demo lessons ---- */
.demo-head{margin:6px 0 20px;padding:14px 16px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:16px}
.demo-head .chip{display:inline-block;margin-bottom:10px}
.demo-head p{margin:0}
.lesson{margin-bottom:18px}
.lesson>button{background:var(--lav-soft);font-family:var(--display);font-weight:500;font-size:17px;padding:16px 18px}
.lesson .in{padding:18px 16px 20px}
.lesson .in .guide .lead{margin-top:0}
.lesson .in .visual{margin:18px 0}
.lesson .in .detail .hero{margin:4px 0 18px}
.lesson .in .ai{margin-top:18px}
#unlockwrap{margin-top:28px!important}
#unlockwrap .paywall{margin-top:0}

/* ---- footer ---- */
.foot{margin-top:auto;border-top:1px solid var(--rule-soft);padding:22px 0 26px;color:var(--fg-soft);font-size:13px}
.foot .wrap{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.foot svg{width:150px;height:40px;flex:none}
.foot b{color:var(--fg)}
.foot .links{margin-top:4px;display:flex;flex-wrap:nowrap;gap:6px;white-space:nowrap;font-size:12.5px;overflow:hidden}.foot .links a{flex:none}
.foot .links a{font-weight:600}
.foot .links .sico{width:17px;height:17px}
.foot .copy{margin-top:4px;color:var(--fg-faint);font-size:12px}

/* ---- lessons ---- */
.lessons{display:flex;flex-direction:column;gap:8px}
.lsn{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;padding:12px 14px;text-decoration:none;color:inherit}
.lsn .num{width:30px;height:30px;border-radius:50%;background:var(--lav-soft);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.lsn .tt{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.lsn .chk{color:var(--fg-faint);font-size:18px}
.lsn.done .num{background:var(--tag-green-bg);color:var(--tag-green-ink)}
.lsn.done .chk{color:#2E7D46}
.visual{margin:14px 0 18px}
.visual h3{margin:16px 0 8px}
.vstrip{display:flex;align-items:flex-start;gap:10px;overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.vstrip::-webkit-scrollbar{height:6px}.vstrip::-webkit-scrollbar-thumb{background:var(--rule);border-radius:3px}
.vt{flex:none;width:112px;text-align:center;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;align-items:center}
.vt svg{display:block;width:100%;height:auto;border-radius:6px;box-shadow:0 3px 10px var(--shade);margin-bottom:6px}
.vt b{display:block;width:100%;font-size:12.5px;line-height:1.2;font-weight:600;min-height:2.4em;overflow-wrap:anywhere}
.vt span{display:block;width:100%;font-size:11px;color:var(--fg-faint);line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
.vt .tone{display:inline-block;font-style:normal;font-size:10.5px;font-weight:700;border-radius:6px;padding:3px 7px;margin-top:4px}
.tone-pos .tone,.tk.tone-pos{background:var(--tag-green-bg);color:var(--tag-green-ink)}.tone-neu .tone,.tk.tone-neu{background:var(--tag-neu-bg);color:var(--tag-neu-ink)}.tone-neg .tone,.tk.tone-neg{background:var(--tag-pink-bg);color:var(--tag-pink-ink)}
.tonekey{display:flex;gap:6px;margin-bottom:8px}.tk{font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px}
.journey .stage{background:var(--surface);border:1px solid var(--rule-soft);border-radius:16px;padding:12px 12px 4px;margin-bottom:12px}
.journey .stage-h{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:17px;margin-bottom:8px}
.journey .stage-h .num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--body);font-size:13px;font-weight:700;color:#fff}
.journey .s0 .num{background:#5B8DD6}.journey .s1 .num{background:#8A5CB8}.journey .s2 .num{background:#C4557A}
.wheel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.wheel .w{background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;padding:10px 4px;text-align:center;opacity:.45}
.wheel .w.on{opacity:1;border-color:var(--lav)}
.wheel svg{width:44px;height:48px;display:block;margin:0 auto 4px}
.wheel b{display:block;font-size:13px}.wheel span{font-size:11px;color:var(--fg-faint)}
.court{display:grid;grid-template-columns:52px repeat(4,1fr);gap:6px;align-items:center}
.court .ch{text-align:center;font-size:11px;font-weight:700;color:var(--fg-soft)}
.court .rh{font-size:12px;font-weight:700;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
.court .cc svg{display:block;width:100%;height:auto;border-radius:5px;box-shadow:0 2px 8px var(--shade)}
.vgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.vgrid .vg svg{display:block;width:100%;height:auto;border-radius:4px;box-shadow:0 2px 6px var(--shade)}
.pairs{display:flex;flex-direction:column;gap:10px}
.pair{background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;padding:12px;display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
.pair .pf{display:flex;align-items:center;gap:6px}
.pair .pf svg{width:64px;height:auto;border-radius:4px;box-shadow:0 2px 8px var(--shade)}
.pair .pf span{font-size:20px;color:var(--fg-faint)}
.pair p{margin:0;font-size:14px;min-width:0;overflow-wrap:anywhere}
.spreads-v{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.ci{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;padding:7px 0;border-top:1px solid var(--rule-soft)}.ci>span{flex:1 1 140px}.ci b{margin-left:auto}.ci>span{flex:1;min-width:0}.ci b{white-space:nowrap}.ci .x{background:none;border:1px solid var(--rule);border-radius:50%;width:28px;height:28px;font-size:12px;color:var(--fg-soft)}.ci.total{border-top:2px solid var(--rule);font-weight:700}.ci small.warn,.tpick .warn{color:#B04A2E;font-size:12.5px;font-weight:600}.ci small.ok,.tpick .ok{color:#2E7D46;font-size:12.5px;font-weight:600}
.tpick{margin:14px 0 18px}.tpick h3{margin:0 0 8px;font-size:15.5px}
.topic{display:block;width:100%;max-width:100%;text-align:left;background:var(--surface);border:1px solid var(--rule-soft);border-radius:16px;padding:14px 16px;margin-bottom:10px;overflow:hidden}
.topic.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
.topic .t{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.topic .t>span:last-child{min-width:0;overflow-wrap:anywhere}
.topic .t .n{color:var(--fg-faint);font-weight:500;font-size:13px}
.topic .t .ic{font-size:20px}
.topic ol{margin:10px 0 0;padding-left:22px;color:var(--fg-soft);font-size:14.5px;display:none;text-align:left;list-style:decimal outside}
.topic.open ol{display:block}
.topic ol li{margin-bottom:4px}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{position:relative;padding-left:36px;margin-bottom:10px;color:var(--fg-soft)}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--lav-soft);color:var(--fg);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.msgbox{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;max-width:100%;line-height:1.5;background:var(--surface-2);border:1px dashed var(--rule);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--fg-soft);margin:12px 0}
.cal{background:var(--surface);border:1px solid var(--rule-soft);border-radius:18px;padding:14px;margin-bottom:12px}
.cal .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal .head b{font-family:var(--display);font-weight:500;font-size:18px}
.cal .head button{width:36px;height:36px;border-radius:50%;background:var(--surface-2);font-size:18px}
.cal .dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--fg-faint);text-align:center;margin-bottom:4px;font-weight:600}
.cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .d{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;color:var(--fg-faint);position:relative}
.cal .d.has{color:var(--fg);font-weight:600;background:var(--surface-2)}
.cal .d.has:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--pink-ink);position:absolute;bottom:6px}
.cal .d.today{box-shadow:0 0 0 1px var(--lav) inset}
.cal .d.sel{background:var(--primary);color:var(--primary-ink)}
.cal .d.sel:after{background:var(--primary-ink)}
.cal .d.off{opacity:.35}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slots button{border:1px solid var(--rule);border-radius:12px;padding:10px 6px;font-weight:600;font-size:14px;background:var(--surface)}
.slots button.on{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.slots button.taken{opacity:.35;text-decoration:line-through;pointer-events:none}
.picked{display:flex;align-items:center;gap:10px;background:var(--tag-gold-bg);color:var(--tag-gold-ink);border-radius:12px;padding:10px 14px;font-weight:600;margin-top:10px}

/* ---- me / auth / chat ---- */
.avatar{width:56px;height:56px;border-radius:50%;background:var(--lav-soft);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px;color:var(--fg)}
.me-head{display:flex;gap:14px;align-items:center;margin-bottom:16px}
.me-head b{font-size:18px;font-family:var(--display);font-weight:500;display:block}
.providers{display:flex;flex-direction:column;gap:8px}
.chat{display:flex;flex-direction:column;gap:8px;min-height:200px;max-height:60vh;overflow:auto;padding:6px 2px}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--primary);color:var(--primary-ink);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.reveal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}.reveal-top .eyebrow{margin:0}
.msg .t{display:block;font-size:10.5px;opacity:.7;margin-top:3px}.msg .who{display:block;font-size:11px;font-weight:700;opacity:.75;margin-bottom:2px}
.thr{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--rule-soft);border-radius:16px;padding:12px 14px;margin-bottom:8px}.thr.unread{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}
.thr .av,.thr-head .av{width:40px;height:40px;border-radius:50%;background:var(--lav-soft);color:var(--fg);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}.thr .body{flex:1;min-width:0;display:flex;flex-direction:column}.thr b{font-size:15px}.thr i{font-style:normal;font-weight:500;color:var(--fg-faint);font-size:12.5px}.thr .mail{font-size:12px;color:var(--fg-faint)}.thr .prev{font-size:13.5px;color:var(--fg-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thr.unread .prev{color:var(--fg);font-weight:600}
.thr .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}.thr .when{font-size:11px;color:var(--fg-faint)}.thr .n{background:var(--pink-ink);color:#fff;font-size:11px;border-radius:999px;min-width:20px;height:20px;line-height:20px;text-align:center;padding:0 6px;font-weight:700}
.thr-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}.thr-head b{display:block}.thr-head i{font-style:normal;color:var(--fg-faint);font-size:12.5px;font-weight:500}
.tabs button{position:relative}.tabs .tb{display:inline-block;margin-left:6px;background:var(--pink-ink);color:#fff;font-size:10.5px;border-radius:999px;min-width:17px;height:17px;line-height:17px;text-align:center;padding:0 5px;vertical-align:1px}
.admin-sum .cnt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 10px}.admin-sum .cnt a{background:var(--surface-2);border-radius:14px;padding:12px;text-align:center;text-decoration:none;color:inherit}.admin-sum .cnt b{display:block;font-size:26px;font-family:var(--display);color:var(--link)}.admin-sum .cnt span{font-size:12.5px;color:var(--fg-soft)}
.chatbar{display:flex;gap:8px;margin-top:10px;align-items:flex-end}.chatbar .emojis{width:100%}
.chatbar textarea{min-height:44px;max-height:120px;border-radius:14px;padding:10px 14px}
.chatbar button{flex:none}
.chatbar .att-btn{padding:8px 10px;min-height:44px;font-size:18px;cursor:pointer}
.chatbar .att-btn.rec{background:var(--tag-pink-bg);color:var(--tag-pink-ink);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.msg .att{display:block;max-width:220px;border-radius:10px;margin-bottom:6px}
.msg audio.att{width:220px}
/* A booking as a card: when, status, every package on its own line, the total, then the details. */
.bk{display:block;background:var(--surface);border:1px solid var(--rule-soft);border-radius:14px;padding:12px 14px;margin-bottom:10px;font-size:14px;overflow-wrap:anywhere}
.bk .bkh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.bk ul{margin:8px 0 4px;padding-left:18px}.bk li{margin:3px 0}.bk li small{color:var(--fg-soft)}
.bk .tot{display:flex;justify-content:space-between;border-top:1px solid var(--rule-soft);padding-top:6px;margin-top:4px;font-weight:700}.bk .meta{margin:6px 0 0;color:var(--fg-soft);font-size:13px}.bk .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.bk .acts .wide{grid-column:1/-1}.bk .chg{background:var(--tag-gold-bg);color:var(--tag-gold-ink);border-radius:10px;padding:8px 10px;margin-top:8px;font-weight:600}
.bkcal{margin-bottom:12px}.bkcal .d.has:after{background:var(--pink-ink)}.bkcal .d .n{position:absolute;top:3px;right:5px;font-size:9px;font-weight:700;color:var(--pink-ink)}
.upnext{display:flex;gap:10px;align-items:center;background:var(--tag-gold-bg);color:var(--tag-gold-ink);border-radius:14px;padding:12px 14px;margin-bottom:14px;text-decoration:none;font-weight:600}.upnext .ic{font-size:24px}
.st{font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;background:var(--surface-3);white-space:nowrap}
.st.confirmed{background:var(--tag-green-bg);color:var(--tag-green-ink)}.st.declined{background:var(--tag-pink-bg);color:var(--tag-pink-ink)}.st.requested{background:var(--tag-gold-bg);color:var(--tag-gold-ink)}

/* ---- admin ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;max-height:260px;overflow:auto;padding:4px;border:1px solid var(--rule-soft);border-radius:12px}
.grid button{display:block;width:100%;border-radius:6px;overflow:hidden;position:relative;font-size:10px;color:var(--fg-soft);line-height:1.15;text-align:center}
.grid button.on{outline:3px solid var(--primary);outline-offset:-1px}
.grid button svg{display:block;width:100%;height:auto;border-radius:4px}
.plist .it{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--rule-soft);font-size:14px}
.plist .it .tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .it .d{color:var(--fg-faint);font-size:12px}
.week{display:grid;grid-template-columns:1fr;gap:8px}
.week .wd{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.week .wd b{display:block;margin-bottom:6px;font-size:14px}
.week .wd .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.week .wd .chips .chip{padding:6px 2px;font-size:12.5px;text-align:center}
/* Dashboard rows: a field and its button on one line, two fields side by side, buttons in a tidy grid. */
.row.nw{flex-wrap:nowrap;align-items:center}.row.nw>input,.row.nw>select{flex:1;min-width:0}.row.nw>.btn,.row.nw>button{flex:none}
/* Two fields side by side: each cell is a column and the field sits at the
   bottom of it, so a label that wraps onto two lines still leaves both
   inputs on the same line. */
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}.two label.f{margin-top:8px}
.two>div{display:flex;flex-direction:column;min-width:0}.two>div>input,.two>div>select,.two>div>textarea{margin-top:auto}
.cardnav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 18px}
.detail .hero + .cardnav{margin-top:12px}
.cardnav a{display:flex;align-items:center;gap:7px;min-width:0;padding:11px 12px;border:1px solid var(--rule);border-radius:14px;background:var(--surface);color:var(--fg);text-decoration:none;font-size:13.5px;font-weight:600}
.cardnav a.next{justify-content:flex-end;text-align:right}.cardnav a b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cardnav .ar{flex:none;color:var(--fg-faint)}.cardnav .cn-sp{display:block}
.meacts{margin-bottom:14px}.meacts .row{margin-top:8px}
/* Shows itself once a screen has scrolled far enough to be worth a shortcut. */
#totop{position:fixed;right:14px;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);color:var(--fg);font-size:19px;line-height:1;box-shadow:0 3px 12px var(--shade);cursor:pointer}
#totop:active{transform:scale(.94)}
.coinwrap{text-align:center}.coinwrap input{text-align:center}
.coin{width:150px;height:150px;margin:16px auto 4px}.coin svg{width:100%;height:100%;display:block}
.coin.spin{animation:coinflip 1s cubic-bezier(.34,.85,.3,1)}
@keyframes coinflip{0%{transform:rotateY(0deg) scale(1)}55%{transform:rotateY(1080deg) scale(1.1)}100%{transform:rotateY(1800deg) scale(1)}}
/* The answer is drawn on the coin; this only announces it to screen readers. */
.coinres{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.coin{margin-bottom:14px}
.treewrap{text-align:center}
.tree{position:relative;display:block;width:100%;max-width:300px;margin:0 auto 6px;padding:0;border:0;background:none;cursor:pointer}
.tree svg{width:100%;height:auto;display:block}
.tree.sway svg{animation:treesway .7s ease-in-out 2;transform-origin:50% 92%}
@keyframes treesway{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.2deg)}75%{transform:rotate(2.2deg)}}
.petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.petals i{position:absolute;top:22%;width:11px;height:11px;background:#F7A8C4;border-radius:11px 1px 11px 1px;opacity:0;animation-name:petalfall;animation-timing-function:cubic-bezier(.3,.5,.5,1);animation-fill-mode:forwards}
@keyframes petalfall{0%{opacity:0;transform:translate3d(0,0,0) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translate3d(var(--dx),150px,0) rotate(460deg)}}
.treemsg{background:var(--tag-gold-bg);color:var(--tag-gold-ink);border:1.5px solid var(--gold);border-radius:16px;padding:14px 16px;margin:8px 0 14px}
.treemsg .eyebrow{color:inherit;opacity:.75;margin-bottom:6px}
.treemsg p{margin:0;font-family:var(--display);font-size:19px;line-height:1.45}
.luckbox{margin-top:12px}.luckbox .lead{font-weight:600;margin:0 0 4px}.luckbox .btn.block{margin-top:8px}
.sico{width:17px;height:17px;display:block}
.links .sl{display:inline-flex;align-items:center;text-decoration:none;vertical-align:-3px}
/* The phases are buttons now, so they need the plain-button reset. */
.phases .ph{font:inherit;color:inherit;cursor:pointer}
/* A sale: the old price struck through, the new one beside it, a banner on
   the home screen and a small tag on the tabs where money is spent. */
.was{text-decoration:line-through;color:var(--fg-faint);font-weight:400;margin-right:5px}
.now{color:var(--pink-ink);font-weight:700}
.salebar{display:flex;align-items:center;gap:9px;background:var(--tag-pink-bg);color:var(--tag-pink-ink);border-radius:14px;padding:10px 12px;margin-bottom:14px;text-decoration:none;font-size:13.5px}
.salebar .tag{font-weight:700;white-space:nowrap}.salebar .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.salebar .go{white-space:nowrap;font-weight:600;opacity:.85}
.nav a{position:relative}.nav .saletag{position:absolute;top:-1px;right:calc(50% - 20px);font-size:11px;line-height:1}
/* ---- looks, the pet, and the paid trees ---- */
.lookgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lookgrid.four{grid-template-columns:repeat(4,1fr);gap:7px}
.lookgrid.four .look{padding:9px 5px;gap:6px}
.lookgrid.four .look b{font-size:11px;line-height:1.25;text-align:center}
.lookgrid.four .lk-card{width:100%}.lookgrid.four .lk-tree{width:100%}.lookgrid.four .lk-coin{width:86%}
.lookgrid.four .lk-diary{width:100%;height:56px;padding:6px 5px}
.lookgrid.four .lk-lock{top:4px;right:5px;font-size:12px}.lookgrid.four .lk-on{top:4px;left:5px;font-size:12px}
/* The row that sits on the screen the look belongs to. */
.lookstrip .ls-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:2px}
.lookstrip .ls-h h3{margin:0}
.lookstrip .ls-h a{color:var(--gold-deep);font-weight:600;font-size:12.5px;text-decoration:none;white-space:nowrap}
.lookstrip .hint{margin-bottom:10px}
.look{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--rule-soft);border-radius:16px;padding:12px 10px;font:inherit;color:inherit;cursor:pointer}
.look.on{border-color:var(--primary);border-width:1.5px}
.look.locked .lk-card,.look.locked .lk-tree,.look.locked .lk-coin,.look.locked .lk-diary{opacity:.92}
.look.locked{border-style:dashed}
.look .lk-lock{background:var(--tag-gold-bg);border-radius:8px;padding:1px 4px}
.look b{font-size:13px;font-weight:600}
.look .lk-lock{position:absolute;top:8px;right:9px;font-size:15px}
.look .lk-on{position:absolute;top:8px;left:9px;color:var(--primary);font-weight:700}
.lk-card{display:block;width:64px}.lk-card svg{width:100%;height:auto;display:block;border-radius:6px}
.lk-tree{display:block;width:96px}.lk-tree svg{width:100%;height:auto;display:block}
.lk-coin{display:block;width:56px}.lk-coin svg{width:100%;height:auto;display:block}
.lk-diary{position:relative;display:block;width:64px;height:74px;border-radius:6px;border:1px solid var(--rule);padding:10px 8px;overflow:hidden;background:#FFFCF2}
.lk-diary i{position:relative;display:block;height:3px;border-radius:2px;background:#D8CDB4;margin-bottom:7px}
.lk-diary i:nth-child(2){width:78%}.lk-diary i:nth-child(3){width:56%}
/* Fireflies breathe, stars twinkle, butterflies drift: only on the paid trees. */
@keyframes flyglow{0%,100%{opacity:.2;r:2.4}50%{opacity:1;r:3.8}}
.fly.lit{animation:flyglow 2.4s ease-in-out infinite;filter:drop-shadow(0 0 5px rgba(255,233,168,.9))}
/* Each firefly wanders its own small loop on top of the glow. */
@keyframes drifting{0%,100%{transform:translate(0,0)}25%{transform:translate(9px,-7px)}50%{transform:translate(2px,-13px)}75%{transform:translate(-8px,-5px)}}
.drift{animation:drifting 7s ease-in-out infinite}.drift.still{animation:none}
/* Moonlight through the branches, and a star that falls across the galaxy. */
@keyframes shafting{0%,100%{opacity:.04}50%{opacity:.12}}
.shaft{animation:shafting 9s ease-in-out infinite}.shaft.still{animation:none}
@keyframes shooting{0%,72%{opacity:0;transform:translate(216px,4px) scale(.7)}76%{opacity:1}88%{opacity:0;transform:translate(56px,96px) scale(1)}100%{opacity:0;transform:translate(56px,96px) scale(1)}}
.shoot{animation:shooting 11s linear infinite}
/* Butterflies travel; leaves come down. */
/* Five paths, so no two butterflies trace the same loop, and none of them
   wanders far enough to leave the picture. */
@keyframes wing0{0%,100%{transform:translate(0,0)}25%{transform:translate(22px,-16px)}50%{transform:translate(34px,6px)}75%{transform:translate(10px,18px)}}
@keyframes wing1{0%,100%{transform:translate(0,0)}25%{transform:translate(-20px,12px)}50%{transform:translate(-30px,-10px)}75%{transform:translate(-8px,-20px)}}
@keyframes wing2{0%,100%{transform:translate(0,0)}30%{transform:translate(14px,20px)}60%{transform:translate(-16px,26px)}85%{transform:translate(-22px,6px)}}
@keyframes wing3{0%,100%{transform:translate(0,0)}25%{transform:translate(-24px,-14px)}55%{transform:translate(-10px,-28px)}80%{transform:translate(14px,-12px)}}
@keyframes wing4{0%,100%{transform:translate(0,0)}30%{transform:translate(26px,10px)}55%{transform:translate(6px,-22px)}80%{transform:translate(-18px,-6px)}}
.wing{animation-timing-function:ease-in-out;animation-iteration-count:infinite}
.wing.w0{animation-name:wing0}.wing.w1{animation-name:wing1}.wing.w2{animation-name:wing2}.wing.w3{animation-name:wing3}.wing.w4{animation-name:wing4}
.wing.still{animation:none}
@keyframes leaffalling{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translate(-26px,196px) rotate(320deg)}}
.leaffall{animation:leaffalling 8s linear infinite}
/* Spirit lights rising out of the firefly tree. */
@keyframes risinglight{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.95}100%{opacity:0;transform:translateY(-120px) scale(1.1)}}
.rise{animation:risinglight 8s ease-out infinite}
/* The galaxy's ring of stars turning, and its constellation breathing. */
@keyframes starwheel{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.starwheel{transform-origin:140px 94px;animation:starwheel 60s linear infinite}
@keyframes constellation{0%,100%{opacity:.18}50%{opacity:.75}}
.conste{animation:constellation 7s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.rise,.starwheel,.conste{animation:none}}
@keyframes twinkling{0%,100%{opacity:.3;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkling 3s ease-in-out infinite}.twinkle.still{animation:none}
@media (prefers-reduced-motion:reduce){.fly.lit,.drift,.shaft,.shoot,.wing,.leaffall,.twinkle,.flit{animation:none}}
@keyframes flitting{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-7px) rotate(5deg)}}
.flit{animation:flitting 3.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.flit.still{animation:none}
/* ---- the four diary papers ----
   Written as their own classes, not as `.diary.paper-x`, so the picker can
   show the same paper at preview size. Each is a different sheet rather than
   the same sheet in a different tint. */
/* Each paper is a fixed sheet, so everything written on it takes a fixed
   ink rather than the theme's. */

.diary.paper-plain .date,.diary.paper-ruled .date,.diary.paper-floral .date,
.diary.paper-plain .faint,.diary.paper-ruled .faint,.diary.paper-floral .faint,

.diary.paper-plain .mood,.diary.paper-ruled .mood,.diary.paper-floral .mood{background:rgba(255,255,255,.55);border-color:rgba(90,70,120,.16)}
.diary.paper-plain .linkbtn,.diary.paper-ruled .linkbtn,.diary.paper-floral .linkbtn{color:#8A3A5E}

/* Ruled ivory, with the red margin a school exercise book has. */
.paper-ruled{position:relative;background:repeating-linear-gradient(#FFFCEF 0px,#FFFCEF 25px,#DCCFB2 25px,#DCCFB2 26px)}
.paper-ruled::before{content:'';position:absolute;left:26px;top:0;bottom:0;width:1.5px;background:#E39AA0;opacity:.8}
/* Blush paper inside a flower frame, blossoms at the corners. */
.paper-floral{position:relative;background:#FFF7FA;box-shadow:inset 0 0 0 2px #F2A9BE,inset 0 0 0 5px #FFF7FA,inset 0 0 0 6.5px #F7C7D6}
.paper-floral::before,.paper-floral::after{content:'';position:absolute;width:22px;height:22px;background:radial-gradient(circle at 50% 50%,#F7A9C6 0 4px,transparent 4.5px),radial-gradient(circle at 50% 14%,#FBD3E1 0 5px,transparent 5.5px),radial-gradient(circle at 86% 50%,#FBD3E1 0 5px,transparent 5.5px),radial-gradient(circle at 50% 86%,#FBD3E1 0 5px,transparent 5.5px),radial-gradient(circle at 14% 50%,#FBD3E1 0 5px,transparent 5.5px);pointer-events:none}
.paper-floral::before{left:9px;top:9px}
.paper-floral::after{right:9px;bottom:9px}
/* A midnight page: gold stars, a crescent, and light ink over it. */
.paper-starry{position:relative;background:radial-gradient(circle at 12% 16%,#FFE9A8 0 1.6px,transparent 2px),radial-gradient(circle at 78% 12%,#FFE9A8 0 1.9px,transparent 2.3px),radial-gradient(circle at 34% 42%,#FFF3C4 0 1.3px,transparent 1.7px),radial-gradient(circle at 88% 56%,#FFE9A8 0 1.6px,transparent 2px),radial-gradient(circle at 22% 74%,#FFF3C4 0 1.5px,transparent 1.9px),radial-gradient(circle at 62% 88%,#FFE9A8 0 1.7px,transparent 2.1px),linear-gradient(160deg,#2E2756,#463C7E);color:#F3EEFF}
.paper-starry::before{content:'';position:absolute;right:16px;top:14px;width:20px;height:20px;border-radius:50%;background:#FFE9A8;box-shadow:6px 2px 0 -1px #2E2756 inset;pointer-events:none}
/* The diary in the midnight paper: everything on it goes light. */
.diary.paper-starry .date,.diary.paper-starry .faint,.diary.paper-starry p{color:#E4DCFA}
.diary.paper-starry textarea{background:rgba(255,255,255,.08);color:#F7F4FF;border-color:rgba(255,255,255,.28)}
.diary.paper-starry textarea::placeholder{color:#B8AEDC}
.diary.paper-starry .mood{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
.diary.paper-starry .mood.on{background:var(--gold);border-color:var(--gold)}
.diary.paper-starry .linkbtn{color:#FFD9E4}
/* The same papers at preview size: closer rules, a smaller frame. */
.lk-diary.paper-ruled{background-size:100% 10px;background-image:repeating-linear-gradient(#FFFCEF 0px,#FFFCEF 9px,#DCCFB2 9px,#DCCFB2 10px)}
.lk-diary.paper-ruled::before{left:11px}
.lk-diary.paper-floral{box-shadow:inset 0 0 0 1.5px #F2A9BE,inset 0 0 0 3.5px #FFF7FA,inset 0 0 0 4.5px #F7C7D6}
.lk-diary.paper-floral::before,.lk-diary.paper-floral::after{width:13px;height:13px}
.lk-diary.paper-floral::before{left:5px;top:5px}
.lk-diary.paper-floral::after{right:5px;bottom:5px}

/* ---- the luck companions ----
   The stage stacks three layers: the home behind, the halo of luck around it,
   and the companion on top. Everything else on the card explains, in the open,
   what each kind of care is worth. */
.petwrap{text-align:center}
.petstage{position:relative;width:min(288px,82vw);aspect-ratio:1/1;margin:0 auto 12px;border-radius:18px;overflow:hidden;background:var(--surface-2)}
.petstage .pethome{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.pethome{display:block;width:100%;height:auto}
.aura{position:absolute;left:8%;top:2%;width:84%;height:84%;border-radius:50%;z-index:1;background:radial-gradient(circle,var(--aura) 0%,transparent 68%);opacity:.85;animation:breathe 4.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.94);opacity:.6}50%{transform:scale(1.06);opacity:.95}}
.petart{position:relative;z-index:2;width:100%;height:auto;display:block}
/* A companion is never quite still: it breathes, and it lifts a paw now and
   then. */
/* One timeline, so nothing fights: four slow breaths, a crouch, a hop, and a
   settle. The squash works from the feet, the way weight does. */
.petstage .petart,.petpick .petart{transform-origin:50% 100%;animation:petalive 7.2s cubic-bezier(.37,0,.63,1) infinite}
@keyframes petalive{
  0%{transform:translateY(0) scaleY(1)}
  9%{transform:translateY(-3px) scaleY(1.025)}
  18%{transform:translateY(0) scaleY(1)}
  27%{transform:translateY(-3px) scaleY(1.025)}
  36%{transform:translateY(0) scaleY(1)}
  45%{transform:translateY(-2px) scaleY(1.02)}
  54%{transform:translateY(0) scaleY(1)}
  62%{transform:translateY(1px) scaleY(.93)}
  69%{transform:translateY(-15px) scaleY(1.07)}
  75%{transform:translateY(0) scaleY(.95)}
  80%{transform:translateY(0) scaleY(1.01)}
  84%{transform:translateY(0) scaleY(1)}
  93%{transform:translateY(-3px) scaleY(1.025)}
  100%{transform:translateY(0) scaleY(1)}
}
/* An eye closes for a moment now and then, which is most of what makes a
   drawn animal look awake. */
.petstage .petart .eyes{transform-box:fill-box;transform-origin:center;animation:blinking 6.4s ease-in-out infinite}
@keyframes blinking{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}96%{transform:scaleY(1)}}
.petstage .petart .ft.wav{transform-box:fill-box;transform-origin:20% 60%;animation:pawwave 5.8s ease-in-out infinite}
@keyframes pawwave{0%,62%,100%{transform:rotate(0) translateY(0)}70%{transform:rotate(-24deg) translateY(-5px)}78%{transform:rotate(6deg) translateY(-5px)}86%{transform:rotate(-20deg) translateY(-5px)}94%{transform:rotate(0) translateY(0)}}
@media (prefers-reduced-motion:reduce){.petstage .petart,.petpick .petart,.petstage .petart.myth,.petpick .petart.myth,.petstage .petart .ft.wav,.petstage .petart .eyes{animation:none}}
/* The companion stands to the left of centre, in front of its own place. */
.petstage .petart{position:absolute;left:5%;bottom:1%;width:68%;height:auto}
/* A spirit beast is lit from within, so it reads as the rarer thing. */
/* The glow used to be set on its own and replaced the breathing, which left
   the paid companions as the only still ones. Both run now, on different
   properties, and the spirit beast's timeline is the livelier of the two:
   it sways as it breathes and hovers at the top of its hop. */
/* No filter here, deliberately. A filter is drawn into a bitmap, and from then
   on it is the bitmap that gets moved - so the moment these were given a
   transform to animate, turning and scaling that bitmap made them soft while
   the unfiltered free companions stayed sharp. The glow is drawn inside the
   picture instead, as circles, and the drawing is redrawn from its own
   geometry on every frame. */
.petstage .petart.myth,.petpick .petart.myth{animation:mythalive 6.6s cubic-bezier(.37,0,.63,1) infinite}
@keyframes mythalive{
  0%{transform:translateY(0) rotate(0deg) scaleY(1)}
  8%{transform:translateY(-5px) rotate(-1.2deg) scaleY(1.03)}
  16%{transform:translateY(-1px) rotate(0deg) scaleY(1)}
  24%{transform:translateY(-6px) rotate(1.2deg) scaleY(1.03)}
  32%{transform:translateY(0) rotate(0deg) scaleY(1)}
  40%{transform:translateY(-4px) rotate(-1deg) scaleY(1.02)}
  48%{transform:translateY(0) rotate(0deg) scaleY(1)}
  56%{transform:translateY(2px) scaleY(.92)}
  64%{transform:translateY(-22px) rotate(2deg) scaleY(1.08)}
  71%{transform:translateY(-15px) rotate(-2deg) scaleY(1.04)}
  78%{transform:translateY(0) scaleY(.94)}
  84%{transform:translateY(0) scaleY(1.02)}
  92%{transform:translateY(-5px) rotate(0deg) scaleY(1.03)}
  100%{transform:translateY(0) rotate(0deg) scaleY(1)}
}
/* Each ring of light breathes at its own pace, so the glow never pulses as one
   flat disc. Only their opacity moves, which costs the drawing nothing. */
@keyframes glowout{0%,100%{opacity:.05}50%{opacity:.13}}
@keyframes glowmid{0%,100%{opacity:.09}50%{opacity:.21}}
@keyframes glowin{0%,100%{opacity:.15}50%{opacity:.32}}
@keyframes mythring{0%,100%{opacity:.32}50%{opacity:.8}}
.petart .glowoff.out{animation:glowout 5.6s ease-in-out infinite}
.petart .glowoff.mid{animation:glowmid 4.6s ease-in-out -1.1s infinite}
.petart .glowoff.in{animation:glowin 3.6s ease-in-out -2.2s infinite}
.petart .mythring{animation:mythring 3.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.petart .glowoff,.petart .mythring{animation:none}}
