# The iPhone app (ios-app/, Flutter) built and sent to TestFlight from a
# Codemagic Mac, so no Mac is needed here. Android is not built here: it stays
# the TWA around the same site.
#
# Codemagic, once:
#   - Team integrations > Developer Portal: the App Store Connect key named "codemagic".
#   - Global variables, group nabu_ios (all Secure):
#       CERTIFICATE_PRIVATE_KEY     contents of nabu-tarot-keys/ios_distribution_private_key
#       GOOGLE_SERVICE_INFO_PLIST   base64 of GoogleService-Info.plist for app.nabutarot.ios
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: ios-app
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - nabu_ios
      vars:
        BUNDLE_ID: app.nabutarot.ios
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: feature/ios-flutter
        - pattern: main
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - ios-app/
          - codemagic.yaml
    scripts:
      - name: Firebase config
        script: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
          fi
      - name: Packages
        script: flutter pub get
      - name: Tests
        script: flutter test
      - name: Signing - keychain
        script: keychain initialize
      - name: Signing - certificate and App Store profiles
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build
        script: |
          # Always higher than any earlier build: yy + day of year + hhmm (UTC).
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --build-number=$(date -u +%y%j%H%M)
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
