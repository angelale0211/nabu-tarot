# The Nabu Tarot app (app/, Flutter): the iPhone build is made and sent to
# TestFlight from a Codemagic Mac. The Android build is made locally on the
# owner's PC (flutter build appbundle) with the Play upload key.
#
# Codemagic, once:
#   - Team integrations > Developer Portal: the App Store Connect key named "codemagic".
#   - Global variables, group nabu_ios (all Secure):
#       CERTIFICATE_PRIVATE_KEY     contents of nabu-tarot-keys/ios_distribution_private_key
#       GOOGLE_SERVICE_INFO_PLIST   base64 of GoogleService-Info.plist for app.nabutarot.ios
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: app
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: stable
      # A fixed Xcode, not 'latest': the latest pool queues for hours when busy
      # (Codemagic support, 2026-10-12). 26.x meets Apple's iOS 26 SDK rule.
      xcode: 26.6
      cocoapods: default
      groups:
        - nabu_ios
      vars:
        BUNDLE_ID: app.nabutarot.ios
        # The home-screen widget (ios/TodayWidget). "0" builds the app without it.
        NABU_WIDGET: "1"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - app/
          - codemagic.yaml
    scripts:
      - name: Firebase config
        script: |
          # The variable may hold the file's base64 or its plain contents. A value
          # that is neither is reported and the app is built without Firebase
          # (no notifications) rather than failing the whole build.
          F=ios/Runner/GoogleService-Info.plist
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            case "$GOOGLE_SERVICE_INFO_PLIST" in
              *"<plist"*) printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > "$F" ;;
              *) printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | tr -d '[:space:]' | base64 --decode > "$F" 2>/dev/null || true ;;
            esac
            if ! plutil -lint "$F" >/dev/null 2>&1; then
              echo "WARNING: GOOGLE_SERVICE_INFO_PLIST is neither the plist nor its base64 - building without Firebase"
              rm -f "$F"
            else
              echo "GoogleService-Info.plist OK"
            fi
          fi
          sh ios/scripts/firebase_ids.sh
      - name: Version
        script: |
          # One version for the app and its widget. The build number is always
          # higher than any earlier build: yy + day of year + hhmm (UTC).
          echo "NABU_BUILD_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> $CM_ENV
          echo "NABU_BUILD_NUMBER=$(date -u +%y%j%H%M)" >> $CM_ENV
      - name: Packages
        script: flutter pub get
      - name: Widget
        script: |
          if [ "$NABU_WIDGET" = "1" ]; then ruby ios/scripts/add_widget.rb; else echo "widget off"; fi
      - name: Tests
        script: flutter test
      - name: Signing - keychain
        script: keychain initialize
      - name: Signing - certificate and App Store profiles
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          if [ "$NABU_WIDGET" = "1" ]; then
            app-store-connect bundle-ids create "$BUNDLE_ID.today" --name "Nabu Tarot Today" --platform IOS || true
            app-store-connect fetch-signing-files "$BUNDLE_ID.today" --type IOS_APP_STORE --create
          fi
          keychain add-certificates
          xcode-project use-profiles
      - name: Build
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define-from-file=firebase_defines.json \
            --build-name=$NABU_BUILD_NAME \
            --build-number=$NABU_BUILD_NUMBER
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
